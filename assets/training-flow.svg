<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520"><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#7c3aed"/></marker><style>.t{font-family:PingFang SC,Microsoft YaHei,sans-serif}.box{fill:#fff;stroke:#c4b5fd;stroke-width:2}.h{font-size:21px;font-weight:700;fill:#4c1d95}.p{font-size:15px;fill:#675e72}.l{stroke:#7c3aed;stroke-width:3;marker-end:url(#a)}</style></defs><rect width="1400" height="520" rx="24" fill="#f7f4fb"/><text class="t" x="700" y="55" text-anchor="middle" font-size="28" font-weight="700" fill="#211a49">业务人员从售票到回款的操作路径</text><g class="t"><rect class="box" x="45" y="130" width="235" height="150" rx="16"/><text class="h" x="162" y="175" text-anchor="middle">选择客户</text><text class="p" x="162" y="210" text-anchor="middle">长期客户：弹窗选择</text><text class="p" x="162" y="238" text-anchor="middle">一次性客户：点临时客户</text><rect class="box" x="330" y="130" width="235" height="150" rx="16"/><text class="h" x="447" y="175" text-anchor="middle">售票员下单</text><text class="p" x="447" y="210" text-anchor="middle">选票、确认联系人</text><text class="p" x="447" y="238" text-anchor="middle">选择预付款或挂帐</text><rect class="box" x="615" y="130" width="235" height="150" rx="16"/><text class="h" x="732" y="175" text-anchor="middle">系统出票</text><text class="p" x="732" y="210" text-anchor="middle">检查余额、额度和状态</text><text class="p" x="732" y="238" text-anchor="middle">生成订单与资金流水</text><rect class="box" x="900" y="130" width="235" height="150" rx="16"/><text class="h" x="1017" y="175" text-anchor="middle">财务回款</text><text class="p" x="1017" y="210" text-anchor="middle">选择待回款整笔订单</text><text class="p" x="1017" y="238" text-anchor="middle">处理多余到账金额</text><rect class="box" x="1185" y="130" width="170" height="150" rx="16"/><text class="h" x="1270" y="175" text-anchor="middle">查询核对</text><text class="p" x="1270" y="210" text-anchor="middle">查充值、消费</text><text class="p" x="1270" y="238" text-anchor="middle">退款与其他收入</text><path class="l" d="M280 205H320"/><path class="l" d="M565 205H605"/><path class="l" d="M850 205H890"/><path class="l" d="M1135 205H1175"/><rect x="250" y="345" width="900" height="100" rx="15" fill="#fff7ed" stroke="#fdba74"/><text x="700" y="382" text-anchor="middle" font-size="19" font-weight="700" fill="#9a3412">售后退款不需要改操作入口</text><text class="p" x="700" y="417" text-anchor="middle">系统根据原支付方式和挂帐是否已回款自动处理余额、挂帐和调账记录</text></g></svg>
