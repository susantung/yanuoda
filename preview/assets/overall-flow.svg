<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#1e1b4b"/><stop offset="1" stop-color="#7c3aed"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6z" fill="#8b5cf6"/></marker><style>.t{font-family:PingFang SC,Microsoft YaHei,sans-serif}.n{fill:#fff;stroke:#c4b5fd;stroke-width:2}.h{font-size:22px;font-weight:700;fill:#312e81}.p{font-size:16px;fill:#625a70}.line{stroke:#8b5cf6;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1400" height="650" fill="#f7f4fb"/><rect x="40" y="32" width="1320" height="72" rx="18" fill="url(#g)"/><text class="t" x="700" y="78" text-anchor="middle" font-size="30" font-weight="700" fill="white">散客合作伙伴业务闭环</text><g class="t"><rect class="n" x="70" y="170" width="240" height="125" rx="16"/><text class="h" x="190" y="215" text-anchor="middle">① 建立合作关系</text><text class="p" x="190" y="250" text-anchor="middle">企业 / 个人建档</text><text class="p" x="190" y="276" text-anchor="middle">临时客户使用公共账户</text><rect class="n" x="390" y="170" width="240" height="125" rx="16"/><text class="h" x="510" y="215" text-anchor="middle">② 售票确认</text><text class="p" x="510" y="250" text-anchor="middle">选择散客票与支付方式</text><text class="p" x="510" y="276" text-anchor="middle">出票前重校验状态</text><rect class="n" x="710" y="170" width="240" height="125" rx="16"/><text class="h" x="830" y="215" text-anchor="middle">③ 订单与资金</text><text class="p" x="830" y="250" text-anchor="middle">预付款扣减余额</text><text class="p" x="830" y="276" text-anchor="middle">挂帐生成未回款订单</text><rect class="n" x="1030" y="170" width="300" height="125" rx="16"/><text class="h" x="1180" y="215" text-anchor="middle">④ 回款与超额处理</text><text class="p" x="1180" y="250" text-anchor="middle">整笔订单确认回款</text><text class="p" x="1180" y="276" text-anchor="middle">转预付款 / 其他收入</text><path class="line" d="M310 232H380"/><path class="line" d="M630 232H700"/><path class="line" d="M950 232H1020"/><rect class="n" x="250" y="420" width="340" height="125" rx="16"/><text class="h" x="420" y="465" text-anchor="middle">⑤ 正常售后退款</text><text class="p" x="420" y="500" text-anchor="middle">按支付方式与回款状态分流</text><text class="p" x="420" y="526" text-anchor="middle">业务退款入口保持不变</text><rect class="n" x="810" y="420" width="340" height="125" rx="16"/><text class="h" x="980" y="465" text-anchor="middle">⑥ 自动调账与追溯</text><text class="p" x="980" y="500" text-anchor="middle">已回款挂帐退款生成负数调账</text><text class="p" x="980" y="526" text-anchor="middle">单据与资金流水双向关联</text><path class="line" d="M1180 295V350H420V410"/><path class="line" d="M590 482H800"/></g></svg>
