<style>
*{box-sizing:border-box}body{margin:0;color:#252525;background:#f7f9fc;font:14px "PingFang SC","Microsoft YaHei",Arial,sans-serif}.header{height:56px;background:#0052d9;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.brand{display:flex;align-items:center;gap:9px;font-weight:600}.logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#81f0d2,#41a2ff);position:relative}.logo:after{content:"";position:absolute;width:16px;height:5px;border-radius:5px;background:#0052d9;transform:rotate(42deg);top:12px;left:6px}.scenic{border:1px solid #8bb8ff;border-radius:4px;padding:3px 8px;font-size:12px;font-weight:400}.right{display:flex;align-items:center;gap:18px;font-size:13px}.back{color:#fff;text-decoration:none;border:1px solid #5890ef;border-radius:4px;padding:5px 10px}.avatar{width:29px;height:29px;border-radius:50%;background:#ffdbbd;color:#815232;display:inline-flex;align-items:center;justify-content:center}.layout{display:flex;min-height:calc(100vh - 56px)}.side{width:220px;flex:0 0 220px;background:#f2f6fd;border-right:1px solid #e7edf7;padding-top:8px}.side .root{height:42px;display:flex;align-items:center;padding:0 20px;color:#3a7bea;font-weight:600;border-bottom:1px solid #e4ebf5}.menu{display:block;padding:13px 20px;color:#333;text-decoration:none}.menu:hover{background:#e8f1ff;color:#1677ff}.menu.active{margin:0 4px;padding:13px 16px;border-radius:6px;background:#e1efff;color:#1677ff;font-weight:600}.sub{padding-left:40px;font-size:13px}.main{min-width:0;flex:1}.tabs{height:40px;padding:8px 18px 0;background:linear-gradient(#dfebff,#fafcff);border-bottom:1px solid #e8eef8}.tab{display:inline-flex;height:32px;align-items:center;padding:0 16px;border-radius:5px 5px 0 0;background:#fff;color:#1677ff;font-weight:600}.crumb{height:46px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid #edf0f5;color:#666;background:#fff;font-size:13px}.content{padding:16px 22px 28px}.mode-tabs{height:43px;border-bottom:1px solid #edf0f5;display:flex;align-items:flex-end;gap:28px}.mode{height:43px;padding:0;background:transparent;border:0;color:#333;cursor:pointer;font:14px inherit}.mode.active{color:#1677ff;border-bottom:2px solid #1677ff;font-weight:600}.filters{padding:28px 0 24px;display:grid;grid-template-columns:minmax(360px,1fr) minmax(330px,1fr) auto;gap:16px 28px;align-items:center}.field{display:flex;align-items:center;position:relative}.field label{white-space:nowrap;margin-right:9px;color:#222}.range,.partner-input{width:100%;height:32px;border:1px solid #d9d9d9;border-radius:4px;background:#fff;padding:0 10px;font:14px inherit;color:#333}.range:focus,.partner-input:focus{outline:none;border-color:#1677ff;box-shadow:0 0 0 2px #1677ff1c}.range-wrap{position:relative;display:flex;align-items:center;width:100%}.range-wrap span{position:absolute;left:50%;transform:translateX(-50%);color:#a0a0a0;pointer-events:none}.range{padding-right:52%;}.range:last-child{margin-left:-1px;padding-left:52%;border-radius:0 4px 4px 0}.range:first-child{border-radius:4px 0 0 4px}.partner-drop{display:none;position:absolute;z-index:8;left:71px;right:0;top:36px;padding:5px 0;max-height:192px;overflow:auto;background:#fff;border:1px solid #d9d9d9;border-radius:4px;box-shadow:0 4px 13px #0000001a}.partner-drop.show{display:block}.partner-option{padding:8px 12px;cursor:pointer}.partner-option:hover{background:#e6f4ff;color:#1677ff}.actions{display:flex;gap:8px;justify-content:flex-end}.btn{height:32px;border:1px solid #d9d9d9;border-radius:4px;padding:0 13px;background:#fff;cursor:pointer;font:14px inherit}.btn.primary{background:#1677ff;color:#fff;border-color:#1677ff}.btn:hover{opacity:.88}.report{border:1px solid #222;background:#fff;overflow-x:auto}.title{height:56px;min-width:940px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:500;border-bottom:1px solid #222}.period{min-width:940px;padding:9px 10px;border-bottom:1px solid #222;font-weight:600}.statement{width:100%;min-width:940px;border-collapse:collapse;table-layout:fixed}.statement th,.statement td{height:36px;padding:7px 12px;text-align:left;border-right:1px solid #222;border-bottom:1px solid #222}.statement th:last-child,.statement td:last-child{border-right:0}.statement thead th{background:#1597d0;color:#fff;text-align:center;font-weight:600}.statement td.num{font-variant-numeric:tabular-nums}.statement tbody tr:last-child td{border-bottom:0}.empty td{height:168px;text-align:center!important;color:#999;background:linear-gradient(#fff,#fbfcfe)}.empty-icon{display:block;font-size:28px;color:#d9d9d9;margin-bottom:8px}.adjust td{background:#f6fbff}.total td{background:#68cbd0;font-weight:700}.footer{min-width:940px;height:38px;border-top:1px solid #222;padding:0 12px;display:flex;align-items:center;justify-content:flex-end;color:#555;font-size:13px}.required{color:#ff4d4f}.hint{display:none;grid-column:1/3;margin-top:-12px;color:#ff4d4f;font-size:12px}.hint.show{display:block}@media(max-width:1050px){.side{width:172px;flex-basis:172px}.filters{grid-template-columns:1fr 1fr}.actions{grid-column:2;grid-row:2}.hint{grid-column:1/3}.content{padding:12px}.side .menu{padding-left:16px}.side .sub{padding-left:28px}}@media(max-width:720px){.side{display:none}.filters{grid-template-columns:1fr}.actions{grid-column:auto;grid-row:auto;justify-content:flex-start}.hint{grid-column:auto}}
 .filters{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.filters .field{width:360px}.filters .range-wrap{gap:6px}.filters .range-wrap span{position:static;transform:none}.filters .range{width:calc(50% - 12px);padding:0 8px;margin:0;border-radius:4px}.filters .actions{margin-left:auto}.filters .hint{width:100%;grid-column:auto}@media(max-width:1050px){.filters .field{width:calc(50% - 8px)}.filters .actions{width:100%;justify-content:flex-end;margin-left:0}}@media(max-width:720px){.filters .field{width:100%}.filters .actions{justify-content:flex-start}}
</style>
</head>
<body>
<header class="header"><div class="brand"><span class="logo"></span><span>程程票</span><span class="scenic">呀诺达雨林</span></div><div class="right"><a class="back" href="index.html#/partner">返回后台</a><span>⌁</span><span>↻</span><span class="avatar">当</span><span>当前用户</span></div></header>
<div class="layout"><aside class="side"><a class="menu" href="index.html#/partner">⌂　首页</a><div class="root">▦　合作伙伴管理　⌃</div><a class="menu sub" href="index.html#/partner">合作伙伴管理</a><a class="menu sub" href="index.html#/partner-account">合作伙伴账户管理</a><a class="menu sub" href="index.html#/recharge?tab=account">充值申请</a><a class="menu sub" href="index.html#/flow?tab=all">资金流水</a><a class="menu active sub" href="partner-statement.html">合作伙伴对帐单</a></aside>
<main class="main"><div class="tabs"><span class="tab">首页</span><span class="tab">合作伙伴对帐单　×</span></div><div class="crumb">⌂　程程票　/　合作伙伴管理　/　合作伙伴对帐单</div><div class="content"><div class="mode-tabs"><button id="dailyTab" class="mode active">按日对帐统计</button><button id="monthlyTab" class="mode">按月对帐统计</button></div><div class="filters"><div class="field"><label>统计时间：</label><div id="timeFields" class="range-wrap"></div></div><div class="field"><label><span class="required">*</span>合作伙伴：</label><input id="partnerInput" class="partner-input" autocomplete="off" placeholder="请选择合作伙伴"><div id="partnerDrop" class="partner-drop"></div></div><div class="actions"><button id="query" class="btn primary">⌕　查 询</button><button id="reset" class="btn">↻　重 置</button></div><div id="hint" class="hint">请选择合作伙伴后查询</div></div><section class="report"><div id="reportTitle" class="title">合作伙伴对帐单</div><div id="period" class="period"></div><table class="statement"><thead><tr><th style="width:20%">日期</th><th style="width:12%">人数</th><th style="width:17%">本月消费</th><th style="width:17%">本月到款</th><th style="width:17%">当前预付款余额</th><th style="width:17%">当前挂帐金额</th></tr></thead><tbody id="tbody"><tr class="empty"><td colspan="6"><span class="empty-icon">▱</span>暂无数据</td></tr></tbody></table><div class="footer">制单人：当前登录用户　打印时间：<span id="printed">-</span></div></section></div></main></div>
<script>
const partners=[{id:'CPP202608050001',name:'三亚山海旅行服务有限公司',status:'启用',prepay:0,credit:300},{id:'CPP202608050002',name:'王先生',status:'启用',prepay:-40,credit:0},{id:'CPP202608050003',name:'公共临时客户',status:'启用',prepay:0,credit:-40}];
const orders=[{p:'CPP202608050001',date:'2026-08-04',tickets:3,amount:360},{p:'CPP202608050002',date:'2026-08-04',tickets:2,amount:240},{p:'CPP202608050003',date:'2026-08-05',tickets:3,amount:360}];
const refunds=[{p:'CPP202608050001',orderDate:'2026-08-04',date:'2026-08-05',tickets:0,amount:60},{p:'CPP202608050003',orderDate:'2026-08-05',date:'2026-08-05',tickets:0,amount:60}];
const recharges=[{p:'CPP202608050001',date:'2026-08-05',type:'挂帐',amount:600},{p:'CPP202608050002',date:'2026-08-05',type:'调账',amount:-40},{p:'CPP202608050003',date:'2026-08-05',type:'挂帐',amount:360},{p:'CPP202608050003',date:'2026-08-05',type:'调账',amount:-100}];
const el=id=>document.getElementById(id), today=new Date(), pad=n=>String(n).padStart(2,'0'), day=today.getFullYear()+'-'+pad(today.getMonth()+1)+'-'+pad(today.getDate()), month=day.slice(0,7);let mode='day', selected=null;
const timeFields=el('timeFields'), input=el('partnerInput'), drop=el('partnerDrop');const money=n=>Number(n||0).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});const showRange=()=>{const type=mode==='day'?'date':'month',value=mode==='day'?day:month;timeFields.innerHTML='<input id="start" class="range" type="'+type+'" value="'+value+'"><span>→</span><input id="end" class="range" type="'+type+'" value="'+value+'">';el('period').textContent=(mode==='day'?'开始日期 ':'开始月份 ')+value+'　'+(mode==='day'?'结束日期 ':'结束月份 ')+value};showRange();
function options(){const q=input.value.trim();drop.innerHTML=partners.filter(x=>x.name.includes(q)).map(x=>'<div class="partner-option" data-id="'+x.id+'">'+x.name+'　<span style="color:#999">'+x.status+'</span></div>').join('')||'<div class="partner-option">暂无匹配合作伙伴</div>';drop.classList.add('show');drop.querySelectorAll('[data-id]').forEach(n=>n.onclick=()=>{selected=partners.find(x=>x.id===n.dataset.id);input.value=selected.name;drop.classList.remove('show')})}input.onfocus=options;input.oninput=()=>{selected=null;options()};document.addEventListener('click',e=>{if(!e.target.closest('.field'))drop.classList.remove('show')});
function switchMode(next){mode=next;el('dailyTab').classList.toggle('active',mode==='day');el('monthlyTab').classList.toggle('active',mode==='month');showRange()}el('dailyTab').onclick=()=>switchMode('day');el('monthlyTab').onclick=()=>switchMode('month');
const keysBetween=(a,b)=>{let list=[],cur=new Date(a+(mode==='day'?'T00:00:00':'-01T00:00:00')),end=new Date(b+(mode==='day'?'T00:00:00':'-01T00:00:00'));while(cur<=end){list.push(mode==='day'?cur.getFullYear()+'-'+pad(cur.getMonth()+1)+'-'+pad(cur.getDate()):cur.getFullYear()+'-'+pad(cur.getMonth()+1));cur.setMonth(cur.getMonth()+(mode==='day'?0:1));if(mode==='day')cur.setDate(cur.getDate()+1)}return list};
const inRange=(d,a,b)=>{const k=mode==='day'?d:d.slice(0,7);return k>=a&&k<=b};function clearRows(){el('tbody').innerHTML='<tr class="empty"><td colspan="6"><span class="empty-icon">▱</span>暂无数据</td></tr>'}function query(){const a=el('start').value,b=el('end').value;if(!selected||!a||!b||a>b){el('hint').classList.add('show');clearRows();return}el('hint').classList.remove('show');el('reportTitle').textContent='合作伙伴-'+selected.name+'对帐单';el('period').textContent=(mode==='day'?'开始日期 ':'开始月份 ')+a+'　'+(mode==='day'?'结束日期 ':'结束月份 ')+b;const rows=keysBetween(a,b).map(k=>{const paid=orders.filter(x=>x.p===selected.id&&inRange(x.date,k,k));const people=paid.reduce((s,x)=>s+x.tickets,0)-refunds.filter(x=>x.p===selected.id&&inRange(x.orderDate,k,k)).reduce((s,x)=>s+x.tickets,0);const spend=paid.reduce((s,x)=>s+x.amount,0)-refunds.filter(x=>x.p===selected.id&&inRange(x.date,k,k)).reduce((s,x)=>s+x.amount,0);const receipt=recharges.filter(x=>x.p===selected.id&&inRange(x.date,k,k)&&['挂帐','预付款'].includes(x.type)).reduce((s,x)=>s+x.amount,0);return{k,people,spend,receipt}}).filter(x=>x.people||x.spend||x.receipt);const adj=recharges.filter(x=>x.p===selected.id&&inRange(x.date,a,b)&&['调账','调账-往来'].includes(x.type)).reduce((s,x)=>s+x.amount,0);let html=rows.map(x=>'<tr><td>'+x.k+'</td><td class="num">'+x.people+'</td><td class="num">'+money(x.spend)+'</td><td class="num">'+money(x.receipt)+'</td><td></td><td></td></tr>').join('');if(adj)html+='<tr class="adjust"><td>调账</td><td>-</td><td class="num">'+(adj<0?money(Math.abs(adj)):'0.00')+'</td><td class="num">'+(adj>0?money(adj):'0.00')+'</td><td></td><td></td></tr>';const total=rows.reduce((s,x)=>({people:s.people+x.people,spend:s.spend+x.spend,receipt:s.receipt+x.receipt}),{people:0,spend:0,receipt:0});total.spend+=adj<0?Math.abs(adj):0;total.receipt+=adj>0?adj:0;if(!html){clearRows()}else el('tbody').innerHTML=html+'<tr class="total"><td>合计</td><td class="num">'+total.people+'</td><td class="num">'+money(total.spend)+'</td><td class="num">'+money(total.receipt)+'</td><td class="num">'+(selected.prepay?money(selected.prepay):'-')+'</td><td class="num">'+(selected.credit?money(selected.credit):'-')+'</td></tr>';el('printed').textContent=new Date().toLocaleString('zh-CN',{hour12:false}).replaceAll('/','-')}
function reset(){selected=null;input.value='';el('hint').classList.remove('show');el('reportTitle').textContent='合作伙伴对帐单';el('printed').textContent='-';showRange();clearRows()}el('query').onclick=query;el('reset').onclick=reset;
</script></body></html>
