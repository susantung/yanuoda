*{box-sizing:border-box}html,body{margin:0;min-width:1024px;height:100%;overflow:hidden;font-size:14px;line-height:22px;background:var(--canvas)}button,input{font:inherit}button{cursor:pointer}.svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}.tool-icon{display:grid;place-items:center;color:#fff}.header{height:56px;background:var(--blue);display:flex;align-items:center;color:#fff;padding:0 18px;gap:20px;white-space:nowrap}.brand{display:flex;align-items:center;gap:8px;font-weight:600}.mark{position:relative;width:32px;height:32px}.mark:before,.mark:after{content:"";position:absolute;border-radius:3px;background:#43d5b8;transform:rotate(-45deg)}.mark:before{width:11px;height:28px;left:6px;top:1px}.mark:after{width:11px;height:20px;left:17px;top:10px}.system-tag{height:30px;display:flex;align-items:center;border:1px solid #b8d1ff;border-radius:4px;padding:0 10px;font-weight:400}.mainnav{display:flex;height:100%;align-items:center;gap:8px;flex:1}.mainnav button{color:#fff;background:transparent;border:0;border-radius:4px;height:36px;padding:0 14px;font-weight:600}.mainnav button.active{background:#fff;color:var(--blue)}.tools{display:flex;align-items:center;gap:16px;font-weight:600}.admin{height:32px;border:0;border-radius:4px;background:#1677ff;color:#fff;padding:0 16px;font-weight:600}.avatar{width:28px;height:28px;background:#ffe2ce;color:#9b5d26;border-radius:50%;display:inline-grid;place-items:center;margin-right:-9px}.tabsbar{height:40px;background:linear-gradient(90deg,#f7fbff,#edf4ff);display:flex;align-items:end;padding-left:8px;border-bottom:1px solid #dce5f4}.page-tab{height:32px;border:0;border-right:1px solid #dbe4f3;background:transparent;padding:0 13px;color:#6b7280}.page-tab.active{background:white;color:var(--primary);font-weight:600}.tab-close{border:0;background:transparent;color:inherit;padding:0 0 0 7px;line-height:1}.page{height:calc(100vh - 96px);padding:8px;d radius:6px 0 0 6px}.radio:last-child{border-radius:0 6px 6px 0;border-left:0}.radio.active{color:var(--primary);border-color:var(--primary);position:relative;z-index:1}.utility{height:42px;display:flex;align-items:center;justify-content:space-between}.check{display:flex;align-items:center;gap:7px}.check input{accent-color:var(--primary)}.sort{height:32px;border:1px solid transparent;border-radius:6px;background:transparent;color:rgba(0,0,0,.88);font-size:14px;font-weight:400;padding:4px 15px;display:flex;align-items:center;gap:4px}.ticket-list{overflow:auto;padding-right:1px}.ticket{min-height:75px;border:1px solid #f0f5ff;border-radius:6px;margin-bottom:8px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;background:#fff;cursor:pointer}.ticket.selected{border-color:#0052d9;background:#f0f5ff}.ticket-title{font-weight:500;overflow:hidden;white-space:normal;color:#333}.season{display:inline-flex;font-size:12px;line-height:24px;background:#ebf8f1;color:#3dbe74;border-radius:4px;padding:0 8px;margin-right:7px}.ticket.selected .season{color:#2b60dd;background:rgba(43,96,221,.1)}.ticket-foot{display:flex;justify-content:space-between;align-items:center}.valid{font-size:12px;color:#39b980}.ticket.selected .valid{color:#999}.price{color:var(--red);font-size:16px;font-weight:700;line-height:25px}.right{display:flex;min-width:0;flex-direction:column}.sale-head{height:82px;padding:10px 16px 0;border-bottom:1px solid #edf0f5}.sale-title{display:flex;align-items:center;gap:9px;font-size:16px;font-weight:500;line-height:25px}.sale-title:before{content:"";display:block;width:3px;height:18px;background:var(--primary);border-radius:2px}.recent{font-size:14px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.date-row{height:40px;display:flex;align-items:center;gap:14px}.datebox{display:flex;position:relative;height:32px;border:1px solid var(--input);border-radius:6px;background:#fff}.date-prefix{padding:4px 9px;background:#fafafa;border-right:1px solid var(--line);border-radius:6px 0 0 6px;color:#333}.date-value{padding:4px 36px 4px 10px;min-width:140px;position:relative}.datebox .svg{position:absolute;right:10px;top:7px;color:#777}.calendar{position:absolute;z-index:20;top:36px;left:0;width:300px;padding:12px;background:#fff;border:1px solid #eee;border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.14);display:none}.datebox.open .calendar{display:block}.cal-head{display:flex;align-items:center;justify-content:space-between;font-weight:600;margin-bottom:10px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:3px;font-size:12px}.week{color:#999}.days span{height:28px;line-height:28px;border-radius:4px}.days span.active{background:var(--primary);color:#fff}.days span:hover{background:#e6f4ff}.download{border:0;background:transparent;color:var(--primary);padding:0;display:flex;gap:6px;align-items:center}.order-body{min-height:0;overflow:auto;padding:8px 16px}.order{border:1px solid #e6e6e6;border-radius:6px;margin-bottom:8px;overflow:hidden}.order-head{height:48px;background:#f0f5ff;display:flex;align-items:center;padding:0 10px;gap:10px;min-width:650px}.order-name{font-weight:500;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.stock{color:#999}.import{width:64px}.danger{height:32px;width:32px;border:0;background:transparent;color:var(--danger);display:grid;place-items:center;padding:0}.order-form{padding:8px 16px 10px;min-width:650px}.amountrow{height:34px;display:flex;align-items:center;gap:34px}.stepper{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;height:32px;vertical-align:middle}.stepper button{width:32px;border:0;background:#fff;color:#555}.stepper input{width:44px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;outline:0}.traveler{display:grid;grid-template-columns:20px minmax(130px,1.1fr) 124px minmax(160px,1.2fr) 92px 32px;gap:8px;align-items:center;margin-top:8px}.settlement{height:56px;border-top:1px solid #e6e6e6;padding:12px 16px;display:flex;align-items:center;gap:10px;background:#fff}.pay-select{width:170px}.pay-dot{width:16px;height:16px;border-radius:50%;background:#f5a623;color:#fff;display:grid;place-items:center;font-size:11px;line-height:1}.settlement .summary{margin-left:auto;white-space:nowrap}.secondary{height:32px;min-width:100px;border:1px solid var(--line);border-radius:6px;background:#fff;color:#333;padding:4px 15px}.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.48);z-index:30;display:none;place-items:center}.modal-mask.open{display:grid}.modal{width:min(720px,calc(100vw - 32px));max-height:calc(100vh - 32px);border-radius:8px;background:#fff;box-shadow:0 6px 16px rgba(0,0,0,.25);display:flex;flex-direction:column;overflow:hidden}.modal-title{height:52px;padding:14px 20px;font-size:16px;font-weight:600;border-bottom:1px solid #f0f0f0}.modal-content{padding:20px;overflow:auto}.modal-foot{padding:10px 20px;border-top:1px solid #f0f0f0;display:flex;justify-content:flex-end;gap:8px}.empty{display:flex;min-height:240px;align-items:center;justify-content:center;flex-direction:column;color:#999;gap:8px}.empty-icon{width:48px;height:38px;border:2px solid #d9e8ff;border-radius:8px;position:relative}.empty-icon:after{content:"";position:absolute;width:20px;border-top:2px solid #d9e8ff;left:12px;top:17px}@media(max-width:1160px){.header{gap:12px}.system-tag{display:none}.traveler{grid-template-columns:20px 1fr 112px 1fr 80px 32px}.sale-head{padding-left:12px}.order-body{padding-left:12px;padding-right:12px}}

.filters{grid-template-columns:repeat(3,minmax(0,1fr))}.filters .category{grid-column:1 / span 2}.filters .search{grid-column:3;grid-row:2;justify-self:end;width:80px}.select-panel{border-radius:8px;box-shadow:0 6px 16px rgba(0,0,0,.08),0 3px 6px -4px rgba(0,0,0,.12),0 9px 28px 8px rgba(0,0,0,.05)}.calendar{width:288px;min-height:348px;box-shadow:0 6px 16px rgba(0,0,0,.08),0 3px 6px -4px rgba(0,0,0,.12),0 9px 28px 8px rgba(0,0,0,.05)}
.ant-quantity-control{position:relative;display:inline-flex;width:92px;height:32px}.ant-quantity-control .ant-input-number{width:92px;height:32px}.ant-quantity-control .ant-input-number-input{height:30px;padding-right:22px;text-align:center}.ant-quantity-buttons{position:absolute;z-index:3;top:1px;right:1px;display:flex;flex-direction:column;width:20px;height:30px;overflow:hidden;border-left:1px solid #d9d9d9;border-radius:0 5px 5px 0;background:#fff;opacity:0;pointer-events:none;transition:opacity .12s}.ant-quantity-control:hover .ant-quantity-buttons,.ant-quantity-control:focus-within .ant-quantity-buttons{opacity:1;pointer-events:auto}.ant-quantity-buttons .ant-btn{width:20px;height:15px;min-height:15px;padding:0;border:0;border-radius:0;color:#8c8c8c;font-size:12px;line-height:13px}.ant-quantity-buttons .ant-btn:first-child{border-bottom:1px solid #f0f0f0}.ant-quantity-buttons .ant-btn:hover{position:relative;z-index:1;color:#1677ff;background:#f5f5f5}

<body>
<header class="header"><div class="left-header"><div class="brand"><i class="mark"></i><span>程程票售票窗口</span></div><span class="system-tag">呀诺达景区</span></div><nav class="mainnav"><button>首页</button><button class="active">售票</button><button>取票</button><button>退票</button><button>线上票确认</button><button>查询</button><button>统计</button><button>合作伙伴</button><button>内导</button><button>异常订单</button></nav><div class="tools"><button class="admin">后台管理</button><span class="tool-icon" aria-label="窗口工具"><svg class="svg" viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="16" r="3"/><path d="m10.2 10.2 3.6 3.6"/></svg></span><span class="tool-icon" aria-label="刷新"><svg class="svg" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0 2 5.2"/><path d="M20 4v7h-7"/></svg></span><span class="avatar">苏</span><span>YST售票窗口</span></div></header>
<div class="tabsbar" id="keepTabs"><button class="page-tab active" data-page="售票">售票 <span class="tab-close" role="button" aria-label="关闭售票页">×</span></button><div class="preview-session-host" id="previewSessionControls"></div></div>
<main class="page"><div class="business-tabs"><button class="active">散客票</button><button>团队票</button><button>临时/长期合作伙伴</button><button>挂单列表</button></div><section class="workspace"><aside class="left"><div class="filters"><input class="control name" placeholder="票型名称"/><div class="select control" data-select>活动标签<svg class="svg" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg><div class="select-panel"><div class="option selected">全部活动标签</div><div class="option">节假日活动</div><div class="option">会员专属</div></div></div><div class="select control category" data-select>门票分类<svg class="svg" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg><div class="select-panel"><div class="option selected">全部门票分类</div><div class="option">成人票</div><div class="option">儿童票</div></div></div><button class="primary search"><svg class="svg" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></svg>查询</button></div><div class="radio-row"><button class="radio active">常规票</button><button class="radio">套票</button></div><div class="utility"><label class="check"><input type="checkbox" checked/>显示价格类型，票型票种</label><button class="sort"><svg class="svg" viewBox="0 0 24 24"><path d="m8 8 4-4 4 4M16 16l-4 4-4-4"/></svg>金额</button></div><div class="ticket-list" id="tickets"></div></aside>
<section class="right"><div class="sale-head"><div class="sale-title">售卖信息 <span class="recent">最近订单：2026-10-08 14:01:33　DD261008140133001001s　5张　现金：<b style="color:var(--red)">¥0.05</b></span></div><div class="date-row"><div class="datebox" id="datebox"><span class="date-prefix">日期</span><span class="date-value">2026-10-09</span><svg class="svg" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg><div class="calendar"><div class="cal-head"><span>‹</span><span>2026年10月</span><span>›</span></div><div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div><div class="days"><span></span><span></span><span></span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span class="active">9</span><span>10</span><span>11</span><span>12</span><span>13</span><span>14</span><span>15</span><span>16</span><span>17</span><span>18</span><span>19</span><span>20</span><span>21</span><span>22</span><span>23</span><span>24</span><span>25</span><span>26</span><span>27</span><span>28</span><span>29</span><span>30</span><span>31</span></div><div style="margin-top:10px;color:var(--primary);font-size:12px">今天</div></div></div><button class="download"><svg class="svg" viewBox="0 0 24 24"><path d="M7 18a4 4 0 1 1 .8-7.9A5 5 0 0 1 18 11.5"/><path d="M12 10v8m0 0-3-3m3 3 3-3"/></svg>下载模板</button></div></div><div class="order-body" id="orders"><div class="empty" id="empty"><i class="empty-icon"></i><span>暂未选择门票</span><small>请从左侧选择需要售卖的门票</small></div></div><footer class="settlement"><span>支付方式:</span><div class="select control pay-select" data-select><span class="pay-dot">¥</span>&nbsp;现金<svg class="svg" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg><div class="select-panel"><div class="option selected">现金</div><div class="option">扫码付</div></div></div><span class="summary">总票数:<b id="totalQty" style="color:var(--primary)">0</b>张　总金额:<b id="totalAmount" class="price">¥0.00</b></span><button class="secondary" id="cancel">取消</button><button class="primary" id="confirm">确认下单</button></footer></section></section></main>

<script>
const filterGrid=document.querySelector('.filters');const priceType=document.createElement('div');priceType.className='select control';priceType.dataset.select='';priceType.innerHTML='价格类型<svg class="svg" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg><div class="select-panel"><div class="option selected">全部价格类型</div><div class="option">成人价</div><div class="option">儿童价</div></div>';filterGrid.insertBefore(priceType,filterGrid.querySelector('.category'));
const tickets=[{id:'a',season:'实',realName:true,name:'【优惠票-专属票】日历票-大门票+雨林拓展+幻境魔盒（同程测试）',valid:'当日可用',price:.01,stock:9999},{id:'b',season:'旺季',realName:false,name:'【限时秒杀】大门票+大巴车+玻璃平台+悬崖秋千【期票】',valid:'2026-09-16-2027-10-22',price:.01,stock:2734},{id:'c',season:'淡季',realName:true,name:'【全价票-专属票】自动日历库存组合票0807165539（儿童票）',valid:'当日可用',price:20,stock:9999},{id:'d',season:'淡季',realName:false,name:'【全价票-专属票】自动组合票0805163351（儿童票）',valid:'当日可用',price:20,stock:9999}];let cart=[];const icon=t=>({delete:'<svg class="svg" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6m4-6v6M9 7l1-3h4l1 3M6 7l1 14h10l1-14"/></svg>',minus:'<svg class="svg" viewBox="0 0 24 24"><path d="M5 12h14"/></svg>',plus:'<svg class="svg" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>'}[t]);
function money(n){return '¥'+n.toFixed(2)}function renderTickets(){tickets.forEach(t=>{let el=document.querySelector('[data-ticket="'+t.id+'"]');if(!el){el=document.createElement('div');el.dataset.ticket=t.id;el.className='ticket';el.innerHTML='<div class="ticket-title"><span class="season">'+t.season+'</span>'+t.name+'</div><div class="ticket-foot"><span class="valid">有效期：'+t.valid+'</span><span class="price">'+money(t.price)+'</span></div>';el.onclick=()=>add(t);document.querySelector('#tickets').append(el)}el.classList.toggle('selected',cart.some(c=>c.id===t.id))})}
function add(t){let c=cart.find(x=>x.id===t.id);if(c)c.qty++;else cart.push({...t,qty:1});render()}
function change(id,d){let c=cart.find(x=>x.id===id);c.qty=Math.max(1,c.qty+d);render()}function remove(id){cart=cart.filter(c=>c.id!==id);render()}
function order(c){let travelers=Array.from({length:c.qty},(_,i)=>'<div class="traveler"><span>'+ (i+1) +'</span><input class="control" placeholder="姓名"><div class="select control" data-select>身份证<svg class="svg" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg><div class="select-panel"><div class="option selected">身份证</div><div class="option">护照</div></div></div><input class="control" placeholder="请输入证件号"><div class="select control" data-select>性别<svg class="svg" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg><div class="select-panel"><div class="option">男</div><div class="option">女</div></div></div><button class="danger" onclick="removeTraveler(\''+c.id+'\')">'+icon('delete')+'</button></div>').join('');return '<article class="order"><div class="order-head">'+(c.realName?'<span class="season real-name-tag">实</span>':'')+'<span class="order-name">'+c.name+'</span><span class="stock">剩余库存：'+c.stock+'</span><span class="price">'+money(c.price)+'</span><button class="primary import">导入</button><button class="danger" onclick="remove(\''+c.id+'\')">'+icon('delete')+'</button></div><div class="order-form"><div class="amountrow">门票数量：<span class="stepper"><button aria-label="减少" onclick="change(\''+c.id+'\',-1)">'+icon('minus')+'</button><input value="'+c.qty+'" readonly><button aria-label="增加" onclick="change(\''+c.id+'\',1)">'+icon('plus')+'</button></span><span>应付金额： <b class="price">'+money(c.price*c.qty)+'</b></span></div>'+travelers+'</div></article>'}

<script>
(() => {
  const iconBase = 'assets/';
  const options = [['现金','CASH_PAY.png'],['扫码付','YC_SCAN_PAY.png'],['银行卡','YC_BANK_CARD_PAY.png'],['微信','YC_WECHAT_PAY.png'],['支付宝','YC_ALI_PAY.png'],['聚合支付','YC_AGGREGATE_PAY.png']];
  const arrow = '<svg class="svg" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';
  const select = (label, options, cls = '') => '<div class="select control '+cls+'" data-select>'+label+arrow+'<div class="select-panel">'+options.map((item,index)=>'<div class="option'+(index===0?' selected':'')+'">'+item+'</div>').join('')+'</div></div>';

  const sort = document.querySelector('.sort');
  sort.innerHTML = '<div class="sort-arrows" aria-hidden="true"><span class="sort-icon sort-icon-asc sort-icon-active"><svg viewBox="0 0 1024 1024"><path d="M858.9 689 530.5 308.2c-9.4-10.9-27.5-10.9-37 0L165.1 689c-12.2 14.2-1.2 35 18.5 35h656.8c19.7 0 30.7-20.8 18.5-35z"/></svg></span><span class="sort-icon sort-icon-desc"><svg viewBox="0 0 1024 1024"><path d="M840.4 300H183.6c-19.7 0-30.7 20.8-18.5 35l328.4 380.8c9.4 10.9 27.5 10.9 37 0L858.9 335c12.2-14.2 1.2-35-18.5-35z"/></svg></span></div><span class="sort-text">金额</span>';
  sort.onclick = () => {
    sort.classList.toggle('desc');
    sort.querySelector('.sort-icon-asc').classList.toggle('sort-icon-active',!sort.classList.contains('desc'));
    sort.querySelector('.sort-icon-desc').classList.toggle('sort-icon-active',sort.classList.contains('desc'));
    const direction = sort.classList.contains('desc') ? -1 : 1;
    tickets.sort((a, b) => (a.price - b.price) * direction);
    const list = document.getElementById('tickets');
    tickets.forEach(ticket => {
      const item = list.querySelector('[data-ticket="'+ticket.id+'"]');
      if (item) list.append(item);
    });
  };

  const recent = document.querySelector('.sale-title .recent');
  const refreshButton = document.createElement('button');
  refreshButton.type = 'button';
  refreshButton.className = 'order-refresh';
  refreshButton.setAttribute('aria-label','刷新最近订单');
  refreshButton.innerHTML = '<img src="assets/order_refresh.png" alt="">';
  recent.after(refreshButton);
  refreshButton.onclick = () => render();

  const right = document.querySelector('.right');
  const rightCard = document.createElement('div');
  rightCard.className = 'right-card';
  while (right.firstChild) rightCard.append(right.firstChild);
  right.append(rightCard);

  const settlement = document.querySelector('.settlement');
  const oldLabel = settlement.querySelector(':scope > span:first-child');
  const paySelect = settlement.querySelector('.pay-select');
  const paymentBox = document.createElement('div');
  paymentBox.className = 'payment-box';
  oldLabel.className = 'payment-label';
  const panel = paySelect.querySelector('.select-panel');
  paySelect.firstChild.remove();
  paySelect.insertAdjacentHTML('afterbegin','<img class="pay-icon" src="'+iconBase+'CASH_PAY.png" alt="现金"><span class="pay-text">现金</span>');
  Array.from(paySelect.childNodes).filter(node => node.nodeType === Node.TEXT_NODE).forEach(node => node.remove());
  panel.innerHTML = options.map(([label, icon], index) => '<div class="option'+(index===0?' selected':'')+'" data-icon="'+icon+'"><img src="'+iconBase+icon+'" alt="'+label+'"><span>'+label+'</span></div>').join('');
  const paymentValue = document.createElement('div');
  paymentValue.className = 'payment-value';
  paymentValue.append(paySelect);
  paymentBox.append(oldLabel, paymentValue);
  const paymentActions = document.createElement('div');
  paymentActions.className = 'payment-actions';
  paymentActions.append(paymentBox);
  settlement.prepend(paymentActions);
  const confirmButton = settlement.querySelector('#confirm');
  const pendingButton = document.createElement('button');
  pendingButton.type = 'button';
  pendingButton.className = 'secondary pending-order';
  pendingButton.innerHTML = '<svg class="svg" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>挂单';
  confirmButton.before(pendingButton);
  pendingButton.onclick = () => {
    modalText.textContent = '当前为预览稿：挂单操作将在正式系统中创建挂单记录。';
    modal.classList.add('open');
  };
  /* 与测试页一致：结算栏不是把所有按钮平铺在 footer 中，而是左右两组。 */
  const summary = settlement.querySelector('.summary');
  const cancelButton = settlement.querySelector('#cancel');
  const footerTop = document.createElement('div');
  footerTop.className = 'footer-top';
  const footerLeft = document.createElement('div');
  footerLeft.className = 'footer-left';
  const footerRight = document.createElement('div');
  footerRight.className = 'footer-right';
  const totalInfo = document.createElement('div');
  totalInfo.className = 'total-info';
  const totalCount = document.createElement('div');
  totalCount.className = 'total-count';
  const totalCountLabel = document.createElement('span');
  totalCountLabel.className = 'total-count-label';
  totalCountLabel.textContent = '总票数:';
  const totalCountValue = document.getElementById('totalQty');
  totalCountValue.className = 'total-count-value';
  const totalCountUnit = document.createElement('span');
  totalCountUnit.className = 'total-count-label';
  totalCountUnit.textContent = '张';
  totalCount.append(totalCountLabel, totalCountValue, totalCountUnit);
  const totalPrice = document.createElement('div');
  totalPrice.className = 'total-price';
  const totalPriceLabel = document.createElement('span');
  totalPriceLabel.className = 'total-price-label';
  totalPriceLabel.textContent = '总金额:';
  const totalPriceValue = document.getElementById('totalAmount');
  totalPriceValue.className = 'total-price-value';
  totalPrice.append(totalPriceLabel, totalPriceValue);
  summary.remove();
  totalInfo.append(totalCount, totalPrice);
  footerLeft.append(paymentActions);
  footerRight.append(totalInfo, cancelButton, pendingButton, confirmButton);
  [cancelButton, pendingButton, confirmButton].forEach(button => button.classList.add('footer-btn'));
  footerTop.append(footerLeft, footerRight);
  settlement.replaceChildren(footerTop);
  panel.querySelectorAll('.option').forEach(option => option.onclick = event => {
    event.stopPropagation();
    const label = option.textContent.trim();
    paySelect.querySelector('.pay-text').textContent = label;
    paySelect.querySelector('.pay-icon').src = iconBase + option.dataset.icon;
    paySelect.querySelector('.pay-icon').alt = label;
    panel.querySelectorAll('.option').forEach(item => item.classList.toggle('selected',item===option));
    paySelect.classList.remove('open');
  });

  tickets[0].name='【优惠票-专属票】日历票-大门票+雨林拓展+幻境魔盒（同程测试）（周杰伦粉丝专属）';
  tickets[0].season='实'; tickets[0].stock=9999; tickets[0].activity='活动标签，组合票被删除了活动标签是否可以删除';
  tickets[1].season='旺季'; tickets[1].stock=2809; tickets[1].priceType='旺季';
  tickets[2].stock=2999; tickets[2].priceType='淡季'; tickets[2].activity='毕业季体验游';
  tickets[3].priceType='淡季';
  let selectedOrderId = null;
  const originalRender = render;
  render = function(){ originalRender(); decorateOrderMeta(); };
  function decorateOrderMeta(){
    document.querySelectorAll('.order').forEach(card => {
      const name = card.querySelector('.order-name')?.textContent || '';
      const ticket = tickets.find(item => name === item.name);
      if (!ticket) return;
      card.dataset.ticketId = ticket.id;
      card.classList.toggle('order-selected', selectedOrderId === ticket.id);
      if (!card.dataset.selectionBound) {
        card.dataset.selectionBound = '1';
        card.addEventListener('click', () => {
          selectedOrderId = ticket.id;
          document.querySelectorAll('.order').forEach(order => order.classList.remove('order-selected'));
          card.classList.add('order-selected');
        });
      }
      const head = card.querySelector('.order-head');
      head.classList.toggle('no-leading-tag', ticket.id === 'b');
      head.querySelector('.order-meta')?.remove();
      const tags = [];
      if (ticket.priceType) tags.push('<span class="order-meta-tag season-tag">'+ticket.priceType+'</span>');
      if (ticket.activity) tags.push('<span class="order-meta-tag activity-tag">'+ticket.activity+'</span>');
      if (tags.length) head.querySelector('.stock').insertAdjacentHTML('beforebegin','<span class="order-meta">'+tags.join('')+'</span>');
      const quantity = card.querySelector('.stepper');
      if (quantity) {
        const [decrease, increase] = quantity.querySelectorAll('button');
        const input = quantity.querySelector('input');
        decrease.classList.add('quantity-sub');
        increase.classList.add('quantity-add');
        decrease.innerHTML = '';
        increase.innerHTML = '';
        input.removeAttribute('readonly');
        input.onchange = () => {
          const item = cart.find(entry => entry.id === ticket.id);
          if (item) { item.qty = Math.max(1, Number.parseInt(input.value,10) || 1); render(); }
        };
      }
      /* 测试环境的 Select 通过 portal 位于卡片之上；本静态稿以卡片临时抬层实现同一效果。 */
      card.querySelectorAll('.traveler [data-select]').forEach(select => {
        if (select.dataset.cardLayerBound) return;
        select.dataset.cardLayerBound = '1';
        select.addEventListener('click', () => {
          document.querySelectorAll('.order.dropdown-open').forEach(other => {
            if (other !== card) other.classList.remove('dropdown-open');
          });
          card.classList.toggle('dropdown-open', select.classList.contains('open'));
        });
      });
    });
  }
  document.addEventListener('click', () => document.querySelectorAll('.order.dropdown-open').forEach(card => card.classList.remove('dropdown-open')));
  cart=[tickets[2],tickets[1],tickets[0]].map(ticket=>({...ticket,qty:1}));
  render();
  bindSelects();

  const keepTabsRoot = document.getElementById('keepTabs');
  const activateKeepTab = tab => keepTabsRoot.querySelectorAll('.page-tab').forEach(item => item.classList.toggle('active', item === tab));
  const bindKeepTabsByRuntime = () => keepTabsRoot.querySelectorAll('.page-tab').forEach(tab => tab.onclick = event => {
    if (event.target.closest('.tab-close')) {
      event.stopPropagation();
      if (keepTabsRoot.querySelectorAll('.page-tab').length === 1) return;
      const wasActive = tab.classList.contains('active');
      const siblings = [...keepTabsRoot.querySelectorAll('.page-tab')];
      tab.remove();
      if (wasActive) activateKeepTab(siblings.find(item => item !== tab) || keepTabsRoot.querySelector('.page-tab'));
      return;
    }
    activateKeepTab(tab);
  });
  document.querySelectorAll('.mainnav button').forEach(button => button.onclick = () => {
    const page = button.textContent.trim();
    if (page === '首页') {
      keepTabsRoot.querySelectorAll('.page-tab[data-page="首页"]').forEach(tab => tab.remove());
      return;
    }
    let tab = keepTabsRoot.querySelector('.page-tab[data-page="'+page+'"]');
    if (!tab) {
      tab = document.createElement('button');
      tab.className = 'page-tab';
      tab.dataset.page = page;
      tab.innerHTML = page+' <span class="tab-close" role="button" aria-label="关闭'+page+'页">×</span>';
      keepTabsRoot.insertBefore(tab,document.getElementById('previewSessionControls'));
      bindKeepTabsByRuntime();
    }
    activateKeepTab(tab);
  });
  bindKeepTabsByRuntime();
})();
</script>

(() => {
  const { createElement: h, useState } = React;
  const { Input, Select, Button, Checkbox, Radio, DatePicker, InputNumber, ConfigProvider, Table, Modal, Descriptions } = antd;

  const wrap = node => h(ConfigProvider, { theme: antTheme }, node);
  const mount = (host, node) => {
    if (!host) return;
    let root = roots.get(host);
    if (!root) { root = ReactDOM.createRoot(host); roots.set(host, root); }
    root.render(wrap(node));
  };
  const selectProps = options => ({
    options: options.map(value => ({ value, label: value })),
    style: { width: '100%' },
    popupMatchSelectWidth: true,
    getPopupContainer: () => document.body,
    popupClassName: 'ticket-ant-dropdown'
  });

    if (!node) return null;
    const host = document.createElement('div');
    host.className = className;
    node.replaceWith(host);
    return host;
  };

  function FilterControls() {
    const [keyword, setKeyword] = useState('');
    const [activity, setActivity] = useState();
    const [priceType, setPriceType] = useState();
    const [category, setCategory] = useState();

    const prices = ['旺季', '淡季'];
    const categories = ['儿童票'];
    const runSearch = () => {
      document.querySelectorAll('.ticket').forEach(ticket => {
        const text = ticket.textContent || '';
        const visible = (!keyword || text.includes(keyword))
          && (!activity || text.includes(activity))
          && (!priceType || text.includes(priceType))
          && (!category || text.includes(category));
        ticket.style.display = visible ? 'flex' : 'none';
      });
    };
    return h('div', { className: 'ant-filter-grid' },
      h(Input, { className: 'name', placeholder: '票型名称', value: keyword, onChange: e => setKeyword(e.target.value), onPressEnter: runSearch }),
      h(Select, { ...selectProps(activities), className: 'activity', placeholder: '活动标签', value: activity, onChange: setActivity, allowClear: true }),
      h(Select, { ...selectProps(prices), className: 'price-type', placeholder: '价格类型', value: priceType, onChange: setPriceType, allowClear: true }),
      h(Select, { ...selectProps(categories), className: 'category', placeholder: '门票分类', value: category, onChange: setCategory, allowClear: true }),
      h(Button, { type: 'primary', className: 'search', onClick: runSearch }, '查询')
    );
  }

  function mountTopControls() {
    const filters = document.querySelector('.filters');
    if (filters && !filters.dataset.antMounted) {
      filters.dataset.antMounted = '1';
      filters.replaceChildren(Object.assign(document.createElement('div'), { className: 'ant-filter-host' }));
      mount(filters.firstElementChild, h(FilterControls));
    }
    const radioRow = document.querySelector('.radio-row');
    if (radioRow && !radioRow.dataset.antMounted) {
      radioRow.dataset.antMounted = '1';
      const host = document.createElement('div'); host.className = 'ant-radio-host'; radioRow.replaceChildren(host);
      mount(host, h(Radio.Group, { defaultValue: 'normal', optionType: 'button', buttonStyle: 'solid', options: [{ label: '常规票', value: 'normal' }, { label: '套票', value: 'package' }] }));
    }
    const check = document.querySelector('.utility .check');
    if (check && !check.dataset.antMounted) {
      check.dataset.antMounted = '1';
      check.replaceChildren(Object.assign(document.createElement('span'), { className: 'ant-check-host' }));
      mount(check.firstElementChild, h(Checkbox, { defaultChecked: true }, '显示价格类型，票型票种'));
    }
    const datebox = document.querySelector('#datebox');
    if (datebox && !datebox.dataset.antMounted) {
      datebox.dataset.antMounted = '1';
      datebox.replaceChildren(Object.assign(document.createElement('span'), { className: 'ant-date-host' }));
      mount(datebox.firstElementChild, h('div', { className: 'ant-date-inner' },
        h('span', { className: 'ant-date-label' }, '日期'),
        h(DatePicker, { defaultValue: dayjs('2026-10-09'), allowClear: false, format: 'YYYY-MM-DD', inputReadOnly: true, bordered: false })
      ));
    }
  }

  const initialFixture = structuredClone(window.paymentFixture);
  let paymentFixture = structuredClone(initialFixture);
  const previewStorageKey='tc-ticket-payment-preview:yanoda-demo:v1';
  const previewSessionKey=previewStorageKey+':session';
  let previewSyncTime=null;
  function readPreviewConfiguration(){
    if(!/^https?:$/.test(location.protocol))return null;
    try{
      const data=JSON.parse(localStorage.getItem(previewStorageKey)||'null');
      return data?.version===1&&data.scenicId===initialFixture.scenicId&&Array.isArray(data.payments)&&Array.isArray(data.resources)&&data.bindings?data:null;
    }catch{return null}
  }
  function mergePreviewConfiguration(data){
    if(!data)return;
    for(const key of ['payments','resources','bindings','accounts','devices'])if(data[key])paymentFixture[key]=structuredClone(data[key]);
    paymentFixture.payments.forEach(p=>{p.allowedScenes=initialFixture.payments.find(x=>x.code===p.code)?.allowedScenes||[];if(data.sceneRevision!==2&&!p.scenes.includes('innerGuide'))p.scenes.push('innerGuide')});
    previewSyncTime=data.updatedAt;
  }
  mergePreviewConfiguration(readPreviewConfiguration());
  try{
    const session=JSON.parse(sessionStorage.getItem(previewSessionKey)||'null');
    if(session&&paymentFixture.accounts.some(x=>x.value===session.accountKey)&&paymentFixture.devices.some(x=>x.value===session.deviceKey))Object.assign(paymentFixture.session,{accountKey:session.accountKey,deviceKey:session.deviceKey});
  }catch{}
  const paymentState = { code:null, resourceId:null, reviewed:null };
  // 团队工作台：数据为脱敏模拟样例，选择弹窗和工作台字段来自当次线上只读核对。
  const retailCatalog=tickets.map(t=>({...t}));
  const teamCatalog=[
    {id:'team-down',name:'【私有化部署价格类型】团队2号下行',season:'',realName:false,valid:'当日可用',price:80,stock:9999},
    {id:'team-period',name:'【优惠票】团队单门票（期票）',season:'旺季',priceType:'旺季',activity:'直播间福利1',realName:false,valid:'2026-09-16-2027-10-22',price:99,stock:9999992}
  ];
  const teamAgencies=[
    {id:'agency-demo-1',group:'演示集团',name:'团队测试旅行社一',types:['常规团','一日游'],source:'线上预约平台',reservation:'已禁用',approval:'已禁用',balance:1000.01,credit:null,enabled:true},
    {id:'agency-demo-2',group:'演示集团',name:'团队测试旅行社二',types:['常规团','一日游'],source:'无预约',reservation:'已禁用',approval:'已禁用',balance:50,credit:100,enabled:true}
  ];
  const teamGuides=[
    {id:'guide-demo-1',name:'演示导游一',documentType:'身份证',document:'DEMO-DOC-01',phone:'',guideCode:'DEMO-GUIDE-01',agencies:'团队测试旅行社一',status:'有效'},
    {id:'guide-demo-2',name:'演示导游二',documentType:'护照',document:'DEMO-DOC-02',phone:'',guideCode:'DEMO-GUIDE-02',agencies:'团队测试旅行社二',status:'有效'}
  ];
  const teamState={agencyId:null,guideId:null,type:undefined,filterType:undefined};
  const sceneViews={};
  const agency=()=>teamAgencies.find(x=>x.id===teamState.agencyId);
  const guide=()=>teamGuides.find(x=>x.id===teamState.guideId);
  const inTeam=()=>paymentFixture.session.scene==='team';
  const teamFilterHost=document.createElement('div');teamFilterHost.className='team-only';teamFilterHost.id='teamFilters';document.querySelector('.left').prepend(teamFilterHost);
  const teamSummaryHost=document.createElement('div');teamSummaryHost.className='team-only';teamSummaryHost.id='teamSummary';document.querySelector('.sale-head').before(teamSummaryHost);
  const chooserHost=document.createElement('div');document.body.append(chooserHost);
  // 两个充值入口共用同一组件、同一伙伴主数据；不复用或改写售票支付草稿。
  const partners=[
    {id:'partner-demo-1',type:'企业',name:'演示挂帐合作伙伴',account:'DEMO-A001',accountType:'ON_ACCOUNT',contact:'演示联系人一',phone:'',owner:'演示负责人',balance:-200,limit:500,enabled:true},
    {id:'partner-demo-2',type:'企业',name:'演示预付款合作伙伴',account:'DEMO-A002',accountType:'PREPAY',contact:'演示联系人二',phone:'',owner:'演示负责人',balance:80,limit:0,enabled:true}
  ];
  const partnerState={id:null,temporary:false,customer:'',owner:null};
  const rechargeRecords=[];
  const partner=()=>partners.find(p=>p.id===partnerState.id);
  const inPartner=()=>paymentFixture.session.scene==='partnerSale';
  const accountLabel=code=>code==='PREPAY'?'预付款':'挂帐';
  const partnerHost=document.createElement('div');partnerHost.className='partner-only';partnerHost.id='partnerControls';document.querySelector('.left').prepend(partnerHost);
  const partnerSummaryHost=document.createElement('div');partnerSummaryHost.className='partner-only';partnerSummaryHost.id='partnerSummary';document.querySelector('.sale-head').before(partnerSummaryHost);
  const rechargeButtonHost=document.createElement('span');rechargeButtonHost.className='partner-only partner-recharge-entry';document.querySelector('.payment-box').after(rechargeButtonHost);
  const partnerListHost=document.createElement('main');partnerListHost.id='partnerWorkspace';partnerListHost.hidden=true;document.querySelector('main.page').after(partnerListHost);
  const rechargeHost=document.createElement('div');document.body.append(rechargeHost);
  function partnerError(checkAmount=true){
    if(!inPartner())return '';
    if(partnerState.temporary)return !partnerState.owner?'请选择对接负责人':!partnerState.customer.trim()?'请输入客户名称':'';
    const p=partner();if(!p?.enabled)return '请选择可用合作伙伴';
    const amount=cart.reduce((sum,x)=>sum+x.price*x.qty,0);
    if(checkAmount&&p.accountType==='PREPAY'&&Math.round(amount*100)>Math.round(p.balance*100))return '合作伙伴预付款余额不足，请先充值';
    if(checkAmount&&p.accountType==='ON_ACCOUNT'&&p.limit!==null&&Math.round(amount*100)>Math.round((p.balance+p.limit)*100))return '合作伙伴可用挂帐额度不足';
    return '';
  }

    {title:'合作类型',dataIndex:'type',width:100},{title:'合作伙伴名称',dataIndex:'name',width:210},
    ...(!selecting?[{title:'账户号',dataIndex:'account',width:150},{title:'默认账户类型',dataIndex:'accountType',width:130,render:accountLabel}]:[]),

  const partnerPagination={pageSize:20,showSizeChanger:true,showQuickJumper:true,showTotal:total=>`共 ${total} 条`,locale:{items_per_page:'条/页',jump_to:'跳至',jump_to_confirm:'确定',page:'页',prev_page:'上一页',next_page:'下一页'}};
  function PartnerChooser(){
    const [open,setOpen]=useState(true),[selected,setSelected]=useState(partnerState.id),[draft,setDraft]=useState({}),[query,setQuery]=useState({});
