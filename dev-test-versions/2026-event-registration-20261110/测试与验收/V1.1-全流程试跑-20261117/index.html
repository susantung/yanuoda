费N=1与N=10独立样本→完整必要条件→提交 | 无票/订单/付款，成功人数按N增加 |\n| F04恢复逆向 | 主报人＋原订单/退款端 | 独立待付款样本→仅取消收银台；另一样本实际关闭；独立成功单退款/重报 | 各状态不混用、名额只按实际结果变化、历史资料与订单关系正确 |\n| F05配置历史 | 后台＋不同状态报名 | 仅阅读→半填暂存→已有订单各独立项目 | 锁定条件分开验证，不用删记录解除锁定 |\n| F06通知 | 模板管理员＋指定测试收件人 | 配模板→实际成功→记录；延期统计确认→发送；选原记录重发 | 四状态/按人/缺号跳过/原内容重发，实际回执独立于任务提交 |\n\n付款、退款、已取消重报及限额样本互斥，按下表独立准备；前置不满足只影响依赖分支。未知提交先按实际业务ID回查，不重复提交。\n\n## 3. 环境与待补信息\n\n1. 本次HTTP测试后台地址、票务设置入口、原订单及退款/审核入口，主体或景区选择。若同一入口，请说明对应菜单。\n2. 测试凭据文件/目录及角色对应关系，不在聊天或报告复制密码。\n3. 开发者工具当前QA HTTP接口环境、编译入口中的赛事参数、实际构建及测试身份；现有小程序只是预检，不默认与后台同主体。\n4. 可新建的测试赛事/项目/票，允许使用的原票类型与测试支付方式；真实付款/退款由用户接手完成。\n5. 测试参赛资料及主报人/组员身份、短信指定测试接收号码；不使用不明真实报名人做批量通知。\n6. 可用底图与真机配合时间。缺失信息列为执行准备，业务用例仍是未跑，不批量标业务阻塞。\n\n## 4. 测试数据与恢复\n\n下表保留设计初始条件；D01/D02票资源已建立，D03收费草稿65、D05单人免费成功66已实际执行，其他未建立样本仍为计划。实际创建后记录赛事/项目/原票/原订单ID与金额状态；报告不存完整证件、手机号、凭据或笔迹原图。\n\n| 数据组 | 初始条件与创建方式 | 互斥/恢复义务 |\n|---|---|---|\n| D01 原票兼容组 | 已上架、固定日期且覆盖比赛日；每券2人、按实际报价P和库存Q记录；有限项目名额4人。独立准备两张兼容票，另准备日历票单日样本。 | 用于收费主链及多票共享名额；不能用不知来源旧单代替。 |\n| D02 原票拒绝组 | 分别准备不匹配每券人数、缺比赛日报价、不覆盖有效期、无可售交集、未上架票；逐个改变一个条件。 | 只使用专用测试票；记录原值和恢复方法，不改正常运营票。 |\n| D03 免签收费组 | 独立赛事/项目，N=2、收集姓名和证件；手机号选填，使用D01票。 | 主链支付成功专用，付款方式/额度待提供；不与关闭订单样本共用。 |\n| D04 需签收费组 | N=2、两份不同阅读方式材料；主报人及指定组员测试身份，全部合规测试资料。 | 同机与跨账号分享分开；不伪造真实证件或代替他人签署。 |\n| D05 免费组 | N=1与N=10独立项目；名额充足；不关联票。 | 覆盖人数边界与免费成功；不制造收费订单。 |\n| D06 状态恢复组 | 同类专用项目下分别准备资料待完善、待签署、待提交、待付款、成功、已取消六份独立记录。 | 按不同测试账号或选项隔离，避免同账号同项重复建记录；保留实际内部关联及原订单号。 |\n| D07 关闭与退款组 | 未付款实际关闭、允许全额退款、审核中、退款失败、退款成功及已检票强退样本分别准备。 | 支付/退款方式待提供；优先本轮新单；不重复付款造证据，不能把退款当删除清理。 |\n| D08 通知收件人组 | 本轮专用成功样本：两名参赛者共用一个指定测试手机号；另有成功但无手机号者、待付者、已取消者。 | 只向用户指定测试号码发送；不向当前赛事不明真实报名人批量发送。人数与记录按人核算。 |\n| D09 海报与显示组 | 用户指定测试底图；空动态字段、较长项目/地点/姓名；两个项目值不同。 | 字体、宽度、缺值、层级和实时变化分别核对；不引用旧截图当本轮证据。 |\n| D10 配置历史组 | 互相隔离的仅阅读项目、半填暂存项目、已有订单项目；各记录原配置。 | 先测试无记录可编辑，再产生暂存/订单；不可逆锁定不用同一项目反复验证。 |\n\n## 5. 适用核验位置与判断方法\n\n| 类型 | 输入与联动 | 持久化/结果回查 | 不适用与边界 |\n|---|---|---|---|\n| 原票及项目配置 | 上架、日期、N、必填与选项、名额、报价库存、选票与交集 | 原票重开→B08→C01显示→最终提交消费；记录实际P/Q/N | 不存在的资金流水不造检查；原票本身规则不另设计 |\n| 阅读/暂存/签署 | 原记录读取、全员保存门槛、每份阅读条件、本人/组员权限 | 退出重入→C09/C10→B09/B10对应原记录和快照 | 页面回查不声称查数据库；不做已取消的笔迹姓名识别 |\n| 收费/免费 | 全员必需资料、票原资格、实时名额库存 | 原订单实际状态/实收→报名状态→B01/B03人数；免费无订单 | 付款界面不等于支付成功；无业务要求不造账表 |\n| 取消/退款 | 仅取消收银台和实际关闭分开，原票退款规则叠加赛事截止 | 原单/退款端→C09状态→名额→海报权限→新旧订单关联 | 真实资金需接手；正常逆向包含，故障/并发注入不加 |\n| 海报/查询/短信 | 缺值、长文、角色/状态、号码、模板与批次 | 成品实时数据；摘要脱敏；实际内容/人数/回执；重发保旧建新 | 不把HTML原型或模拟器能力等同真机相册、微信分享和送达 |\n\n## 6. 独立用例分支（执行设计，非结果）\n\n每支均有前置、数据、步骤、预期、回查、恢复、依赖与退出条件，可在HTML用例详情展开；所有分支在qa-state.json同源维护。\n\n### ENV01｜核实两端测试主体及环境\n\n模块：环境与入口；位置：后台/开发者工具；流程：前置。\n\n**ENV01-01 环境身份（本期必测／未跑）**\n\n前置：测试入口、主体和身份核实；准备D03；满足本分支所列初始条件。 数据：D03；依赖：无。\n\n1. 核对后台最终HTTP测试地址与登录主体\n2. 核对模拟器当前配置、编译入口及实际接口主机\n3. 记录可核验构建标识\n\n预期：后台与小程序指向同一目标测试主体；QA0及AR视界配置需当前证据确认，不能沿用旧聊天结论\n\n回查：后台主体/权限显示；开发者工具编译及请求目标。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\n\n退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\n\n**ENV01-02 启动与直达（本期必测／未跑）**\n\n前置：测试入口、主体和身份核实；准备D03；满足本分支所列初始条件。 数据：D03；依赖：无。\n\n1. 重编译既有赛事入口\n2. 查看赛事总览\n3. 核对赛事上下文和返回路径\n\n预期：能进入真实赛事页面；只有启动通过不代表报名功能通过\n\n回查：后台主体/权限显示；开发者工具编译及请求目标。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\n\n退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\n\n### T01｜建立兼容原票及真实报价库存\n\n模块：票务准备；位置：原票配置/B08；流程：票务→报名。\n\n**T01-01 固定日期双人票（本期必测／未跑）**\n\n前置：测试入口、主体和身份核实；准备D01；满足本分支所列初始条件。 数据：D01；依赖：ENV01。\n\n1. 进入原票配置\n2. 核对上架、有效期、可售窗口、每券人数、报价P和库存Q\n3. 保存重开\n\n预期：比赛日有效、每券2人、1张票承载2人；报价与库存来自原票；报名模块不另建票价库存\n\n回查：原票配置重开；B08候选及关联表。恢复：专用测试票保留用于后续样本；结束时按用户约定停用/恢复，不删除未知旧票。\n\n退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\n\n**T01-02 日历票单日（本期必测／未跑）**\n\n前置：测试入口、主体和身份核实；准备D01；满足本分支所列初始条件。 数据：D01；依赖：ENV01。\n\n1. 配置单比赛日的日历票报价与库存\n2. 在B08选票\n3. 核对比赛日数值\n\n预期：取比赛当天价格与库存，不取最低价或其他日期\n\n回查：原票配置重开；B08候选及关联表。恢复：专用测试票保留用于后续样本；结束时按用户约定停用/恢复，不删除未知旧票。\n\n退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\n\n### T02｜验证不兼容原票不被关联\n\n模块：票务准备；位置：原票配置/B08；流程：票务→匹配。\n\n**T02-01 人数不匹配（本期必测／未跑）**\n\n前置：测试入口、主体和身份核实；准备D02；满足本分支所列初始条件。 数据：D02；依赖：ENV01。\n\n1. 使用每券人数不等于N的票\n2. 打开B08候选及规则详情\n3. 尝试关联\n\n预期：展示不匹配原 1保留；原票132948已恢复上架；收费67仍未出单，未发短信。原生窗口已恢复，模拟器390宽已恢复。11/18新版回归已补公开姓名查询和1366/1920实际布局；项目33名额从4增至6用于验证只增不减，最终赛事成功13/54。未恢复为4，以免违背业务规则。\n", "_warnings": [], "_planHtml": "\u003ch1>赛事活动报名｜后台与小程序全流程验收方案\u003c/h1>\n\u003cp>版本：V1.1现行方案；方案日期：2026-11-17；执行更新：2026-11-18；状态：用户已授权执行。\u003c/p>\n\u003cp>本报告保留完整设计；用户现已授权准备票资源并执行非支付分支，当前结果见验收报告及执行记录-20261118.md。此前入口预检不计业务通过。现有PC Web技能只复用方法和报告，小程序本次为项目试跑，不修改通用技能。\u003c/p>\n\u003ch2>1. 范围与基线\u003c/h2>\n\u003cp>覆盖原票准备与匹配、B01—B12后台、P00/C01—C11小程序、K01—K07公共规则及两端数据回查。正式依据为方案目录分篇MD与流程、V1.1迭代对照，记录文件指纹。旧原型演示数据和历史检查不充当本轮通过证据。\u003c/p>\n\u003cp>原票配置是完整链路的真实前置，不只测试报名页。票务设置路径、字段与权限需进入用户给定测试系统确认；不编造菜单名或数据库/API字段，不自动对应查询代码库。仅验证本需求使用的原票能力，不扩大为整个票务系统回归。\u003c/p>\n\u003cp>导出列与范围、签完提醒发起人等未定项不作为当前失败用例；故障注入、并发专项、历史数据专项和生产验证不默认加入。已明确的正常校验、取消、退款、权限及状态恢复保留。本方案包含延期短信通知，不扩展成比赛延期或赛事取消业务系统。\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>模块\u003c/th>\u003cth>规则与覆盖\u003c/th>\u003cth>回查目标\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>原票准备\u003c/td>\u003ctd>原票配置＋B08/K02/K07；T01/T02\u003c/td>\u003ctd>有效期、人数、比赛日报价库存、上架及可售交集\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>后台设置\u003c/td>\u003ctd>B01—B08、B01—B04/B05用例\u003c/td>\u003ctd>保存重开、完成状态、游客消费同配置及历史锁定\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>阅读与资料\u003c/td>\u003ctd>C01—C05、C01—C05用例\u003c/td>\u003ctd>仅阅读不建记录、暂存唯一记录、签署权限与快照\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>交易及恢复\u003c/td>\u003ctd>C06—C10/K06、C06—C09/R01/R02\u003c/td>\u003ctd>原订单、实收、名额、原记录复用、退款关联\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>成品与通知\u003c/td>\u003ctd>B11/B12/C08/C11、P01/Q01/S01—S04\u003c/td>\u003ctd>实时海报、公开查询隐私、实际通知接收与内容\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>页面与真机\u003c/td>\u003ctd>X01/X02\u003c/td>\u003ctd>模拟器与真机结论分开\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>2. 流程矩阵与执行顺序\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>流程\u003c/th>\u003cth>入口/角色\u003c/th>\u003cth>依赖与顺序\u003c/th>\u003cth>可判定结果\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>F01首条完整链\u003c/td>\u003ctd>后台运营＋主报人＋原订单\u003c/td>\u003ctd>ENV01→T01→B01—B04→C01/C03→C06→B06/P01/Q01/S02\u003c/td>\u003ctd>真实同一记录和原订单、N人及金额/人数闭环；先跑此链再扩展\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>F02需签链\u003c/td>\u003ctd>主报人＋指定组员\u003c/td>\u003ctd>阅读→全员资料暂存→本人/分享签署→统一提交→后台回查\u003c/td>\u003ctd>所有人签署与对应资料匹配，权限无越界\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>F03免费链\u003c/td>\u003ctd>主报人\u003c/td>\u003ctd>免费N=1与N=10独立样本→完整必要条件→提交\u003c/td>\u003ctd>无票/订单/付款，成功人数按N增加\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>F04恢复逆向\u003c/td>\u003ctd>主报人＋原订单/退款端\u003c/td>\u003ctd>独立待付款样本→仅取消收银台；另一样本实际关闭；独立成功单退款/重报\u003c/td>\u003ctd>各状态不混用、名额只按实际结果变化、历史资料与订单关系正确\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>F05配置历史\u003c/td>\u003ctd>后台＋不同状态报名\u003c/td>\u003ctd>仅阅读→半填暂存→已有订单各独立项目\u003c/td>\u003ctd>锁定条件分开验证，不用删记录解除锁定\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>F06通知\u003c/td>\u003ctd>模板管理员＋指定测试收件人\u003c/td>\u003ctd>配模板→实际成功→记录；延期统计确认→发送；选原记录重发\u003c/td>\u003ctd>四状态/按人/缺号跳过/原内容重发，实际回执独立于任务提交\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003cp>付款、退款、已取消重报及限额样本互斥，按下表独立准备；前置不满足只影响依赖分支。未知提交先按实际业务ID回查，不重复提交。\u003c/p>\n\u003ch2>3. 环境与待补信息\u003c/h2>\n\u003col>\u003cli>本次HTTP测试后台地址、票务设置入口、原订单及退款/审核入口，主体或景区选择。若同一入口，请说明对应菜单。\n\u003c/li>\u003cli>测试凭据文件/目录及角色对应关系，不在聊天或报告复制密码。\n\u003c/li>\u003cli>开发者工具当前QA HTTP接口环境、编译入口中的赛事参数、实际构建及测试身份；现有小程序只是预检，不默认与后台同主体。\n\u003c/li>\u003cli>可新建的测试赛事/项目/票，允许使用的原票类型与测试支付方式；真实付款/退款由用户接手完成。\n\u003c/li>\u003cli>测试参赛资料及主报人/组员身份、短信指定测试接收号码；不使用不明真实报名人做批量通知。\n\u003c/li>\u003cli>可用底图与真机配合时间。缺失信息列为执行准备，业务用例仍是未跑，不批量标业务阻塞。\n\u003c/li>\u003c/ol>\n\u003ch2>4. 测试数据与恢复\u003c/h2>\n\u003cp>下表保留设计初始条件；D01/D02票资源已建立，D03收费草稿65、D05单人免费成功66已实际执行，其他未建立样本仍为计划。实际创建后记录赛事/项目/原票/原订单ID与金额状态；报告不存完整证件、手机号、凭据或笔迹原图。\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>数据组\u003c/th>\u003cth>初始条件与创建方式\u003c/th>\u003cth>互斥/恢复义务\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>D01 原票兼容组\u003c/td>\u003ctd>已上架、固定日期且覆盖比赛日；每券2人、按实际报价P和库存Q记录；有限项目名额4人。独立准备两张兼容票，另准备日历票单日样本。\u003c/td>\u003ctd>用于收费主链及多票共享名额；不能用不知来源旧单代替。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>D02 原票拒绝组\u003c/td>\u003ctd>分别准备不匹配每券人数、缺比赛日报价、不覆盖有效期、无可售交集、未上架票；逐个改变一个条件。\u003c/td>\u003ctd>只使用专用测试票；记录原值和恢复方法，不改正常运营票。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>D03 免签收费组\u003c/td>\u003ctd>独立赛事/项目，N=2、收集姓名和证件；手机号选填，使用D01票。\u003c/td>\u003ctd>主链支付成功专用，付款方式/额度待提供；不与关闭订单样本共用。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>D04 需签收费组\u003c/td>\u003ctd>N=2、两份不同阅读方式材料；主报人及指定组员测试身份，全部合规测试资料。\u003c/td>\u003ctd>同机与跨账号分享分开；不伪造真实证件或代替他人签署。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>D05 免费组\u003c/td>\u003ctd>N=1与N=10独立项目；名额充足；不关联票。\u003c/td>\u003ctd>覆盖人数边界与免费成功；不制造收费订单。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>D06 状态恢复组\u003c/td>\u003ctd>同类专用项目下分别准备资料待完善、待签署、待提交、待付款、成功、已取消六份独立记录。\u003c/td>\u003ctd>按不同测试账号或选项隔离，避免同账号同项重复建记录；保留实际内部关联及原订单号。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>D07 关闭与退款组\u003c/td>\u003ctd>未付款实际关闭、允许全额退款、审核中、退款失败、退款成功及已检票强退样本分别准备。\u003c/td>\u003ctd>支付/退款方式待提供；优先本轮新单；不重复付款造证据，不能把退款当删除清理。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>D08 通知收件人组\u003c/td>\u003ctd>本轮专用成功样本：两名参赛者共用一个指定测试手机号；另有成功但无手机号者、待付者、已取消者。\u003c/td>\u003ctd>只向用户指定测试号码发送；不向当前赛事不明真实报名人批量发送。人数与记录按人核算。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>D09 海报与显示组\u003c/td>\u003ctd>用户指定测试底图；空动态字段、较长项目/地点/姓名；两个项目值不同。\u003c/td>\u003ctd>字体、宽度、缺值、层级和实时变化分别核对；不引用旧截图当本轮证据。\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>D10 配置历史组\u003c/td>\u003ctd>互相隔离的仅阅读项目、半填暂存项目、已有订单项目；各记录原配置。\u003c/td>\u003ctd>先测试无记录可编辑，再产生暂存/订单；不可逆锁定不用同一项目反复验证。\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>5. 适用核验位置与判断方法\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\u003cthead>\u003ctr>\u003cth>类型\u003c/th>\u003cth>输入与联动\u003c/th>\u003cth>持久化/结果回查\u003c/th>\u003cth>不适用与边界\u003c/th>\u003c/tr>\u003c/thead>\u003ctbody>\n\u003ctr>\u003ctd>原票及项目配置\u003c/td>\u003ctd>上架、日期、N、必填与选项、名额、报价库存、选票与交集\u003c/td>\u003ctd>原票重开→B08→C01显示→最终提交消费；记录实际P/Q/N\u003c/td>\u003ctd>不存在的资金流水不造检查；原票本身规则不另设计\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>阅读/暂存/签署\u003c/td>\u003ctd>原记录读取、全员保存门槛、每份阅读条件、本人/组员权限\u003c/td>\u003ctd>退出重入→C09/C10→B09/B10对应原记录和快照\u003c/td>\u003ctd>页面回查不声称查数据库；不做已取消的笔迹姓名识别\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>收费/免费\u003c/td>\u003ctd>全员必需资料、票原资格、实时名额库存\u003c/td>\u003ctd>原订单实际状态/实收→报名状态→B01/B03人数；免费无订单\u003c/td>\u003ctd>付款界面不等于支付成功；无业务要求不造账表\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>取消/退款\u003c/td>\u003ctd>仅取消收银台和实际关闭分开，原票退款规则叠加赛事截止\u003c/td>\u003ctd>原单/退款端→C09状态→名额→海报权限→新旧订单关联\u003c/td>\u003ctd>真实资金需接手；正常逆向包含，故障/并发注入不加\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>海报/查询/短信\u003c/td>\u003ctd>缺值、长文、角色/状态、号码、模板与批次\u003c/td>\u003ctd>成品实时数据；摘要脱敏；实际内容/人数/回执；重发保旧建新\u003c/td>\u003ctd>不把HTML原型或模拟器能力等同真机相册、微信分享和送达\u003c/td>\u003c/tr>\n\u003c/tbody>\u003c/table>\u003c/div>\n\u003ch2>6. 独立用例分支（执行设计，非结果）\u003c/h2>\n\u003cp>每支均有前置、数据、步骤、预期、回查、恢复、依赖与退出条件，可在HTML用例详情展开；所有分支在qa-state.json同源维护。\u003c/p>\n\u003ch3>ENV01｜核实两端测试主体及环境\u003c/h3>\n\u003cp>模块：环境与入口；位置：后台/开发者工具；流程：前置。\u003c/p>\n\u003cp>\u003cstrong>ENV01-01 环境身份（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D03；满足本分支所列初始条件。 数据：D03；依赖：无。\u003c/p>\n\u003col>\u003cli>核对后台最终HTTP测试地址与登录主体\n\u003c/li>\u003cli>核对模拟器当前配置、编译入口及实际接口主机\n\u003c/li>\u003cli>记录可核验构建标识\n\u003c/li>\u003c/ol>\n\u003cp>预期：后台与小程序指向同一目标测试主体；QA0及AR视界配置需当前证据确认，不能沿用旧聊天结论\u003c/p>\n\u003cp>回查：后台主体/权限显示；开发者工具编译及请求目标。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>ENV01-02 启动与直达（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D03；满足本分支所列初始条件。 数据：D03；依赖：无。\u003c/p>\n\u003col>\u003cli>重编译既有赛事入口\n\u003c/li>\u003cli>查看赛事总览\n\u003c/li>\u003cli>核对赛事上下文和返回路径\n\u003c/li>\u003c/ol>\n\u003cp>预期：能进入真实赛事页面；只有启动通过不代表报名功能通过\u003c/p>\n\u003cp>回查：后台主体/权限显示；开发者工具编译及请求目标。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003ch3>T01｜建立兼容原票及真实报价库存\u003c/h3>\n\u003cp>模块：票务准备；位置：原票配置/B08；流程：票务→报名。\u003c/p>\n\u003cp>\u003cstrong>T01-01 固定日期双人票（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D01；满足本分支所列初始条件。 数据：D01；依赖：ENV01。\u003c/p>\n\u003col>\u003cli>进入原票配置\n\u003c/li>\u003cli>核对上架、有效期、可售窗口、每券人数、报价P和库存Q\n\u003c/li>\u003cli>保存重开\n\u003c/li>\u003c/ol>\n\u003cp>预期：比赛日有效、每券2人、1张票承载2人；报价与库存来自原票；报名模块不另建票价库存\u003c/p>\n\u003cp>回查：原票配置重开；B08候选及关联表。恢复：专用测试票保留用于后续样本；结束时按用户约定停用/恢复，不删除未知旧票。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>T01-02 日历票单日（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D01；满足本分支所列初始条件。 数据：D01；依赖：ENV01。\u003c/p>\n\u003col>\u003cli>配置单比赛日的日历票报价与库存\n\u003c/li>\u003cli>在B08选票\n\u003c/li>\u003cli>核对比赛日数值\n\u003c/li>\u003c/ol>\n\u003cp>预期：取比赛当天价格与库存，不取最低价或其他日期\u003c/p>\n\u003cp>回查：原票配置重开；B08候选及关联表。恢复：专用测试票保留用于后续样本；结束时按用户约定停用/恢复，不删除未知旧票。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003ch3>T02｜验证不兼容原票不被关联\u003c/h3>\n\u003cp>模块：票务准备；位置：原票配置/B08；流程：票务→匹配。\u003c/p>\n\u003cp>\u003cstrong>T02-01 人数不匹配（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D02；满足本分支所列初始条件。 数据：D02；依赖：ENV01。\u003c/p>\n\u003col>\u003cli>使用每券人数不等于N的票\n\u003c/li>\u003cli>打开B08候选及规则详情\n\u003c/li>\u003cli>尝试关联\n\u003c/li>\u003c/ol>\n\u003cp>预期：展示不匹配原因，不允许选入完成\u003c/p>\n\u003cp>回查：原票具体配置；B08规则详情/完成反馈；C01显示。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>T02-02 日期或报价缺失（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D02；满足本分支所列初始条件。 数据：D02；依赖：ENV01。\u003c/p>\n\u003col>\u003cli>分别使用缺比赛日报价、固定期未覆盖完整比赛期及多日比赛日历票\n\u003c/li>\u003cli>尝试关联\n\u003c/li>\u003c/ol>\n\u003cp>预期：分别拒绝，不能使用其他日报价或不完整有效期兜底\u003c/p>\n\u003cp>回查：原票具体配置；B08规则详情/完成反馈；C01显示。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>T02-03 无交集和下架（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D02；满足本分支所列初始条件。 数据：D02；依赖：ENV01。\u003c/p>\n\u003col>\u003cli>分别使用无可售交集及未上架票\n\u003c/li>\u003cli>查看候选及已有关系回显\n\u003c/li>\u003c/ol>\n\u003cp>预期：无交集提示具体原因；候选不提供未上架票；原关联失效保留后台原因，游客隐藏\u003c/p>\n\u003cp>回查：原票具体配置；B08规则详情/完成反馈；C01显示。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003ch3>B01｜赛事列表、编辑及推广\u003c/h3>\n\u003cp>模块：赛事配置；位置：B01/B02；流程：配置起点。\u003c/p>\n\u003cp>\u003cstrong>B01-01 编辑保存（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D03；满足本分支所列初始条件。 数据：D03；依赖：ENV01。\u003c/p>\n\u003col>\u003cli>新建专用赛事\n\u003c/li>\u003cli>填名称/封面/地点/联系电话/日期/介绍和退款截止\n\u003c/li>\u003cli>保存重开\n\u003c/li>\u003c/ol>\n\u003cp>预期：字段持久化且列表取同一赛事；空退款截止不额外限制；开始晚于结束按规则拒绝\u003c/p>\n\u003cp>回查：B01列表/分页；B02重开；实际目标页。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>B01-02 查询重置及推广（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D03；满足本分支所列初始条件。 数据：D03；依赖：ENV01。\u003c/p>\n\u003col>\u003cli>按名称和时间查询\n\u003c/li>\u003cli>重置\n\u003c/li>\u003cli>分别打开推广和报名查询页推广\n\u003c/li>\u003c/ol>\n\u003cp>预期：筛选重置有效；两入口分别绑定本赛事C01和C11，真实码/链接可用，不复制虚构值\u003c/p>\n\u003cp>回查：B01列表/分页；B02重开；实际目标页。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003ch3>B02｜步骤、时间和排序\u003c/h3>\n\u003cp>模块：项目配置；位置：B03/B04；流程：后台配置。\u003c/p>\n\u003cp>\u003cstrong>B02-01 项目配置与日期（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D03,D05；满足本分支所列初始条件。 数据：D03,D05；依赖：B01。\u003c/p>\n\u003col>\u003cli>创建项目\n\u003c/li>\u003cli>设置名称、说明、集合地点及两类时间\n\u003c/li>\u003cli>逐步保存后重开\n\u003c/li>\u003c/ol>\n\u003cp>预期：报名及比赛时间独立、各自起止合法；报名截止允许晚于比赛开始；完成标记与真实保存一致\u003c/p>\n\u003cp>回查：B03顺序/状态；B04重开；C01项目顺序。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>B02-02 拖动排序保存取消（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D03,D05；满足本分支所列初始条件。 数据：D03,D05；依赖：B01。\u003c/p>\n\u003col>\u003cli>准备两个项目\n\u003c/li>\u003cli>拖动后取消\n\u003c/li>\u003cli>再拖动保存\n\u003c/li>\u003cli>重开后台及C01\n\u003c/li>\u003c/ol>\n\u003cp>预期：取消恢复旧序；保存后后台和游客按已存顺序，无未保存顺序泄漏\u003c/p>\n\u003cp>回查：B03顺序/状态；B04重开；C01项目顺序。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003ch3>B03｜配置字段与阅读材料\u003c/h3>\n\u003cp>模块：资料与材料；位置：B05/B06；流程：后台→游客。\u003c/p>\n\u003cp>\u003cstrong>B03-01 字段配置校验（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D04,D10；满足本分支所列初始条件。 数据：D04,D10；依赖：B02。\u003c/p>\n\u003col>\u003cli>设置姓名、证件、手机号及文本/选项字段\n\u003c/li>\u003cli>核对类型和约束\n\u003c/li>\u003cli>保存重开\n\u003c/li>\u003c/ol>\n\u003cp>预期：姓名固定必填，证件沿身份证；手机号按项目配置选填，不为短信强加必填；限制以现行B05为准\u003c/p>\n\u003cp>回查：B05/B06重开；C02材料顺序；C03字段。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>B03-02 材料阅读方式（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D04,D10；满足本分支所列初始条件。 数据：D04,D10；依赖：B02。\u003c/p>\n\u003col>\u003cli>需签项目配置多份材料\n\u003c/li>\u003cli>分别设置无时长/阅读到底/计时方式及顺序\n\u003c/li>\u003cli>保存重开\n\u003c/li>\u003c/ol>\n\u003cp>预期：至少一份；每份方式单选，说明与正文分开；免签项目跳过材料步骤\u003c/p>\n\u003cp>回查：B05/B06重开；C02材料顺序；C03字段。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003ch3>B04｜人数、总名额和收费匹配\u003c/h3>\n\u003cp>模块：人数与门票；位置：B07/B08；流程：配置完成。\u003c/p>\n\u003cp>\u003cstrong>B04-01 人数边界（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D01,D02,D05；满足本分支所列初始条件。 数据：D01,D02,D05；依赖：T01,B03。\u003c/p>\n\u003col>\u003cli>在无记录专用项目依次试N=1、10、0、11和小数\n\u003c/li>\u003cli>设置有限名额\n\u003c/li>\u003cli>保存\n\u003c/li>\u003c/ol>\n\u003cp>预期：1和10可保存；0、11及小数拒绝；有限总名额是N整数倍；游客不能改变人数\u003c/p>\n\u003cp>回查：B07/B08完成反馈及重开；C01展示/窗口/价格。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>B04-02 容量与重复票（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D01,D02,D05；满足本分支所列初始条件。 数据：D01,D02,D05；依赖：T01,B03。\u003c/p>\n\u003col>\u003cli>N=2、总名额4\n\u003c/li>\u003cli>关联合计1张票\n\u003c/li>\u003cli>再改为合计2张或更多\n\u003c/li>\u003cli>尝试重复加同票\n\u003c/li>\u003c/ol>\n\u003cp>预期：首次库存×N不足4时不能完成；等于或大于可完成；同项目不可重复同票\u003c/p>\n\u003cp>回查：B07/B08完成反馈及重开；C01展示/窗口/价格。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>B04-03 名称窗口与刷新（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D01,D02,D05；满足本分支所列初始条件。 数据：D01,D02,D05；依赖：T01,B03。\u003c/p>\n\u003col>\u003cli>设置报名展示名称和限制\n\u003c/li>\u003cli>选票\n\u003c/li>\u003cli>修改专用原票报价/窗口\n\u003c/li>\u003cli>重开并最终完成\n\u003c/li>\u003c/ol>\n\u003cp>预期：展示名称必填且最多20字；交集只读；重开/选票/最终完成均读取最新原票，不匹配阻止完成\u003c/p>\n\u003cp>回查：B07/B08完成反馈及重开；C01展示/窗口/价格。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003ch3>C01｜报名项状态和字段展示\u003c/h3>\n\u003cp>模块：游客入口；位置：C01；流程：游客开始。\u003c/p>\n\u003cp>\u003cstrong>C01-01 收费免费取值（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D03,D05；满足本分支所列初始条件。 数据：D03,D05；依赖：B04。\u003c/p>\n\u003col>\u003cli>打开收费项目和免费项目\n\u003c/li>\u003cli>核对名称、价格、时间及限制\n\u003c/li>\u003cli>尝试可用报名入口\n\u003c/li>\u003c/ol>\n\u003cp>预期：收费P为1张总价，N=2显示P/2人；免费无价格/票名；报名窗口分别取票交集或项目窗口\u003c/p>\n\u003cp>回查：C01状态/按钮；B03人数；原订单实际状态。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>C01-02 时间名额库存优先级（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D03,D05；满足本分支所列初始条件。 数据：D03,D05；依赖：B04。\u003c/p>\n\u003col>\u003cli>使用独立项目分别设置未开始、已截止、R=0、R\u0026gt;=N且Q=0、R=0且Q=0\n\u003c/li>\u003cli>重开总览\n\u003c/li>\u003c/ol>\n\u003cp>预期：先时间，再名额，再票 D10；依赖：C01。\u003c/p>\n\u003col>\u003cli>已有暂存后修改字段\n\u003c/li>\u003cli>切换须知/资料\n\u003c/li>\u003cli>离开重入\n\u003c/li>\u003c/ol>\n\u003cp>预期：切标签保留输入和位置；离开丢本次未存改动、保留旧暂存，不添加三按钮离开确认\u003c/p>\n\u003cp>回查：C03回显/提示；C09及B09同一记录；项目人数。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>C03-03 必填与正常格式（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D03,D04,D10；满足本分支所列初始条件。 数据：D03,D04,D10；依赖：C01。\u003c/p>\n\u003col>\u003cli>清空必填或输入明显不合法证件\n\u003c/li>\u003cli>点立即报名\n\u003c/li>\u003cli>恢复合规测试资料\n\u003c/li>\u003c/ol>\n\u003cp>预期：提交定位实际缺项/格式错误且不建订单；暂存和提交校验不得混为全部必填门槛\u003c/p>\n\u003cp>回查：C03回显/提示；C09及B09同一记录；项目人数。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003ch3>C04｜保存门槛与本人签署\u003c/h3>\n\u003cp>模块：阅读签署；位置：C04/C05；流程：签署主链。\u003c/p>\n\u003cp>\u003cstrong>C04-01 签署门槛（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D04；满足本分支所列初始条件。 数据：D04；依赖：C02,C03。\u003c/p>\n\u003col>\u003cli>填写但不保存\n\u003c/li>\u003cli>检查签署/分享\n\u003c/li>\u003cli>全员齐备暂存成功\n\u003c/li>\u003cli>进入本人签署\n\u003c/li>\u003c/ol>\n\u003cp>预期：只有全员必要资料齐并成功暂存才开放签署；不增加额外顶部保存按钮\u003c/p>\n\u003cp>回查：C03签署进度；C05本人回显；后台B10对应人员。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>C04-02 空画布和重签（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D04；满足本分支所列初始条件。 数据：D04；依赖：C02,C03。\u003c/p>\n\u003col>\u003cli>空画布确认\n\u003c/li>\u003cli>绘制测试笔迹并保存\n\u003c/li>\u003cli>重开查看\n\u003c/li>\u003cli>清空后退出\n\u003c/li>\u003cli>有效重签确认\n\u003c/li>\u003c/ol>\n\u003cp>预期：空画布拒绝；有效笔迹回显；清空退出不覆盖旧签；最后成功确认覆盖；不执行笔迹识别/姓名一致比对\u003c/p>\n\u003cp>回查：C03签署进度；C05本人回显；后台B10对应人员。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>C04-03 姓名与其他资料 按原单回查，不重复下单。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>C06-02 实际付款成功（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D03；满足本分支所列初始条件。 数据：D03；依赖：C03,T01。\u003c/p>\n\u003col>\u003cli>按已确认测试支付方式完成指定订单\n\u003c/li>\u003cli>回查原订单\n\u003c/li>\u003cli>查看成功页与后台\n\u003c/li>\u003c/ol>\n\u003cp>预期：原订单实际成功后报名成功；本份N=2使成功人数增加2；金额以原票实际报价记录，不能用前端提示替代\u003c/p>\n\u003cp>回查：原订单详情/金额/票券；C09/C10；B09/B10；B01/B03人数。恢复：只用本轮专用测试单；测试支付方式和额度先明确。真实资金支付由用户接手；提交未知先按原单回查，不重复下单。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>C06-03 原资格校验（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D03；满足本分支所列初始条件。 数据：D03；依赖：C03,T01。\u003c/p>\n\u003col>\u003cli>第二位参赛者设置不符该票年龄/地区/性别等一项已配置限制\n\u003c/li>\u003cli>提交\n\u003c/li>\u003c/ol>\n\u003cp>预期：原规则校验全部N人，不只第一人；拒绝后无新增成功记录与有效订单\u003c/p>\n\u003cp>回查：原订单详情/金额/票券；C09/C10；B09/B10；B01/B03人数。恢复：只用本轮专用测试单；测试支付方式和额度先明确。真实资金支付由用户接手；提交未知先按原单回查，不重复下单。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003ch3>C07｜取消收银台和实际关闭订单\u003c/h3>\n\u003cp>模块：取消与恢复；位置：C07/C03/C09；流程：收费逆向。\u003c/p>\n\u003cp>\u003cstrong>C07-01 仅取消支付（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D06,D07；满足本分支所列初始条件。 数据：D06,D07；依赖：C06。\u003c/p>\n\u003col>\u003cli>提交到支付\n\u003c/li>\u003cli>取消微信收银台\n\u003c/li>\u003cli>从查看资料继续支付\n\u003c/li>\u003c/ol>\n\u003cp>预期：仍待付款且进入同一原订单；资料不解锁；不能误判实际取消\u003c/p>\n\u003cp>回查：原订单关闭状态；C03恢复值/按钮；B09条数；C01可用名额。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>C07-02 实际关闭（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D06,D07；满足本分支所列初始条件。 数据：D06,D07；依赖：C06。\u003c/p>\n\u003col>\u003cli>单独待付订单实际取消或按正常超时关闭\n\u003c/li>\u003cli>从可用首页报名/我的报名重入\n\u003c/li>\u003c/ol>\n\u003cp>预期：原记录/资料/有效签名保留，回未提交可修改；原订单关联按规则解绑，占用一次释放\u003c/p>\n\u003cp>回查：原订单关闭状态；C03恢复值/按钮；B09条数；C01可用名额。 务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>R01-02 审核中与实际成功（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D07；满足本分支所列初始条件。 数据：D07；依赖：C06。\u003c/p>\n\u003col>\u003cli>独立样本推进申请/审核/退款中\n\u003c/li>\u003cli>实际全额成功\n\u003c/li>\u003cli>回查报名、人数与海报\n\u003c/li>\u003c/ol>\n\u003cp>预期：中间状态/失败不释放；实际成功变已取消、释放N；退款前已成功记录此时禁止看/存/分享海报\u003c/p>\n\u003cp>回查：原退款申请/审核/订单；B09/B10；B03人数；C08/C09海报入口。恢复：由实际测试退款流程推进，不重复入账；记录本轮实际退款金额与原单，真实资金操作由用户接手。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>R01-03 重报关联（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D07；满足本分支所列初始条件。 数据：D07；依赖：C06。\u003c/p>\n\u003col>\u003cli>退款成功样本保留旧单\n\u003c/li>\u003cli>尝试当前条件不符重报\n\u003c/li>\u003cli>条件恢复再成功新下单\n\u003c/li>\u003c/ol>\n\u003cp>预期：失败保留原退款单关联；新下单成功才替换为新订单；旧退款单仍在我的订单\u003c/p>\n\u003cp>回查：原退款申请/审核/订单；B09/B10；B03人数；C08/C09海报入口。恢复：由实际测试退款流程推进，不重复入账；记录本轮实际退款金额与原单，真实资金操作由用户接手。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003ch3>R02｜不同退款端更新报名\u003c/h3>\n\u003cp>模块：退款重报；位置：票务/全域后台→报名；流程：跨端退款。\u003c/p>\n\u003cp>\u003cstrong>R02-01 票务或后台强退（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D07；满足本分支所列初始条件。 数据：D07；依赖：R01。\u003c/p>\n\u003col>\u003cli>使用独立已成功新单\n\u003c/li>\u003cli>按原系统正常退款入口实际全额退款（含允许的已检票强退）\n\u003c/li>\u003cli>回查报名\n\u003c/li>\u003c/ol>\n\u003cp>预期：任一端实际全额成功都使对应报名已取消、释放N；原票库存恢复沿原票务能力，不新增检票系统\u003c/p>\n\u003cp>回查：原退款端及订单；B09/B10；C09状态；B03人数。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003ch3>P01｜后台模板与游客实时渲染\u003c/h3>\n\u003cp>模块：海报；位置：B02/B04/B11/C08；流程：配置→成品。\u003c/p>\n\u003cp>\u003cstrong>P01-01 模板保存（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D09；满足本分支所列初始条件。 数据：D09；依赖：B01,B02,C06。\u003c/p>\n\u003col>\u003cli>上传指定测试底图\n\u003c/li>\u003cli>添加动态字段及静态文字\n\u003c/li>\u003cli>拖动/改宽度/字号颜色\n\u003c/li>\u003cli>预览保存重开\n\u003c/li>\u003c/ol>\n\u003cp>预期：背景、位置、宽度、样式及字段正确回显；无背景不伪造配置成功，其他比例整图不拉伸\u003c/p>\n\u003cp>回查：B11编辑/预览；C08实际字段/换行；C09海报入口。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>P01-02 实时缺值和长文（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D09；满足本分支所列初始条件。 数据：D09；依赖：B01,B02,C06。\u003c/p>\n\u003col>\u003cli>成功样本打开海报\n\u003c/li>\u003cli>修改专用赛事联系电话/项目地点\n\u003c/li>\u003cli>重开\n\u003c/li>\u003cli>检查空字段及长文\n\u003c/li>\u003c/ol>\n\u003cp>预期：底图叠实时文字，跟手机宽度适配；缺值隐藏；长文按配置宽度换行且高度增长，无旧快照生成规则\u003c/p>\n\u003cp>回查：B11编辑/预览；C08实际字段/换行；C09海报入口。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>P01-03 无模板兜底（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D09；满足本分支所列初始条件。 数据：D09；依赖：B01,B02,C06。\u003c/p>\n\u003col>\u003cli>用未配海报项目完成成功\n\u003c/li>\u003cli>查看结果\n\u003c/li>\u003c/ol>\n\u003cp>预期：普通成功兜底，报名成功不依赖海报模板，不要求再次付款\u003c/p>\n\u003cp>回查：B11编辑/预览；C08实际字段/换行；C09海报入口。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003ch3>Q01｜公开摘要与账号权限\u003c/h3>\n\u003cp>模块：查询与隐私；位置：P00/C11/C09/C10；流程：查询支线。\u003c/p>\n\u003cp>\u003cstrong>Q01-01 精确查询（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D06；满足本分支所列初始条件。 数据：D06；依赖：C06,C08。\u003c/p>\n\u003col>\u003cli>从本赛事独立查询入口分别用完整姓名、手机号、身份证查询\n\u003c/li>\u003cli>清空\n\u003c/li>\u003cli>输入不存在值\n\u003c/li>\u003c/ol>\n\u003cp>预期：单框精确OR；只返回本赛事成功者；同名多条分别返回；空值与无结果反馈可区分\u003c/p>\n\u003cp>回查：C11字段/结果；C09/C10当前身份；P00两目标。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>Q01-02 隐私边界（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D06；满足本分支所列初始条件。 数据：D06；依赖：C06,C08。\u003c/p>\n\u003col>\u003cli>查询成功样本\n\u003c/li>\u003cli>核对摘要字段及可点入口\n\u003c/li>\u003cli>切换为组员从我的报名查看\n\u003c/li>\u003c/ol>\n\u003cp>预期：公开手机号前三后四中间****，不返回身份证/整组/签名/支付/票码；不能查询即认领；组员权限独立\u003c/p>\n\u003cp>回查：C11字段/结果；C09/C10当前身份；P00两目标。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003ch3>S01｜通知页面与模板持久化\u003c/h3>\n\u003cp>模块：短信通知；位置：B12；流程：模板准备。\u003c/p>\n\u003cp>\u003cstrong>S01-01 页面和五筛选（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D08；满足本分支所列初始条件。 数据：D08；依赖：B01。\u003c/p>\n\u003col>\u003cli>打开短信通知\n\u003c/li>\u003cli>组合筛选参赛人/号码/项目/类型/状态\n\u003c/li>\u003cli>查询重置\n\u003c/li>\u003cli>查看内容\n\u003c/li>\u003c/ol>\n\u003cp>预期：只查当前赛事；查询重置同行；新增模板和批量延期靠右；仅待发送/发送中/成功/失败\u003c/p>\n\u003cp>回查：B12筛选列表；模板弹窗重开。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>S01-02 两类模板保存（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D08；满足本分支所列初始条件。 数据：D08；依赖：B01。\u003c/p>\n\u003col>\u003cli>新增模板\n\u003c/li>\u003cli>选成功通知\n\u003c/li>\u003cli>插入两参数到光标\n\u003c/li>\u003cli>保存再打开\n\u003c/li>\u003cli>切延期类型\n\u003c/li>\u003cli>编辑取消\n\u003c/li>\u003cli>重开\n\u003c/li>\u003c/ol>\n\u003cp>预期：正文空不得保存；两类型分别保存回显，取消不保存；显示对应说明；无内容预览/字数/参考文案填充\u003c/p>\n\u003cp>回查：B12筛选列表；模板弹窗重开。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003ch3>S02｜成功通知触发与缺号\u003c/h3>\n\u003cp>模块：短信通知；位置：B12/C06/C07；流程：报名→通知。\u003c/p>\n\u003cp>\u003cstrong>S02-01 无模板成功（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D08；满足本分支所列初始条件。 数据：D08；依赖：S01,C06,C08。\u003c/p>\n\u003col>\u003cli>专用赛事不配成功模板\n\u003c/li>\u003cli>分别完成免费/收费实际成功\n\u003c/li>\u003cli>查通知\n\u003c/li>\u003c/ol>\n\u003cp>预期：报名正常成功，不发短信且不产生发送记录\u003c/p>\n\u003cp>回查：B12记录/内容/回执；C09实际状态。恢复：仅指定测试接收人/赛事；通道、签名和测试发送方式确认后执行；保存历史内容与实际结果，不把已提交任务当送达。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>S02-02 按人发送与缺号（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D08；满足本分支所列初始条件。 数据：D08；依赖：S01,C06,C08。\u003c/p>\n\u003col>\u003cli>有模板赛事让同手机号两人成功\n\u003c/li>\u003cli>另一个无手机号者成功\n\u003c/li>\u003cli>回查记录内容\n\u003c/li>\u003c/ol>\n\u003cp>预期：同号两人各一条、姓名各自取值；缺号不发不记，不发给发起人；项目参数不取票名\u003c/p>\n\u003cp>回查：B12记录/内容/回执；C09实际状态。恢复：仅指定测试接收人/赛事；通道、签名和测试发送方式确认后执行；保存历史内容与实际结果，不把已提交任务当送达。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>S02-03 模板变化与非成功（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D08；满足本分支所列初始条件。 数据：D08；依赖：S01,C06,C08。\u003c/p>\n\u003col>\u003cli>修改成功模板\n\u003c/li>\u003cli>查看历史记录及新成功通知\n\u003c/li>\u003cli>查看仍待付款记录\n\u003c/li>\u003c/ol>\n\u003cp>预期：历史实际内容不变；新成功消费新模板；待付/仅取消支付不触发成功通知\u003c/p>\n\u003cp>回查：B12记录/内容/回执；C09实际状态。恢复：仅指定测试接收人/赛事；通道、签名和测试发送方式确认后执行；保存历史内容与实际结果，不把已提交任务当送达。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003ch3>S03｜延期统计与批量确认\u003c/h3>\n\u003cp>模块：短信通知；位置：B12；流程：延期支线。\u003c/p>\n\u003cp>\u003cstrong>S03-01 缺模板或无人（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D08；满足本分支所列初始条件。 数据：D08；依赖：S01,S02。\u003c/p>\n\u003col>\u003cli>未配置延期模板点击批量发送\n\u003c/li>\u003cli>配置后在无成功有号者赛事再次点击\n\u003c/li>\u003c/ol>\n\u003cp>预期：缺模板提示且不建任务；零接收者提示且不建空任务\u003c/p>\n\u003cp>回查：确认人数；批次范围；B12逐人发送内容和回执。恢复：只操作专用测试赛事及指定测试号码；确认后不重复点击；不修改日期/退款规则；记录未完成发送任务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>S03-02 范围和取消（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D08；满足本分支所列初始条件。 数据：D08；依赖：S01,S02。\u003c/p>\n\u003col>\u003cli>准备同号两成功、有号待付、无号成功、退款已取消\n\u003c/li>\u003cli>筛选列表\n\u003c/li>\u003cli>点延期\n\u003c/li>\u003cli>取消\n\u003c/li>\u003c/ol>\n\u003cp>预期：统计仅成功且有号，按人计数；同号两人计2；不受记录筛选限制；取消不发\u003c/p>\n\u003cp>回查：确认人数；批次范围；B12逐人发送内容和回执。恢复：只操作专用测试赛事及指定测试号码；确认后不重复点击；不修改日期/退款规则；记录未完成发送任务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>S03-03 确认与实际结果（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D08；满足本分支所列初始条件。 数据：D08；依赖：S01,S02。\u003c/p>\n\u003col>\u003cli>使用仅指定测试接收人的专用赛事\n\u003c/li>\u003cli>确认批量\n\u003c/li>\u003cli>回查任务和每人记录\n\u003c/li>\u003c/ol>\n\u003cp>预期：弹已成功报名xx人确认；确认后关闭并提示批量发送中/不要重复；处理中不重复触发；按实际回执记四状态\u003c/p>\n\u003cp>回查：确认人数；批次范围；B12逐人发送内容和回执。恢复：只操作专用测试赛事及指定测试号码；确认后不重复点击；不修改日期/退款规则；记录未完成发送任务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003ch3>S04｜勾选批量重发\u003c/h3>\n\u003cp>模块：短信通知；位置：B12；流程：通知逆向。\u003c/p>\n\u003cp>\u003cstrong>S04-01 选择规则（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D08；满足本分支所列初始条件。 数据：D08；依赖：S02。\u003c/p>\n\u003col>\u003cli>无勾选查看按钮\n\u003c/li>\u003cli>检查发送中行\n\u003c/li>\u003cli>勾选两条非发送中记录\n\u003c/li>\u003cli>取消确认\n\u003c/li>\u003c/ol>\n\u003cp>预期：未选禁用、发送中不可选；取消不产生尝试记录；操作列只有查看内容\u003c/p>\n\u003cp>回查：B12勾选/确认；原记录与新尝试内容。恢复：只向指定测试号码重发；保留原记录及新尝试，不删除原失败历史。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>S04-02 原内容重发（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D08；满足本分支所列初始条件。 数据：D08；依赖：S02。\u003c/p>\n\u003col>\u003cli>选定专用测试记录\n\u003c/li>\u003cli>修改现行模板\n\u003c/li>\u003cli>勾选原记录确认重发\n\u003c/li>\u003cli>回查新尝试\n\u003c/li>\u003c/ol>\n\u003cp>预期：用所选原记录接收人及实际内容，不读新模板；保留旧记录，新建尝试；确认后清勾选并显示处理中提示\u003c/p>\n\u003cp>回查：B12勾选/确认；原记录与新尝试内容。恢复：只向指定测试号码重发；保留原记录及新尝试，不删除原失败历史。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003ch3>X01｜适用视口与长内容\u003c/h3>\n\u003cp>模块：页面专项；位置：B01/B08/B09/B11/B12/C01/C03/C08；流程：两端显示。\u003c/p>\n\u003cp>\u003cstrong>X01-01 PC关键布局（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D09；满足本分支所列初始条件。 数据：D09；依赖：C01,C03,P01,S01。\u003c/p>\n\u003col>\u003cli>在目标PC常用及较窄窗口核对筛选、按钮、固定操作/分页、海报编辑和通知列表\n\u003c/li>\u003c/ol>\n\u003cp>预期：记录实际视口；查询重置同行且按钮可达；表格必要时横滚，不误遮挡\u003c/p>\n\u003cp>回查：各实际页面截图观察（仅问题留图）；开发者工具机型。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003cp>\u003cstrong>X01-02 小程序长内容（本期必测／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D09；满足本分支所列初始条件。 数据：D09；依赖：C01,C03,P01,S01。\u003c/p>\n\u003col>\u003cli>选两个开发者工具机型尺寸\n\u003c/li>\u003cli>核对长标题/限制、资料底栏、海报长文\n\u003c/li>\u003cli>恢复原机型\n\u003c/li>\u003c/ol>\n\u003cp>预期：按手机宽度适配，关键按钮可达且不遮挡；只记实际模拟器尺寸，不声称真机通过\u003c/p>\n\u003cp>回查：各实际页面截图观察（仅问题留图）；开发者工具机型。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003ch3>X02｜真实微信能力与跨设备签署\u003c/h3>\n\u003cp>模块：真机验证；位置：C05/C07/C08；流程：真机承接。\u003c/p>\n\u003cp>\u003cstrong>X02-01 分享授权与保存（后续验证／未跑）\u003c/strong>\u003c/p>\n\u003cp>前置：测试入口、主体和身份核实；准备D04,D09；满足本分支所列初始条件。 数据：D04,D09；依赖：C05,P01。\u003c/p>\n\u003col>\u003cli>由用户接手指定真机\n\u003c/li>\u003cli>验证分享目标、授权身份、相册保存与微信分享\n\u003c/li>\u003cli>回传实际结果\n\u003c/li>\u003c/ol>\n\u003cp>预期：模拟器不能证明的分享、授权和相册须真机验证；不把模拟弹窗或临时图片当真实完成\u003c/p>\n\u003cp>回查：指定真机/跨账号操作结果。恢复：使用专用测试对象；记录原值；变更后恢复并重开核对，不能恢复的记录保留实际状态和恢复义务。\u003c/p>\n\u003cp>退出：记录具体观察值、实际业务ID及回查位置；失败记录可复现偏差；提交未知先回查，不重复写入；前置不符只暂停依赖分支。\u003c/p>\n\u003ch2>7. 执行、证据与中断恢复\u003c/h2>\n\u003cp>先审阅本方案，确认范围和样本后开始F01；不因补新轮次要求重新批准同一已授权范围。每分支少量操作及时记实际数据；一次操作可支持多处回查，不为截图重造交易。通过默认留实际值与回查位置，问题留必要截图及复现；旧原型截图不冒充本轮实测。\u003c/p>\n\u003cp>每个问题记录独立ID、规则来源、前置/步骤/预期/实际、影响与实际构建；环境或工具限制不自动当业务缺陷。产品补充的新决定记录基线变化，不将规则调整记成开发修复。\u003c/p>\n\u003cp>模拟器原生界面可进入赛事和表单，但多身份分享、真实付款、相册及微信分享等按实际可用能力分开记录，不能因为可点击就全部判通过。真实代码库仅按用户本次明确指定的scenic-wxapp范围操作；本轮已授权拉取当前分支并重新编译，不自动绑定其他项目代码库。\u003c/p>\n\u003cp>中断保留当前赛事、项目、票、原订单及待处理任务ID、实际状态和临时配置原值；先核对未知提交再续跑，不整套重做。恢复原票设置、退款截止、机型等临时变更；未完成恢复单列，不私自删业务记录。\u003c/p>\n\u003ch2>8. 执行完成与接收标准\u003c/h2>\n\u003cp>分别汇报本期执行覆盖、实际通过、当前缺陷、未跑/阻塞原因、后续真机验证、测试对象与配置恢复。前置通过不自动通过下游；报告脚本检查不等于业务通过；产品是否接收单独决定，不自动发布。\u003c/p>\n\u003cp>当前结论：业务验收已执行并持续回归，最新状态以报告台账为准。仍有当前问题、未完整执行与依赖样本的分支，不代表全流程验收通过。\u003c/p>\n\u003ch2>资源准备进展（2026-11-17）\u003c/h2>\n\u003cp>用户授权先配置全域资源，暂停报名交易。已保存15张云程专用测试票，统一待上架，临时关联雨林拓展；程程票务对应产品及最终映射待操作说明补齐。详见\u003ca href=\"测试票资源清单.md\">测试票资源清单\u003c/a>。资源保存不改变未跑业务分支状态。\u003c/p>\n\u003ch2>2026-11-18 夜间执行更新\u003c/h2>\n\u003cp>最新结果及恢复义务见 \u003ca href=\"执行记录-20261118.md\">执行记录\u003c/a> 与 \u003ca href=\"index.html\">验收报告\u003c/a>。原方案是计划，不能视为全部已测。赛事24六项目、记录65/66/67/68/69/71保留；原票132948已恢复上架；收费67仍未出单，未发短信。原生窗口已恢复，模拟器390宽已恢复。11/18新版回归已补公开姓名查询和1366/1920实际布局；项目33名额从4增至6用于验证只增不减，最终赛事成功13/54。未恢复为4，以免违背业务规则。\u003c/p>"}</script><script>'use strict';
const S=JSON.parse(document.getElementById('report-data').textContent);
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=x=>Array.isArray(x)?x.map(text).join('\n'):x&&typeof x==='object'?Object.entries(x).map(([k,v])=>`${k}：${text(v)}`).join('\n'):String(x??'');
const safe=p=>/^(?:javascript|data|vbscript|file):/i.test(String(p??''))?'':String(p??'');
const link=(p,label)=>safe(p)?`<a href="${esc(safe(p))}">${esc(label||p)}</a>`:esc(label||'未关联');
const empty=message=>`<div class="card muted">${esc(message)}</div>`;
const sc=v=>v.scope||'本期必测';
const activeIssues=S.issues.filter(i=>i.status!=='误判撤销');
const currentIssues=activeIssues.filter(i=>['当前缺陷','待复测'].includes(i.status));
function parent(c){const vs=c.variants.filter(v=>sc(v)==='本期必测');if(!vs.length)return c.variants.some(v=>sc(v)==='后续验证')?'后续验证':c.variants.some(v=>sc(v)==='本轮不执行')?'本轮不执行':'不适用';for(const st of ['有问题','阻塞','未跑'])if(vs.some(v=>v.status===st))return st;return '通过';}
const field=(name,value)=>value!==undefined&&value!==null&&text(value)!==''?`<div class="field"><b>${esc(name)}</b><div>${esc(text(value))}</div></div>`:'';
const fields=rows=>`<div class="detail-grid">${rows.map(([k,v])=>field(k,v)).join('')}</div>`;
function evidence(items=[]){return `<div class="evidence-links">${items.map(e=>{const p=typeof e==='string'?e:e.path;const label=typeof e==='string'?p.split('/').pop():e.label||p.split('/').pop();return /\.(?:png|jpe?g|webp|gif)(?:[?#].*)?$/i.test(p)?`<a class="evidence-link" href="${esc(safe(p))}" data-image="${esc(safe(p))}">${esc(label)}</a>`:link(p,label);}).join(' · ')}</div>`;}
function options(id,label,values){$(id).innerHTML=`<option value="">${esc(label)}</option>`+[...new Set(values.filter(Boolean))].map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');}
function table(headers,rows){return `<div class="card table-scroll"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function caseLink(id){return `<a href="#case-${esc(id)}" data-case="${esc(id)}">${esc(id)}</a>`;}
function runDetail(r){return `<details class="run"><summary>${esc(r.runId)} · ${esc(r.executedAt||'')} ${badge(r.originalResult||r.result)}</summary>${fields([['前置',r.preconditions],['步骤',r.steps],['预期',r.expected],['实际',r.actual],['业务编号',r.businessIds||r.businessId],['验证位置',r.verification],['版本',r.build],['身份 / 设备',[r.actor,r.device].filter(Boolean)],['关联问题',r.issueIds],['原记录',r.documents]])}${evidence(r.evidence)}</details>`;}

const badge=st=>`<span class="chip ${st==='通过'||st==='已验证修复'?'status-pass':['有问题','当前缺陷','待复测'].includes(st)?'status-fail':''}">${esc(st)}</span>`;
$('side-title').textContent=`${S.project.name} · ${S.project.version||''}`;
$('side-subtitle').textContent='验收方案'+(S.project.planDate?' · '+S.project.planDate:'');
$('eyebrow').textContent=`${S.project.version||'PC WEB'} · QA ACCEPTANCE PLAN`;
$('title').textContent=`${S.project.name}｜验收方案与执行总览`;
$('summary').textContent=S.project.summary||'先确认执行方案，再用测试环境新数据验证完整业务链路。';
$('scheme-back').innerHTML=S.project.schemeEntry?link(S.project.schemeEntry,'← 返回需求方案'):'<span class="sub">正式方案入口待关联</span>';
$('case-nav').textContent=S.cases.length+'条基线与执行分支';
const st=S._stats,n=st.results;
const statuses=['通过','有问题','未跑','阻塞','后续验证','本轮不执行',...(S.cases.some(c=>parent(c)==='不适用')?['不适用']:[])];
$('metrics').innerHTML=statuses.map(s=>`<div class="metric"><strong>${S.cases.filter(c=>parent(c)===s).length}</strong><span>${esc(s)} · 基线项</span></div>`).join('');
$('phase').textContent=S.phase||S.project.phase||(S.runs.length?'本页按执行台账汇总':'方案待确认，未执行QA');
$('notice').textContent=S.runs.length?'本页按执行台账汇总；测试结论以对应版本、单据和证据为准。':'尚未执行测试环境验证。通过0、有问题0不代表系统无缺陷；此前原型验证不计入本轮。';
$('business-body').innerHTML=`<p>${esc(S.phase||S.project.decision||'以当前确认基线与各轮实际记录为准')}。</p><p>执行分支：通过 ${n['通过']||0}，有问题 ${n['有问题']||0}，未跑 ${n['未跑']||0}，阻塞 ${n['阻塞']||0}；后续验证 ${st.scope['后续验证']||0}，本轮不执行 ${st.scope['本轮不执行']||0}，不适用 ${st.scope['不适用']||0}，均不计通过。</p><p>当前问题 ${currentIssues.length} 项 · 已验证修复 ${st.issues['已验证修复']||0} 项 · 方案调整后关闭 ${st.issues['方案调整后关闭']||0} 项。</p>${S.project.reportNote?`<p class="muted">${esc(S.project.reportNote)}</p>`:''}`;
$('total').textContent='执行分支：'+statuses.map(s=>s+' '+S.cases.flatMap(c=>c.variants).filter(v=>(sc(v)==='本期必测'?v.status:sc(v))===s).length).join(' / ')+`。${S.cases.length}条基线 / ${st.variants}个执行分支；每个分支保留独立记录。`;
const modules=[...new Set(S.cases.map(c=>c.module))];
$('module-grid').innerHTML=modules.map(m=>{const cs=S.cases.filter(c=>c.module===m);return `<button class="module-card" type="button" data-module="${esc(m)}"><span>${esc(m)}</span><strong>${cs.length} 条基线</strong><small>${cs.reduce((s,c)=>s+c.variants.length,0)} 个执行分支 · ${cs.filter(c=>parent(c)==='通过').length} 条通过</small></button>`;}).join('')||empty('尚未建立模块覆盖');
options('module','全部模块',modules);
options('case-status','全部状态',['通过','有问题','未跑','阻塞','后续验证','本轮不执行','不适用']);
function variantPlan(v){const rows=[['前置',v.preconditions],['数据组',v.dataIds],['计划样本标记（非真实单号）',v.sampleKey],['依赖',v.dependencies],['步骤',v.steps],['具体预期',v.expected],['回查位置',v.verification],['协议',v.protocolId],['必查点位',v.checkpoints],['恢复',v.restoration],['退出条件',v.exitCriteria]];if(!rows.some(([,value])=>text(value))&&!v.ruleRefs?.length)return '';return `<details class="run planned-design"><summary>查看本分支执行设计（非执行结果）</summary>${fields(rows)}${v.ruleRefs?.length?`<p>需求依据：${v.ruleRefs.map(r=>link(r.path,r.label)).join(' · ')}</p>`:''}</details>`;}
function renderCases(){const q=$('search').value.trim().toLowerCase(),m=$('module').value,status=$('case-status').value;const cs=S.cases.filter(c=>(!q||JSON.stringify(c).toLowerCase().includes(q))&&(!m||c.module===m)&&(!status||parent(c)===status));$('filter-count').textContent=`显示 ${cs.length} / ${S.cases.length} 条`;$('case-list').innerHTML=cs.map(c=>`<details class="case" id="case-${esc(c.id)}"><summary><span class="case-id">${esc(c.id)}</span><span class="label">${esc(c.action)}</span>${badge(parent(c))}</summary><div class="case-body"><p class="muted">${esc([c.module,text(c.pages),text(c.flow)].filter(Boolean).join(' · '))}</p><p><strong>预期：</strong>${esc(c.expected)}</p><p><strong>执行：</strong>${esc(c.execution||'记录前置配置 → 按下列分支逐项操作 → 在适用位置回查 → 保存实际值、业务编号和必要问题证据。')}</p><ul>${c.variants.map(v=>`<li id="variant-${esc(v.id)}"><strong>${esc(v.id)}</strong> ${esc(v.label)} ${badge(sc(v)==='本期必测'?v.status:sc(v))}${v.reason?`<p>${esc(v.reason)}</p>`:''}${variantPlan(v)}${v.runs?.length?`<div class="run">${v.runs.map(r=>`<p><strong>${esc(r.runId)} · ${esc(r.executedAt||'')}</strong></p><p><strong>实际结果：</strong>${esc(r.actual)}</p><p><strong>测试单据：</strong>${esc(text(r.businessIds||r.businessId||r.documents)||'见执行记录')}</p>${(r.preconditions||r.steps||r.verification)?`<details><summary>查看前置、操作与验证记录</summary>${fields([['前置',r.preconditions],['操作',r.steps],['验证位置',r.verification],['预期',r.expected],['结果',r.originalResult||r.result],['关联问题',r.issueIds]])}</details>`:''}<p>${evidence(r.evidence)}</p>`).join('')}</div>`:''}</li>`).join('')}</ul></div></details>`).join('');$('case-empty').hidden=cs.length!==0;document.querySelectorAll('[data-module]').forEach(b=>b.classList.toggle('active',b.dataset.module===m));}
options('issue-severity','全部等级',activeIssues.map(i=>i.severity).sort());
options('issue-module','全部模块',activeIssues.map(i=>i.module||i.category));
options('issue-type','全部类型',activeIssues.map(i=>i.type));
options('issue-status','全部问题状态',activeIssues.map(i=>i.status));
function issueField(label,value){return `<li><strong>${esc(label)}：</strong>${esc(text(value)||'—')}</li>`;}
function renderIssues(){const q=$('issue-search').value.toLowerCase(),sev=$('issue-severity').value,m=$('issue-module').value,t=$('issue-type').value,status=$('issue-status').value;const rows=activeIssues.filter(i=>(!q||JSON.stringify(i).toLowerCase().includes(q))&&(!sev||i.severity===sev)&&(!m||(i.module||i.category)===m)&&(!t||i.type===t)&&(!status||i.status===status));$('issue-count').textContent=`显示 ${rows.length} / ${activeIssues.length} 项`;$('issue-list').innerHTML=rows.map(i=>`<details class="issue-card" id="issue-${esc(i.id)}" data-severity="${esc(i.severity)}"><summary><span class="issue-id">${esc(i.id)}</span><span class="issue-title">${esc(i.title)}</span><span class="issue-tags">${badge(i.module||i.category)} ${badge(i.type)} <span class="chip severity ${esc(i.severity.toLowerCase())}">${esc(i.severity)}</span> ${badge(i.status)}</span><span class="chevron" aria-hidden="true">⌄</span></summary><div class="issue-body markdown-body"><ul>${issueField('所属流程',i.flow)}${issueField('QA入口',i.entry)}${issueField(i.status==='已验证修复'?'原缺陷表现（历史）':'QA实际',i.actual)}${issueField(i.status==='方案调整后关闭'?'原测试预期（历史）':'方案/原型预期',i.expected)}${issueField('确认后的处理',i.resolution||i.scopeResolution)}${issueField('影响',i.impact)}${issueField('状态',i.retest)}</ul>${i.preconditions?`<p><strong>前置：</strong>${esc(text(i.preconditions))}</p>`:''}<div class="repro"><strong>复现步骤</strong><ol>${(Array.isArray(i.steps)?i.steps:[i.steps]).filter(Boolean).map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div><p class="evidence-links"><strong>证据：</strong>${evidence(i.evidence)}</p><p class="muted"><strong>测试恢复：</strong>${esc(i.restoration||'—')}</p>${i.cases?.length?`<p>关联：${i.cases.map(id=>{const c=S.cases.find(c=>c.id===id||c.variants.some(v=>v.id===id));return c?caseLink(c.id)+' '+esc(id):esc(id);}).join(' · ')}</p>`:''}</div></details>`).join('')||empty(activeIssues.length?'当前筛选无匹配问题。':S.runs.length?'尚无已复现问题；不等于系统无缺陷。':'尚未执行，暂未登记问题');}
// Supplemental structured data stays inside the execution plan, never a replacement main navigation.
$('plan-supplements').innerHTML=[['coverage','覆盖映射','coverage-body',S.coverage?.length],['scenarios','场景与测试数据','scenario-body',S.scenarios?.length||S.data?.length],['pages','页面与视口专项记录','page-list',S.pages?.length],['runs','轮次记录','run-list',S.runs?.length],['changes','规则变更记录','change-list',S.changes?.length],['blockers','环境与阻塞记录','blocker-list',S.blockers?.length],['sources','资料与环境登记','document-list',true]].filter(x=>x[3]).map(([id,title,body])=>`<details class="supplement" id="${id}"><summary>${esc(title)}</summary><div id="${body}"></div></details>`).join('');
for(const id of ['coverage-body','scenario-body','page-list','run-list','change-list','blocker-list'])if(!$(id)){const el=document.createElement('div');el.id=id;el.hidden=true;$('plan-supplements').append(el);}
$('coverage-body').innerHTML=S.coverage?.length?table(['编号 / 规则与流程','页面 / 场景','关联用例'],S.coverage.map(c=>[esc(`${c.id} ${c.name}\n${text(c.flow)}`),esc(`${text(c.pages)}\n${text(c.scenario)}`),(c.caseIds||[]).map(caseLink).join(' · ')])):empty('尚未建立覆盖地图');
const scenarios=S.scenarios||[],data=S.data||[];
$('scenario-body').innerHTML=scenarios.map(c=>`<details class="case"><summary>${esc(c.id)} ${esc(c.name)}</summary><div class="case-body">${fields([['前置',c.preconditions],['完整操作顺序',c.steps],['预期',c.expected]])}<p>${(c.caseIds||[]).map(caseLink).join(' · ')}</p></div></details>`).join('')+(data.length?table(['数据','业务编号 / 用途','状态 / 恢复'],data.map(d=>[esc(`${d.id} ${d.name||''}`),esc(`${text(d.businessId)}\n${text(d.usage)}`),esc(`${text(d.status)}\n${text(d.restoration)}`)])):'');

$('page-list').innerHTML=S.pages?.length?S.pages.map(p=>`<details class="case"><summary>${esc(p.id)} ${esc(p.name)} ${badge(p.scope==='后续验证'?'后续验证':p.status||'未核对')}</summary><div class="case-body">${fields([['入口',p.entry],['当前页面状态',p.status]])}${p.prototype?link(p.prototype,'打开确认原型'):''}${(p.checks||[]).map(c=>`<div class="run">${fields([['轮次',c.runId],['实际视口',c.viewport],['结果',c.result],['实际观察',c.actual]])}${evidence(c.evidence)}</div>`).join('')||'<p class="muted">未登记逐页/视口核对记录，不由业务通过自动推导。</p>'}</div></details>`).join(''):empty('尚未登记适用页面专项');
$('plan-text').innerHTML=S._planHtml||'<p>尚未建立验收方案</p>';
$('run-list').innerHTML=S.runs.map(r=>`<details class="case"><summary>${esc(r.runId)} · ${esc(r.executedAt||'')} ${esc(r.summary||'')}</summary><div class="case-body">${fields([['版本',r.build],['身份',r.actor],['设备',r.device],['本轮摘要',r.summary],['恢复与保留',r.restoration]])}${r.record?link(r.record,'原始执行记录'):''}${evidence(r.evidence)}</div></details>`).join('')||empty('尚未执行，无历史轮次');
$('change-list').innerHTML=(S.changes||[]).map(c=>`<details class="case"><summary>规则变化 · ${esc(c.date||'')}</summary><div class="case-body">${fields(Object.entries(c))}</div></details>`).join('');
$('blocker-list').innerHTML=(S.blockers||[]).map(b=>`<details class="case"><summary>${esc(b.id)} ${esc(b.title)} ${badge(b.status||'历史记录，见当前分支')}</summary><div class="case-body">${fields([['实际',b.actual],['影响',b.impact],['继续条件 / 恢复',b.recovery],['关联',b.caseIds||b.case]])}${evidence(b.evidence)}</div></details>`).join('')||empty('当前未登记环境阻塞；不代表所有用例均已执行');
const docs=[{label:'用例与缺陷台账',path:'QA测试用例与缺陷台账.md'},{label:'结果与问题清单',path:'QA测试结果与问题清单.md'},{label:'任务索引',path:'任务索引.md'},{label:'统一执行数据',path:'qa-state.json'},...(S.documents||[])];
$('document-list').innerHTML=docs.map(d=>`<p>${link(d.path,d.label)}</p>`).join('');
$('document-list').insertAdjacentHTML('beforeend',fields([['环境',S.environment],['方案状态',S.plan?.status],['菜单验证',S.menuIntegration?.verified?'已登记双向实测':'尚未登记双向实测'],['资料提醒',S._warnings]]));
const headings=[...$('plan-text').querySelectorAll('h2')];headings.forEach((h,i)=>h.id='plan-'+(i+1));
$('plan-nav').innerHTML=headings.length?headings.map(h=>link('#'+h.id,h.textContent)).join(''):link('#plan','验收执行方案');
$('plan-button').href=headings.length?'#'+headings[0].id:'#plan';
const executionDocs=S.reportNavigation?.execution||[...S.runs].reverse().filter(r=>r.record).map(r=>({label:r.runId+(r.navLabel?' '+r.navLabel:''),path:r.record}));
$('execution-nav').innerHTML=executionDocs.length?executionDocs.map(d=>link(d.path,d.label+' ↗')).join(''):'<div class="sub">尚无执行记录</div>';
const sourceDocs=S.reportNavigation?.sources||[{label:'验收方案 Markdown',path:S.plan?.file},...docs.filter(d=>!S.documents?.some(x=>x.path===d.path)||d.path===S.plan?.file)].filter(d=>d.path);
$('source-nav').innerHTML=sourceDocs.map(d=>link(d.path,d.label+' ↗')).join('');
$('footer').textContent=S.project.footer||'正式源目录 · 测试与验收 · 未自动上传';

for(const id of ['search','module','case-status'])$(id).addEventListener(id==='search'?'input':'change',renderCases);
for(const id of ['issue-search','issue-severity','issue-module','issue-type','issue-status'])$(id).addEventListener(id==='issue-search'?'input':'change',renderIssues);
$('reset').onclick=()=>{for(const id of ['search','module','case-status'])$(id).value='';renderCases();};
$('issue-reset').onclick=()=>{for(const id of ['issue-search','issue-severity','issue-module','issue-type','issue-status'])$(id).value='';renderIssues();};
document.addEventListener('click',e=>{const module=e.target.closest('[data-module]');if(module){$('module').value=module.dataset.module;renderCases();$('cases').scrollIntoView();}const a=e.target.closest('[data-case]');if(a){e.preventDefault();$('reset').click();const el=$('case-'+a.dataset.case);if(el){el.open=true;el.scrollIntoView();history.replaceState(null,'','#'+el.id);}}const img=e.target.closest('[data-image]');if(img){e.preventDefault();$('evidence-image').src=img.dataset.image;$('evidence-title').textContent=img.textContent;$('evidence-image').style.maxWidth='100%';$('evidence-dialog').showModal();}});
$('close-evidence').onclick=()=>$('evidence-dialog').close();
$('image-size').onclick=()=>{$('evidence-image').style.maxWidth=$('evidence-image').style.maxWidth==='none'?'100%':'none';};
$('print').onclick=()=>{const details=[...document.querySelectorAll('details')],old=details.map(d=>d.open);details.forEach(d=>d.open=true);window.addEventListener('afterprint',()=>details.forEach((d,i)=>d.open=old[i]),{once:true});window.print();};
renderCases();renderIssues();
if(location.hash.startsWith('#case-')){const el=$(decodeURIComponent(location.hash.slice(1)));if(el){el.open=true;el.scrollIntoView();}}
</script></body></html>
