<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1410" viewBox="0 0 1840 1410"><title>V3.2上线前增补页面流程图</title><desc>独立新图，页面编号对应页面清单，原历史流程图不覆盖。分五条业务流程和统一结果查看区。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#728099" stroke-width="1.6"/></marker></defs><style>text{font-family:PingFang SC,Microsoft YaHei,Arial,sans-serif;fill:#243149}.title{font-size:32px;font-weight:700}.rowTitle{font-size:23px;font-weight:700}.id{font-size:19px;font-weight:700;fill:#245ccc}.name{font-size:18px}.note{font-size:17px;fill:#58677c}.edge{stroke:#728099;stroke-width:2;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 5}</style><rect width="1840" height="1410" fill="#f4f6fb"/><text x="42" y="55" class="title">V3.2 上线前增补 · 页面流程串联</text><text x="42" y="88" class="note">2026-10-28　独立新图｜W窗口 · B后台 · R原页复用 · K系统事务（不是页面）｜单笔整笔使用；批量排队逐笔校验、独立提交</text><rect x="30" y="118" width="1780" height="184" rx="13" fill="#fff" stroke="#dde3ed"/><text x="50" y="150" class="rowTitle">01  后台创建唯一待认领客户</text><rect x="50" y="170" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="64" y="196" class="id">B01</text><text x="64" y="225" class="name">合作伙伴管理</text><path d="M315 208 H335" class="edge"/><rect x="338" y="170" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="352" y="196" class="id">B02</text><text x="352" y="225" class="name">新增唯一待认领客户</text><path d="M603 208 H623" class="edge"/><rect x="626" y="170" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="640" y="196" class="id">B03 / B04</text><text x="640" y="225" class="name">查看及预付款账户</text><path d="M891 208 H911" class="edge"/><rect x="914" y="170" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="928" y="196" class="id">W01</text><text x="928" y="225" class="name">窗口充值列表可见</text><text x="50" y="280" class="note">后台仅创建和查询；入款与使用在售票窗口，不进入售票客户选择</text><rect x="30" y="314" width="1780" height="184" rx="13" fill="#fff" stroke="#dde3ed"/><text x="50" y="346" class="rowTitle">02  登记待认领入款</text><rect x="50" y="366" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="64" y="392" class="id">W01</text><text x="64" y="421" class="name">待认领客户行内充值</text><path d="M315 404 H335" class="edge"/><rect x="338" y="366" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="352" y="392" class="id">W03</text><text x="352" y="421" class="name">待认领充值弹窗</text><path d="M603 404 H623" class="edge"/><rect x="626" y="366" width="264" height="75" rx="9" fill="#e9f7ef" stroke="#7ab594"/><text x="640" y="392" class="id">K 入款事务</text><text x="640" y="421" class="name">账户增加／原充值记录</text><path d="M891 404 H911" class="edge"/><rect x="914" y="366" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="928" y="392" class="id">W12 / W13</text><text x="928" y="421" class="name">记录与详情</text><path d="M1179 404 H1199" class="edge"/><rect x="1202" y="366" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="1216" y="392" class="id">W16</text><text x="1216" y="421" class="name">按支付日期入收款报表</text><text x="50" y="476" class="note">支付日期默认当天、允许过去；扫码柜台／银行卡POS必填；禁止其他收入</text><rect x="30" y="510" width="1780" height="184" rx="13" fill="#fff" stroke="#dde3ed"/><text x="50" y="542" class="rowTitle">03  长期伙伴使用待认领款</text><rect x="50" y="562" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="64" y="588" class="id">W00 / W01</text><text x="64" y="617" class="name">长期伙伴充值入口</text><path d="M315 600 H335" class="edge"/><rect x="338" y="562" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="352" y="588" class="id">W02</text><text x="352" y="617" class="name">选择待认领账户付款</text><path d="M603 600 H623" class="edge"/><rect x="626" y="562" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="640" y="588" class="id">W04</text><text x="640" y="617" class="name">查询及勾选来源记录</text><path d="M891 600 H911" class="edge"/><rect x="914" y="562" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="928" y="588" class="id">W02</text><text x="928" y="617" class="name">返回确认金额分配</text><path d="M1179 600 H1199" class="edge"/><rect x="1202" y="562" width="264" height="75" rx="9" fill="#e9f7ef" stroke="#7ab594"/><text x="1216" y="588" class="id">K 使用事务</text><text x="1216" y="617" class="name">逐笔负数＋目标正数</text><path d="M1467 600 H1487" class="edge"/><rect x="1490" y="562" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="1504" y="588" class="id">W12 / W13</text><text x="1504" y="617" class="name">来源及目标关联查看</text><text x="50" y="672" class="note">普通现金等付款跳过W04；待认领分支整笔单笔整笔；批量逐笔独立结算</text><rect x="30" y="706" width="1780" height="184" rx="13" fill="#fff" stroke="#dde3ed"/><text x="50" y="738" class="rowTitle">04  公共临时客户订单回款</text><rect x="50" y="758" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="64" y="784" class="id">W05 待回款</text><text x="64" y="813" class="name">按客户／订单／售票员查</text><path d="M315 796 H335" class="edge"/><rect x="338" y="758" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="352" y="784" class="id">W06</text><text x="352" y="813" class="name">勾选订单后回款</text><path d="M603 796 H623" class="edge"/><rect x="626" y="758" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="640" y="784" class="id">普通付款或W04</text><text x="640" y="813" class="name">选择方式／待认领来源</text><path d="M891 796 H911" class="edge"/><rect x="914" y="758" width="264" height="75" rx="9" fill="#e9f7ef" stroke="#7ab594"/><text x="928" y="784" class="id">K 回款事务</text><text x="928" y="813" class="name">账户及订单一起更新</text><path d="M1179 796 H1199" class="edge"/><rect x="1202" y="758" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="1216" y="784" class="id">W05 已回款</text><text x="1216" y="813" class="name">逐订单查看结清结果</text><path d="M1467 796 H1487" class="edge"/><rect x="1490" y="758" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="1504" y="784" class="id">R01 / W13</text><text x="1504" y="813" class="name">原订单及充值详情</text><text x="50" y="868" class="note">W07：多订单信息不一致可确认继续；待认领款不足拦截，超出明确计入其他收入</text><rect x="30" y="902" width="1780" height="184" rx="13" fill="#fff" stroke="#dde3ed"/><text x="50" y="934" class="rowTitle">05  公共临时客户转长期</text><rect x="50" y="954" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="64" y="980" class="id">W05 待回款</text><text x="64" y="1009" class="name">勾选订单／转长期</text><path d="M315 992 H335" class="edge"/><rect x="338" y="954" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="352" y="980" class="id">W08 / W07</text><text x="352" y="1009" class="name">确认待迁移订单</text><path d="M603 992 H623" class="edge"/><rect x="626" y="954" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="640" y="980" class="id">W09</text><text x="640" y="1009" class="name">目标伙伴步骤</text><path d="M891 992 H911" class="edge"/><rect x="914" y="954" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="928" y="980" class="id">W10 或 W11</text><text x="928" y="1009" class="name">新建或选择已有伙伴</text><path d="M1179 992 H1199" class="edge"/><rect x="1202" y="954" width="264" height="75" rx="9" fill="#e9f7ef" stroke="#7ab594"/><text x="1216" y="980" class="id">K 迁移事务</text><text x="1216" y="1009" class="name">原流水保留／目标重建</text><path d="M1467 992 H1487" class="edge"/><rect x="1490" y="954" width="264" height="75" rx="9" fill="#edf3ff" stroke="#a9c2ed"/><text x="1504" y="980" class="id">R01 / W13</text><text x="1504" y="1009" class="name">变更结果及迁移详情</text><text x="50" y="1064" class="note">未回款订单可迁移；W07不一致确认沿用；生成调账-往来，但不进W16收款报表</text><rect x="30" y="1110" width="1780" height="257" rx="13" fill="#fff" stroke="#dde3ed"/><text x="50" y="1143" class="rowTitle">共同结果与报表联动：不是再次收款，也不复制订单数据</text><rect x="50" y="1162" width="406" height="76" rx="9" fill="#f2f0ff" stroke="#b7afd9"/><text x="63" y="1190" class="id">W12 / W13 · B05 / B08</text><text x="63" y="1218" class="name">充值记录及关联详情</text><rect x="480" y="1162" width="406" height="76" rx="9" fill="#f2f0ff" stroke="#b7afd9"/><text x="493" y="1190" class="id">W14 / W15 · B09 / B10</text><text x="493" y="1218" class="name">其他收入（金额大于0时）</text><rect x="910" y="1162" width="406" height="76" rx="9" fill="#f2f0ff" stroke="#b7afd9"/><text x="923" y="1190" class="id">B11</text><text x="923" y="1218" class="name">资金流水及导出</text><rect x="1340" y="1162" width="406" height="76" rx="9" fill="#f2f0ff" stroke="#b7afd9"/><text x="1353" y="1190" class="id">W16</text><text x="1353" y="1218" class="name">窗口收款正负净额</text><path d="M916 1239 V1258" class="edge dash"/><rect x="50" y="1261" width="1696" height="77" rx="9" fill="#fff5df" stroke="#d7ad5c"/><text x="70" y="1289" class="id">B12　后台 → 报表中心 → 合作伙伴对帐单 → 按日／按月</text><text x="70" y="1319" class="name">已接入原后台；待认领消费列改为认领转出，按支付日期统计，不重复计底部调账</text><text x="40" y="1394" class="note">B06/B07为后台禁止待认领充值／导入的校验分支；B01/B03为资料权限。完整清单含全部页面、弹窗、步骤与原页回归。</text></svg>
