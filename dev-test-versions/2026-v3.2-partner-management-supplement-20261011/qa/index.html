x |\n| 凭据与身份 | 用户指定本地账号小节已定位；分别核验管理员、收银甲乙、实际景区、角色权限与窗口设备，不把账号名或密码复制进报告。 |\n| 浏览器 | Chrome专用测试会话和明确绑定标签；核对最终实际HTTP协议主机，不跟随用户前台点击。切换身份前确保不会退出用户日常会话。 |\n| 版本与源稿 | 首轮记录页面可见构建号/发布时间；不可见明确写未知，保存基线SHA-256；中途发版新建轮次，仅复验受影响范围。 |\n| 配置与资源 | 先记录景区方式启用/场景/排序/归属，以及专属账号和设备绑定、资源ID/名称/编号/默认；仅正常UI切换，不绕保护构造非法数据。 |\n| 数据条件 | 确认商品、临客挂帐、正常退款、目标建档和导入权限；交易通道是否测试模拟先核实，实际收款/退款最终动作遵从当次授权和工具约束。 |\n| 不足与继续条件 | 仅阻塞真正受影响分支；配置保护不允许的状态记录保护结果及不适用依据，不为制造非法前置而关闭保护。唯一待认领已存在不删除重建，创建分支记录环境限制及后续条件。 |\n\nR10已通过实际HTTP页面核验后台西瓜、YST售票窗口/YST团队售票窗口和0.01测试商品；正常退款、回款及迁移入口可用。部署版本页面未显示，明确记为未知；不将可登录推导为全部权限或全部业务通过。\n\n## 3. 执行阶段、依赖与必须留存的结果\n\n| 阶段 | 操作和先决依赖 | 本阶段必须留存 |\n| --- | --- | --- |\n| R0 准入 | 核对身份、景区、版本、权限、设备、商品和支付测试属性；记录原配置 | 环境记录、可见版本/未知说明、原配置及恢复清单；不计交易通过 |\n| R1 档案与基础数据 | 先FL01，再准备普通临客/迁移订单及待认领账户 | 真实档案/账户号和原余额；各样本用途、订单总额/退款/净额 |\n| R2 入款及组件 | FL02创建来源，FL03按入口和主体模式分支；切换全景区归属须顺序完成恢复 | 原/新配置与加载时点、候选全集、来源单号、支付日/完成时刻、实际资源及编号 |\n| R3 分配与回款 | 来源先成功未用；FL04及FL05各用途独立来源/订单 | 源负数/目标正数/收入关联单号、逐单结清、金额等式及前后余额 |\n| R4 迁移 | FL06使用未被回款/退款消耗的独立迁移样本 | 原/目标伙伴账户及订单归属、消费退款迁移记录、无新增实收 |\n| R5 关联与报表 | FL07/08复用已完成真实业务号，不重复造交易 | 前后台同号、导出内容、分组小计总计及日月统计、快照变更前后 |\n| R6 保护与回归 | FL09按正常顺序改状态；问题修复后沿原ID补轮次 | 具体失败/正常拒绝表现、影响分支、修复版本、实际回查、配置恢复结果 |\n\n上表R0—R6是计划阶段，不是已经执行的轮次。实际执行轮次按当日记录新建，不预填通过。\n\n父项依赖是准备顺序，不代表“整个上游父项全通过才能查任何下游”；执行时以本分支所需成功数据和配置为准。前置提交结果未知，先回查单号及状态，不反复提交。互斥的回款/迁移/退款、不同成功分配必须分开样本，查账和跨端核对复用同单。\n\n## 4. 全流程覆盖矩阵\n\n| 流程 | 前置和数据依赖 | 实际操作顺序 | 独立判断/分支 | 回查协议 / 用例 |\n| --- | --- | --- | --- | --- |\n| FL01 唯一档案与售票最小关联 | 管理员、甲乙身份已核验；D-01/D-04 | 建唯一预付款→窗口可见→售票排除待认领→充值两入口及账户锁定 | 未创建/已创建；唯一保护、隐藏草稿、售票候选和账户不可替换 | P-READ；PM-001,PM-002,PM-028 |\n| FL02 窗口待认领入款 | FL01可用账户；D-02/D-05 | 只读账户→金额日期负责人→付款→成功/取消→余额正流水 | 选填/搜索；0/负数/小数精度；本日/补录；成功未使用 | P-IN；PM-003,PM-007 |\n| FL03 支付组件与日期 | 身份、专用资源及归属可恢复；回款表单先备临客订单 | 两入口长期充值、待认领入款、临客回款→普通支付→动态字段→保存快照 | 入口×五方式；账号/设备×扫码/POS×固定/多资源；默认/搜索/只读/失效；不制造故障 | P-PAY；PM-004,PM-005,PM-006,PM-026 |\n| FL04 来源选择及长期分配 | FL02未用来源及启用长期目标；各成功用途独立来源 | 找成功未用款→查询单选→重选/取消→C/I分配→转出及目标回查 | 整笔单笔；不足/超过/负分配；C=S、C+I=S、C=0；旧来源不可复用 | P-ALLOC；PM-008,PM-009,PM-010 |\n| FL05 临客普通及来源回款 | 独立临客订单和成功退款样本；来源方式另需FL02 | 候选查询选择/先找款→净额计算→多单确认→普通或来源付款→逐单及账表 | D净额；S<D/S=D/S>D；主动差额；状态排除；跨页选择；人工确认不绕保护 | P-SETTLE；PM-011,PM-012,PM-013,PM-014,PM-015,PM-016 |\n| FL06 临客转长期 | 另备未结清迁移订单；目标双账户及不足额度场景；不复用已回款订单 | 订单确认→新建/已有目标→同一迁移结果→订单归属与流水 | 企业/个人；挂帐/预付款；额度不足仍迁移；无效目标排除；取消无写入 | P-MOVE；PM-017,PM-018 |\n| FL07 前后台记录、导入与快照 | 已取得本轮真实交易单号；导入十一列当前模板 | 列表筛选→详情互查→导出→主数据改名改码/解绑→原单再查 | 同号同笔；备注关联；1/50/51导入及拒绝；前导零和历史快照不回写 | P-RECORD；PM-019,PM-020,PM-021,PM-027 |\n| FL08 账表与跨日归属 | 本轮入款、转出、充值、收入单号及甲乙日期负责人快照齐全 | 流水→窗口分组小计/总计→后台按日/月→导出逐单核算 | 支付日与完成时刻；原支付列负数；负责人分组；小计不重复加总；跨日不重收 | P-REPORT；PM-022,PM-023,PM-024 |\n| FL09 提交业务保护及配置刷新 | 独立未用来源/未结清单；配置可恢复 | 旧表单→正常顺序状态变化→提交回查；支付配置另按刷新/重开 | 业务状态重读；支付旧弹窗按已加载配置；重开必须读取新配置；恢复后回查 | P-RECHECK；PM-025 |\n\n全部父项均有正式条款/页面锚点、流程、独立分支、数据组及回查协议。展开下方“基线用例与执行分支”可看分支前置/步骤/预期/回查/恢复；完整原生文本见[分支执行设计](分支执行设计.md)。\n\n## 5. 数据准备、互斥样本与分支组合\n\n| 组 | 最少准备与样例 | 用途 | 互斥及恢复 |\n| --- | --- | --- | --- |\n| D-01 管理员、收银甲乙与窗口设备1/2 | 角色和绑定主体分别核验，账号与设备不同绑定用于识别串主体 | 所有分支 | 记录实际角色景区窗口及原绑定，不复制凭据 |\n| D-02 每个成功使用目的独立未用来源 | 长期全充200；长期分配250=200+50；纯收入100=0+100；临客等额200；临客超额250；跨日另250 | PM-007/010/014/015/024/025 | 同一来源成功使用一次；查账复用单号，其他成功用途另建来源 |\n| D-03 临客正常/部分退款/全退/结清/迁移订单集合 | 普通D100；部分退款150−50；两单净额合计200；差异客户及负责人；分页样本数量超过实际页容量 | PM-011—018/025 | 回款、退款、迁移互斥用途分开；排序样本先记下单支付实际时刻 |\n| D-04 企业个人×默认挂帐/预付款及禁用目标 | 四类合法新建目标；不足额度且开启限制的两类目标；无效目标只用专属可恢复对象 | PM-001/002/010/017/018/028 | 不切换有余额共享账户；原新消费规则检查只用正常允许路径 |\n| D-05 扫码A/B、POS A/B及独立绑定 | 账号/设备×扫码/POS×固定/多资源；至少一文本编号含前导零；缺绑定等仅正常可构造配置 | PM-004/005/006/025/026/027 | 每次切全景区归属前记原值；账号设备组合顺序执行，结束恢复并重开回查 |\n| D-06 当前十一列模板的独立导入文件 | 1条合法、待认领拒绝、50行合法、51行整拒、重复本轮流水号；每成功行唯一标记 | PM-021 | 上传前核对真实测试对象；保留导入结果和真实单号，不使用旧原型夹具充当结果 |\n| D-07 本轮账表核对单号集合 | 原支付日入款、使用日转出、目标充值、公司收入，负责人不同以及单/多明细组 | PM-022/023/024 | 查账只读复用已完成样本；不同支付编号至少两列，未发生列0.00 |\n\n上述金额是便于核算的计划样例，按实际商品与QA计费生成合法数据；若替换金额，记录实际D/S/C/I和等式。0.01用于精度边界，不以其代替全部业务金额。\n\n每个分支给出计划样本标记QA-PM-20261111-分支ID，实际单号由执行时填写。只读查询/详情/报表复用同一成功样本；一个共享场景能同时满足多个检查时关联同单，不能以减少成本省掉实际检查。分页分支先确认页容量，再准备足够样本，不拿未知旧单判新增缺陷。\n\n| 组合 | 拆分与记录规则 |\n| --- | --- |\n| 长期充值两入口×五普通方式 | 售票页与充值列表分别现金/扫码付/银行卡/微信/支付宝；各自记录动态区与当前伙伴上下文。扫码/POS完成后的单号与快照按PM-005-05各入口独立回查。 |\n| 四入口×资源8组合 | 售票页长期充值、列表长期充值、待认领入款、临客回款分别覆盖：账号/设备×扫码/POS×固定/多资源。原资源只读、默认、搜索、切换与编号分别留结果；可复用配置，但不能推导其他入口自动通过。 |\n| 正常输入与拒绝 | 空/0/负数/精度、未来日期、分配负值/合计不等、来源不足、已用来源、订单已结清分别记录；正常拒绝是通过，不作为缺陷。 |\n| 金额和目标分支 | 普通/来源回款不足、等额、超额主动收入；长期C=S、C+I=S、C=0；迁移企业/个人×默认挂帐/预付款，以及不足额度两种默认账户分别验证。 |\n| 支付刷新与业务重校验 | 后台配置变化只在刷新主页面或重开弹窗后检查新值；来源使用/订单退款结清/业务目标有效性另行提交重校验。旧支付弹窗未实时读取不判缺陷。 |\n| 快照与跨日 | 用本轮新单变更主数据后查原单；甲昨日250，乙今日结200＋收入50，昨天+250今天200+50−250=0。来源原方式/编号/负责人保留，不取使用人当前绑定。 |\n\n组合不是要求每种状态都产生新交易：可见性、筛选、取消以只读/草稿完成；需要保存证明的分支才提交。接口并发、故障或保护禁止的配置不通过伪造状态来凑组合。\n\n## 6. 每条用例怎么跑：字段六点与结果五点\n\n先读对应正式条款与该分支前置，记录原配置/余额/状态；按真实菜单完成具体操作；按下表检查适用字段和结果；刷新跨端回查后持久化实际值、单号、身份设备和结果。父项只有所有本期必测分支通过才通过；一个有问题不能被其他通过抵消。\n\n| 字段维度 | 实际检查内容 |\n| --- | --- |\n| ①存在性 | 本次定义的字段、列、按钮、关联链接齐全；不新增无关菜单/来源列。 |\n| ②容器和顺序 | 沿确认原型的列表/弹窗/原详情容器；标签、查询优先顺序、整行备注资料、金额单行表头和底部操作位置正确。 |\n| ③显示条件 | 待认领特殊字段隐藏；普通/来源、现金/资源、固定/多资源分别切换；只读、必填、可搜索、取消和切换清旧值正确。 |\n| ④默认和格式 | 默认日期/账户/候选方式/指定默认资源；金额两位、支付日00:00:00、前导零、空值—、快照负责人及时间来源正确。 |\n| ⑤保存和回显 | 提交前值与成功后、刷新后、窗口及后台同一单逐字段核对；备注长度和资源快照保持。 |\n| ⑥正常错误/取消 | 输入非法或业务状态已变化明确提示且拦截；取消无写入、草稿按需求保持；不出现前方式残留、半笔成功或不可达按钮。 |\n\n| 结果锚点 | 何时检查 / 必须记录 |\n| --- | --- |\n| ①当前业务及反馈 | 交易记录实际金额、支付方式、资源名称编号、操作人设备、状态和业务号；提示成功本身不足以判通过。查询/跳转只核对相应反馈。 |\n| ②原列表和详情持久化 | 刷新后按真实单号再查，定位正确详情和使用状态；正常拒绝/取消核对无新增对应记录。 |\n| ③跨端同一笔 | 窗口与后台逐字段一致，记录单号、金额、负责人、支付日/完成时刻和关联；不能复制一条前端提示当跨端证据。 |\n| ④适用账户与流水 | 入款、来源分配、结清按对应协议查前后余额及正负记录；只读页面不强制产生资金流水，迁移按消费/退款/调账往来核对。 |\n| ⑤关联与账表 | 逐单订单结果、来源/转出/目标/收入链接；窗口与后台日/月报表按单号集合核算；主数据变动后原快照不回写。 |\n\n每类业务适用协议如下；不能访问的必查点记录影响及继续条件，不用其他点替代。仅页面证据明确写“UI持久化/跨端回查”，不宣称直查数据库或已证明故障事务原子性。\n\n| 协议 | 必查位置 | 具体等式/一致性 |\n| --- | --- | --- |\n| P-READ | 页面字段和操作可见性 | 查询或取消前后无档案/账户变更；正常新增后刷新列表和账户结构一致 |\n| P-IN | W03反馈→W12/W13→B05/B08→B04余额→B11正流水→W16/B12 | 入款S：源余额差+S、充值+S、正流水+S、未使用；只原支付日实收一次 |\n| P-PAY | 当前弹窗→配置来源/本次主体→完成后W13/B08及适用收入详情 | 候选资格、排序、方式、资源名称编号、前导零；只读检查不要求造单，成功交易按所属业务协议回查 |\n| P-ALLOC | W02/W04→W12/W13及W14/W15→B05/B08及B09/B10→源/目标账户→B11→W16/B12 | 来源S=C+I；源余额差−S、仅一笔负转出−S；目标差+C、收入I，C=0无零充值；原来源已用 |\n| P-SETTLE | W05/W06→R01逐单→W12/W13及W14/W15→后台同一单→B11→W16/B12 | D=Σ(总额−成功退款)；全部结清；S=D+I；来源支付另查−S及原单已用，普通支付无源转出；消费不重复 |\n| P-MOVE | W08—W11→R01→后台档案双账户→B11→W05候选→W16 | 消费/退款归属和原售票员追溯；不按新消费额度阻断；不标回款，无新充值实收，迁移调账归调账 |\n| P-RECORD | 记录列表筛选→同号详情→前后台互查→导出内容→适用账户/流水 | 单号一一对应不复制入账；方式日期身份快照一致；导出行数金额符号与筛选一致 |\n| P-REPORT | W16分组明细/小计/总计→B12日月及导出→本轮原单集合 | 小计按组、总计只加原明细一次；使用日C或D+I−S=0，原日+S；目标不含公司收入，转出原列负数 |\n| P-RECHECK | 原表单→正常状态变更→提交/重开→原单状态及适用关联记录 | 旧来源/已结清或退款变化不得重复处理；拒绝无半笔业务；支付配置按刷新重开口径，不宣称故障原子性验证 |\n\n每分支记录：ID、版本、时间、景区、实际角色设备、前置原值、操作、预期、实际、业务号、验证位置、问题及恢复。分支前置/步骤和预期在执行前即可查看，不等执行后补一段“已通过”。\n\n## 7. 页面、状态与响应式专项\n\n| 编号 / 页面 | 需核对状态 | 计划视口 |\n| --- | --- | --- |\n| W00 临时／长期合作伙伴售票页 | 正常选择伙伴、待认领排除、购物车有商品、充值返回、账户不可替换 | 1440×900 |\n| W01 合作伙伴充值列表 | 待认领唯一行/普通行、空联系人负责人、查看与充值权限 | 1440×900 |\n| W02 长期合作伙伴充值弹窗 | 普通/待认领来源、固定/多资源、现金/资源动态区、C=0/分配错误/取消 | 1440×900、1280×800、1024×768 |\n| W03 待认领客户充值弹窗 | 初始/负责人搜索/可选留空、金额精度/备注边界、现金/资源、取消 | 1440×900、1280×800、1024×768 |\n| W04 选择待认领充值记录弹窗 | 无匹配/有数据、各查询、单选重选取消、订单跨页、来源不足/足额/超额 | 1440×900、1280×800、1024×768 |\n| W05 公共临时客户回款页面 | 待/已回款、无匹配/有数据、选择前后、切条件清选择、排序分页及链接 | 1440×900、1280×800、1024×768 |\n| W06 公共临时客户回款弹窗 | 单/多订单、退款净额、普通/来源、不足/等额/超额主动确认、取消 | 1440×900、1280×800、1024×768 |\n| W07 多订单客户／负责人不一致确认 | 一致不弹；客户/负责人差异、继续/返回、改选失效 | 1440×900、1280×800、1024×768 |\n| W08 临客转长期：确认待迁移订单 | 订单净迁移、详情、差异确认、返回取消 | 1440×900、1280×800、1024×768 |\n| W09 临客转长期：目标合作伙伴步骤 | 新建/已有两种目标切换、取消 | 1440×900、1280×800、1024×768 |\n| W10 创建新目标伙伴表单 | 企业/个人、必填/去空/重复/长度、默认账户、返回取消 | 1440×900、1280×800、1024×768 |\n| W11 选择已有目标伙伴 | 启用目标/排除目标、账户实时信息、额度不足、返回取消 | 1440×900、1280×800、1024×768 |\n| W12 账户充值记录列表 | 入款/充值/转出、未用/已用、筛选排序及详情 | 1440×900 |\n| W13 账户充值记录详情 | 来源/目标/收入关联、备注有无、只读资源快照及原详情容器 | 1440×900 |\n| W14 其他收入记录列表 | 临客超额/来源分配收入、排序及无效展开移除 | 1440×900 |\n| W15 其他收入详情 | 有备注/仅关联、收入目标来源链接和布局 | 1440×900 |\n| W16 充值报表 | 单/多明细组、单/多负责人组合、动态列、负数、小计总计 | 1440×900、1280×800、1024×768 |\n| B01 合作伙伴管理列表 | 唯一类型筛选与只读操作 | 1440×900 |\n| B02 新增合作伙伴弹窗 | 待认领/普通切换、唯一保护、隐藏字段清草稿 | 1440×900 |\n| B03 合作伙伴查看／编辑表单 | 待认领特殊只读、档案负责人不回写 | 1440×900 |\n| B04 预付款管理列表与行内操作 | 预付款唯一、非负不可关闭、余额前后 | 1440×900 |\n| B05 账户充值记录列表 | 窗口同笔记录、类型操作筛选导出、申请人排序 | 1440×900 |\n| B06 新增充值弹窗／伙伴选择 | 排除待认领、长期/临客原流程正常 | 1440×900 |\n| B07 批量导入弹窗及校验 | 十一列模板、1/50/51非空、待认领拒绝、重复流水号 | 1440×900 |\n| B08 账户充值详情 | 同号充值详情及身份/来源/转出/目标关联 | 1440×900 |\n| B09 其他收入列表 | 新增收入同号同金额、排序筛选导出 | 1440×900 |\n| B10 其他收入详情 | 同号收入关联与备注整行 | 1440×900 |\n| B11 资金流水 | 六标签、调账归类、操作名、正负、完成时间倒序 | 1440×900 |\n| B12 合作伙伴对帐单 | 日/月、待认领消费列替换、目标不含收入、导出 | 1440×900 |\n| R01 现有订单详情，由订单号打开 | 结清/迁移前后、原售票员及关联追溯；读取原销售/退票结果 | 1440×900 |\n\n上述是计划尺寸，不是已测尺寸。实际记录innerWidth/innerHeight、弹窗内容滚动与按钮可达；受工具限制达不到的尺寸明确待补，不把请求尺寸当实际尺寸。1920×1080仅在动态宽表需要时追加。每页业务和样式状态独立，不由一条交易通过自动判30页通过。\n\n## 8. 问题池、最少证据、复测和恢复\n\n当前缺陷只收真实复现；功能逻辑与样式同池，问题数量与失败分支分开。同根因跨入口关联一次问题，修一入口只回归其实际关联分支，不能批量判其余组合通过。环境不可用单列阻塞；正常校验拒绝是通过。\n\n默认P0为核心阻断/重大错账数据风险，P1功能偏差，P2样式；按实际影响调整，不照抄支付旧缺陷等级。问题必须有入口、前置、步骤、预期、实际、影响、相关分支、单号和必要证据；首次通过只留具体结果和单号，不强制图片。临时成功图回填后清理，缺陷保必要去重现场；不为补图重复触发付款或退款。\n\nDEV-001保留为开发协同问题：产品支付口径已确认、实现待核验，不冒记功能缺陷或修复通过。后续复现不一致另建缺陷关联DEV-001。规则调整写来源/旧新口径/影响，按方案关闭不同于修复通过，不覆盖旧轮次。\n\n每次临时配置保存前记录原值、适用主体及变更内容；结束恢复后按支付刷新/重开检查候选和绑定。业务单据保留审计，不删单/人工调账伪造恢复。中断保存实际单号、未知提交及恢复义务，续跑先查当前状态。\n\n## 9. 执行完成、验收通过与交付条件\n\n| 判定层次 | 条件 |\n| --- | --- |\n| 单分支通过 | 具体预期满足，字段六点及结果五点的适用项有实际记录，刷新后结果一致；配置已恢复或明确记录未恢复影响；不是仅成功提示。 |\n| 父项通过 | 全部本期必测分支通过；有问题优先，其后阻塞/未跑；不适用或后续不算通过。 |\n| 执行完成 | 当前台账342个必测分支均有明确结果，无未跑；实际不能准备的前置逐项说明影响及继续条件，不能把阻塞当通过。 |\n| 建议接收 | 本期必测通过，无未关闭重大资金/数据问题或关键功能缺陷；带问题接收由用户明确决定并留影响，AI不代替产品批准。 |\n| 页面与恢复 | 逐页/实际视口独立交付；未测尺寸不外推。临时配置清单和恢复回查闭合，未恢复项单列。 |\n| 交付 | 本轮实测与累计分别列，当前问题、待复测、未跑/阻塞、范围调整及DEV-001实现状态清楚；HTML/台账/原始记录同源。只本地更新，不自动上传发布。 |\n\n2026-11-11最初只完成方法设计；后续R01—R11已实际执行。当前回归按用户已确认范围继续，保留各轮记录，不以本方案文字替代真实结果，也不把执行完成当全部验收通过。\n\n## 10. 支付报告23个伙伴待验分支逐项映射\n\n原支付报告保留其历史后续验证状态。本表只在增补项目承接必要联动，新数据新执行，不复制支付通过结论。A02/A19/A20/A64仅回归候选/账户锁定，与本次共用支付和W00关联；不扩展完整售票流程。\n\n| 支付原分支 | 原检查 | 本次对应独立分支 | 范围与去重 ef=\"../development-spec.html#W06\">W06<\/a>、<a href=\"../development-spec.html#W12\">W12<\/a>、<a href=\"../development-spec.html#B05\">B05<\/a>、<a href=\"../development-spec.html#W00\">W00<\/a>、<a href=\"../development-spec.html#W01\">W01<\/a>、<a href=\"../development-spec.html#W05\">W05<\/a>、<a href=\"../development-spec.html#W13\">W13<\/a>、<a href=\"../development-spec.html#B08\">B08<\/a><\/td><td>PM-004、PM-005、PM-006、PM-026<\/td><\/tr>\n<tr><td>来源选择与长期充值<\/td><td>来源资格与筛选；重选、取消及普通支付切换；来源用于长期充值及分配；先找款再选订单<\/td><td><a href=\"../development-spec.html#W04\">W04<\/a>、<a href=\"../development-spec.html#W02\">W02<\/a>、<a href=\"../development-spec.html#W06\">W06<\/a>、<a href=\"../development-spec.html#B04\">B04<\/a>、<a href=\"../development-spec.html#B05\">B05<\/a>、<a href=\"../development-spec.html#B09\">B09<\/a>、<a href=\"../development-spec.html#B11\">B11<\/a>、<a href=\"../development-spec.html#W16\">W16<\/a>、<a href=\"../development-spec.html#B12\">B12<\/a>、<a href=\"../development-spec.html#W05\">W05<\/a><\/td><td>PM-008、PM-009、PM-010、PM-014<\/td><\/tr>\n<tr><td>临客列表与回款<\/td><td>列表入口、查询和按钮；候选金额、字段及排序；普通支付结清；待认领来源结清及回查；多订单差异二次确认<\/td><td><a href=\"../development-spec.html#W05\">W05<\/a>、<a href=\"../development-spec.html#W16\">W16<\/a>、<a href=\"../development-spec.html#B05\">B05<\/a>、<a href=\"../development-spec.html#W06\">W06<\/a>、<a href=\"../development-spec.html#W07\">W07<\/a>、<a href=\"../development-spec.html#R01\">R01<\/a>、<a href=\"../development-spec.html#B04\">B04<\/a>、<a href=\"../development-spec.html#B09\">B09<\/a>、<a href=\"../development-spec.html#B11\">B11<\/a>、<a href=\"../development-spec.html#B12\">B12<\/a>、<a href=\"../development-spec.html#W08\">W08<\/a><\/td><td>PM-011、PM-012、PM-013、PM-015、PM-016<\/td><\/tr>\n<tr><td>临客迁移<\/td><td>迁移选择与新建目标；已有目标及额度不足迁移<\/td><td><a href=\"../development-spec.html#W08\">W08<\/a>、<a href=\"../development-spec.html#W09\">W09<\/a>、<a href=\"../development-spec.html#W10\">W10<\/a>、<a href=\"../development-spec.html#W11\">W11<\/a>、<a href=\"../development-spec.html#R01\">R01<\/a>、<a href=\"../development-spec.html#B11\">B11<\/a>、<a href=\"../development-spec.html#W16\">W16<\/a><\/td><td>PM-017、PM-018<\/td><\/tr>\n<tr><td>后台与记录<\/td><td>记录列表、筛选及导出；详情互查及字段展示；后台新增和导入对象限制；资源快照稳定性与跨主体来源使用<\/td><td><a href=\"../development-spec.html#W12\">W12<\/a>、<a href=\"../development-spec.html#W14\">W14<\/a>、<a href=\"../development-spec.html#B05\">B05<\/a>、<a href=\"../development-spec.html#B09\">B09<\/a>、<a href=\"../development-spec.html#W13\">W13<\/a>、<a href=\"../development-spec.html#W15\">W15<\/a>、<a href=\"../development-spec.html#B08\">B08<\/a>、<a href=\"../development-spec.html#B10\">B10<\/a>、<a href=\"../development-spec.html#R01\">R01<\/a>、<a href=\"../development-spec.html#W05\">W05<\/a>、<a href=\"../development-spec.html#W04\">W04<\/a>、<a href=\"../development-spec.html#B11\">B11<\/a>、<a href=\"../development-spec.html#B06\">B06<\/a>、<a href=\"../development-spec.html#B07\">B07<\/a>、<a href=\"../development-spec.html#W02\">W02<\/a>、<a href=\"../development-spec.html#W03\">W03<\/a>、<a href=\"../development-spec.html#W06\">W06<\/a>、<a href=\"../development-spec.html#W16\">W16<\/a>、<a href=\"../development-spec.html#B12\">B12<\/a><\/td><td>PM-019、PM-020、PM-021、PM-027<\/td><\/tr>\n<tr><td>账表联动<\/td><td>资金流水归类与时间；分组、小计、动态支付列；跨日、跨操作人及后台对帐单<\/td><td><a href=\"../development-spec.html#B11\">B11<\/a>、<a href=\"../development-spec.html#W16\">W16<\/a>、<a href=\"../development-spec.html#B12\">B12<\/a><\/td><td>PM-022、PM-023、PM-024<\/td><\/tr>\n<tr><td>保存与重校验<\/td><td>正常顺序操作下提交重校验<\/td><td><a href=\"../development-spec.html#W00\">W00<\/a>、<a href=\"../development-spec.html#W01\">W01<\/a>、<a href=\"../development-spec.html#W02\">W02<\/a>、<a href=\"../development-spec.html#W03\">W03<\/a>、<a href=\"../development-spec.html#W04\">W04<\/a>、<a href=\"../development-spec.html#W06\">W06<\/a>、<a href=\"../development-spec.html#W08\">W08<\/a><\/td><td>PM-025<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>仅保留本期定义：单笔来源整笔使用、长期分配、临客结清与迁移及账表联动。来源部分使用、多来源合并、补差、混合付款、录错撤销、窗口人工调账不在本期；正常入口应不提供。故障注入、并发、未知历史样本、升级、生产专项不添加，不挂为待跑或阻塞。<\/p>\n<p>支付报告的23个伙伴待验分支已逐项承接，见第10节；只验证本次支付组件/入口/候选的必要联动，不据此扩大为原售票功能全量重测。原支付报告历史数据和通过结果不复制进本轮。<\/p>\n<h2>2. 基线、环境与执行准入<\/h2>\n<div class=\"table-scroll\"><table><thead><tr><th>对象<\/th><th>执行要求<\/th><\/tr><\/thead><tbody>\n<tr><td>后台 / 窗口<\/td><td>http://lvyou-ticket-2.qa.ly.com/#/login/index；http://lvyou-ticket-2.qa.ly.com/windowTicket/#/login/index<\/td><\/tr>\n<tr><td>凭据与身份<\/td><td>用户指定本地账号小节已定位；分别核验管理员、收银甲乙、实际景区、角色权限与窗口设备，不把账号名或密码复制进报告。<\/td><\/tr>\n<tr><td>浏览器<\/td><td>Chrome专用测试会话和明确绑定标签；核对最终实际HTTP协议主机，不跟随用户前台点击。切换身份前确保不会退出用户日常会话。<\/td><\/tr>\n<tr><td>版本与源稿<\/td><td>首轮记录页面可见构建号/发布时间；不可见明确写未知，保存基线SHA-256；中途发版新建轮次，仅复验受影响范围。<\/td><\/tr>\n<tr><td>配置与资源<\/td><td>先记录景区方式启用/场景/排序/归属，以及专属账号和设备绑定、资源ID/名称/编号/默认；仅正常UI切换，不绕保护构造非法数据。<\/td><\/tr>\n<tr><td>数据条件<\/td><td>确认商品、临客挂帐、正常退款、目标建档和导入权限；交易通道是否测试模拟先核实，实际收款/退款最终动作遵从当次授权和工具约束。<\/td><\/tr>\n<tr><td>不足与继续条件<\/td><td>仅阻塞真正受影响分支；配置保护不允许的状态记录保护结果及不适用依据，不为制造非法前置而关闭保护。唯一待认领已存在不删除重建，创建分支记录环境限制及后续条件。<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>R10已通过实际HTTP页面核验后台西瓜、YST售票窗口/YST团队售票窗口和0.01测试商品；正常退款、回款及迁移入口可用。部署版本页面未显示，明确记为未知；不将可登录推导为全部权限或全部业务通过。<\/p>\n<h2>3. 执行阶段、依赖与必须留存的结果<\/h2>\n<div class=\"table-scroll\"><table><thead><tr><th>阶段<\/th><th>操作和先决依赖<\/th><th>本阶段必须留存<\/th><\/tr><\/thead><tbody>\n<tr><td>R0 准入<\/td><td>核对身份、景区、版本、权限、设备、商品和支付测试属性；记录原配置<\/td><td>环境记录、可见版本/未知说明、原配置及恢复清单；不计交易通过<\/td><\/tr>\n<tr><td>R1 档案与基础数据<\/td><td>先FL01，再准备普通临客/迁移订单及待认领账户<\/td><td>真实档案/账户号和原余额；各样本用途、订单总额/退款/净额<\/td><\/tr>\n<tr><td>R2 入款及组件<\/td><td>FL02创建来源，FL03按入口和主体模式分支；切换全景区归属须顺序完成恢复<\/td><td>原/新配置与加载时点、候选全集、来源单号、支付日/完成时刻、实际资源及编号<\/td><\/tr>\n<tr><td>R3 分配与回款<\/td><td>来源先成功未用；FL04及FL05各用途独立来源/订单<\/td><td>源负数/目标正数/收入关联单号、逐单结清、金额等式及前后余额<\/td><\/tr>\n<tr><td>R4 迁移<\/td><td>FL06使用未被回款/退款消耗的独立迁移样本<\/td><td>原/目标伙伴账户及订单归属、消费退款迁移记录、无新增实收<\/td><\/tr>\n<tr><td>R5 关联与报表<\/td><td>FL07/08复用已完成真实业务号，不重复造交易<\/td><td>前后台同号、导出内容、分组小计总计及日月统计、快照变更前后<\/td><\/tr>\n<tr><td>R6 保护与回归<\/td><td>FL09按正常顺序改状态；问题修复后沿原ID补轮次<\/td><td>具体失败/正常拒绝表现、影响分支、修复版本、实际回查、配置恢复结果<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>上表R0—R6是计划阶段，不是已经执行的轮次。实际执行轮次按当日记录新建，不预填通过。<\/p>\n<p>父项依赖是准备顺序，不代表“整个上游父项全通过才能查任何下游”；执行时以本分支所需成功数据和配置为准。前置提交结果未知，先回查单号及状态，不反复提交。互斥的回款/迁移/退款、不同成功分配必须分开样本，查账和跨端核对复用同单。<\/p>\n<h2>4. 全流程覆盖矩阵<\/h2>\n<div class=\"table-scroll\"><table><thead><tr><th>流程<\/th><th>前置和数据依赖<\/th><th>实际操作顺序<\/th><th>独立判断/分支<\/th><th>回查协议 / 用例<\/th><\/tr><\/thead><tbody>\n<tr><td>FL01 唯一档案与售票最小关联<\/td><td>管理员、甲乙身份已核验；D-01/D-04<\/td><td>建唯一预付款→窗口可见→售票排除待认领→充值两入口及账户锁定<\/td><td>未创建/已创建；唯一保护、隐藏草稿、售票候选和账户不可替换<\/td><td>P-READ；PM-001,PM-002,PM-028<\/td><\/tr>\n<tr><td>FL02 窗口待认领入款<\/td><td>FL01可用账户；D-02/D-05<\/td><td>只读账户→金额日期负责人→付款→成功/取消→余额正流水<\/td><td>选填/搜索；0/负数/小数精度；本日/补录；成功未使用<\/td><td>P-IN；PM-003,PM-007<\/td><\/tr>\n<tr><td>FL03 支付组件与日期<\/td><td>身份、专用资源及归属可恢复；回款表单先备临客订单<\/td><td>两入口长期充值、待认领入款、临客回款→普通支付→动态字段→保存快照<\/td><td>入口×五方式；账号/设备×扫码/POS×固定/多资源；默认/搜索/只读/失效；不制造故障<\/td><td>P-PAY；PM-004,PM-005,PM-006,PM-026<\/td><\/tr>\n<tr><td>FL04 来源选择及长期分配<\/td><td>FL02未用来源及启用长期目标；各成功用途独立来源<\/td><td>找成功未用款→查询单选→重选/取消→C/I分配→转出及目标回查<\/td><td>整笔单笔；不足/超过/负分配；C=S、C+I=S、C=0；旧来源不可复用<\/td><td>P-ALLOC；PM-008,PM-009,PM-010<\/td><\/tr>\n<tr><td>FL05 临客普通及来源回款<\/td><td>独立临客订单和成功退款样本；来源方式另需FL02<\/td><td>候选查询选择/先找款→净额计算→多单确认→普通或来源付款→逐单及账表<\/td><td>D净额；S&lt;D/S=D/S&gt;D；主动差额；状态排除；跨页选择；人工确认不绕保护<\/td><td>P-SETTLE；PM-011,PM-012,PM-013,PM-014,PM-015,PM-016<\/td><\/tr>\n<tr><td>FL06 临客转长期<\/td><td>另备未结清迁移订单；目标双账户及不足额度场景；不复用已回款订单<\/td><td>订单确认→新建/已有目标→同一迁移结果→订单归属与流水<\/td><td>企业/个人；挂帐/预付款；额度不足仍迁移；无效目标排除；取消无写入<\/td><td>P-MOVE；PM-017,PM-018<\/td><\/tr>\n<tr><td>FL07 前后台记录、导入与快照<\/td><td>已取得本轮真实交易单号；导入十一列当前模板<\/td><td>列表筛选→详情互查→导出→主数据改名改码/解绑→原单再查<\/td><td>同号同笔；备注关联；1/50/51导入及拒绝；前导零和历史快照不回写<\/td><td>P-RECORD；PM-019,PM-020,PM-021,PM-027<\/td><\/tr>\n<tr><td>FL08 账表与跨日归属<\/td><td>本轮入款、转出、充值、收入单号及甲乙日期负责人快照齐全<\/td><td>流水→窗口分组小计/总计→后台按日/月→导出逐单核算<\/td><td>支付日与完成时刻；原支付列负数；负责人分组；小计不重复加总；跨日不重收<\/td><td>P-REPORT；PM-022,PM-023,PM-024<\/td><\/tr>\n<tr><td>FL09 提交业务保护及配置刷新<\/td><td>独立未用来源/未结清单；配置可恢复<\/td><td>旧表单→正常顺序状态变化→提交回查；支付配置另按刷新/重开<\/td><td>业务状态重读；支付旧弹窗按已加载配置；重开必须读取新配置；恢复后回查<\/td><td>P-RECHECK；PM-025<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>全部父项均有正式条款/页面锚点、流程、独立分支、数据组及回查协议。展开下方“基线用例与执行分支”可看分支前置/步骤/预期/回查/恢复；完整原生文本见<a href=\"分支执行设计.md\">分支执行设计<\/a>。<\/p>\n<h2>5. 数据准备、互斥样本与分支组合<\/h2>\n<div class=\"table-scroll\"><table><thead><tr><th>组<\/th><th>最少准备与样例<\/th><th>用途<\/th><th>互斥及恢复<\/th><\/tr><\/thead><tbody>\n<tr><td>D-01 管理员、收银甲乙与窗口设备1/2<\/td><td>角色和绑定主体分别核验，账号与设备不同绑定用于识别串主体<\/td><td>所有分支<\/td><td>记录实际角色景区窗口及原绑定，不复制凭据<\/td><\/tr>\n<tr><td>D-02 每个成功使用目的独立未用来源<\/td><td>长期全充200；长期分配250=200+50；纯收入100=0+100；临客等额200；临客超额250；跨日另250<\/td><td>PM-007/010/014/015/024/025<\/td><td>同一来源成功使用一次；查账复用单号，其他成功用途另建来源<\/td><\/tr>\n<tr><td>D-03 临客正常/部分退款/全退/结清/迁移订单集合<\/td><td>普通D100；部分退款150−50；两单净额合计200；差异客户及负责人；分页样本数量超过实际页容量<\/td><td>PM-011—018/025<\/td><td>回款、退款、迁移互斥用途分开；排序样本先记下单支付实际时刻<\/td><\/tr>\n<tr><td>D-04 企业个人×默认挂帐/预付款及禁用目标<\/td><td>四类合法新建目标；不足额度且开启限制的两类目标；无效目标只用专属可恢复对象<\/td><td>PM-001/002/010/017/018/028<\/td><td>不切换有余额共享账户；原新消费规则检查只用正常允许路径<\/td><\/tr>\n<tr><td>D-05 扫码A/B、POS A/B及独立绑定<\/td><td>账号/设备×扫码/POS×固定/多资源；至少一文本编号含前导零；缺绑定等仅正常可构造配置<\/td><td>PM-004/005/006/025/026/027<\/td><td>每次切全景区归属前记原值；账号设备组合顺序执行，结束恢复并重开回查<\/td><\/tr>\n<tr><td>D-06 当前十一列模板的独立导入文件<\/td><td>1条合法、待认领拒绝、50行合法、51行整拒、重复本轮流水号；每成功行唯一标记<\/td><td>PM-021<\/td><td>上传前核对真实测试对象；保留导入结果和真实单号，不使用旧原型夹具充当结果<\/td><\/tr>\n<tr><td>D-07 本轮账表核对单号集合<\/td><td>原支付日入款、使用日转出、目标充值、公司收入，负责人不同以及单/多明细组<\/td><td>PM-022/023/024<\/td><td>查账只读复用已完成样本；不同支付编号至少两列，未发生列0.00<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>上述金额是便于核算的计划样例，按实际商品与QA计费生成合法数据；若替换金额，记录实际D/S/C/I和等式。0.01用于精度边界，不以其代替全部业务金额。<\/p>\n<p>每个分支给出计划样本标记QA-PM-20261111-分支ID，实际单号由执行时填写。只读查询/详情/报表复用同一成功样本；一个共享场景能同时满足多个检查时关联同单，不能以减少成本省掉实际检查。分页分支先确认页容量，再准备足够样本，不拿未知旧单判新增缺陷。<\/p>\n<div class=\"table-scroll\"><table><thead><tr><th>组合<\/th><th>拆分与记录规则<\/th><\/tr><\/thead><tbody>\n<tr><td>长期充值两入口×五普通方式<\/td><td>售票页与充值列表分别现金/扫码付/银行卡/微信/支付宝；各自记录动态区与当前伙伴上下文。扫码/POS完成后的单号与快照按PM-005-05各入口独立回查。<\/td><\/tr>\n<tr><td>四入口×资源8组合<\/td><td>售票页长期充值、列表长期充值、待认领入款、临客回款分别覆盖：账号/设备×扫码/POS×固定/多资源。原资源只读、默认、搜索、切换与编号分别留结果；可复用配置，但不能推导其他入口自动通过。<\/td><\/tr>\n<tr><td>正常输入与拒绝<\/td><td>空/0/负数/精度、未来日期、分配负值/合计不等、来源不足、已用来源、订单已结清分别记录；正常拒绝是通过，不作为缺陷。<\/td><\/tr>\n<tr><td>金额和目标分支<\/td><td>普通/来源回款不足、等额、超额主动收入；长期C=S、C+I=S、C=0；迁移企业/个人×默认挂帐/预付款，以及不足额度两种默认账户分别验证。<\/td><\/tr>\n<tr><td>支付刷新与业务重校验<\/td><td>后台配置变化只在刷新主页面或重开弹窗后检查新值；来源使用/订单退款结清/业务目标有效性另行提交重校验。旧支付弹窗未实时读取不判缺陷。<\/td><\/tr>\n<tr><td>快照与跨日<\/td><td>用本轮新单变更主数据后查原单；甲昨日250，乙今日结200＋收入50，昨天+250今天200+50−250=0。来源原方式/编号/负责人保留，不取使用人当前绑定。<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>组合不是要求每种状态都产生新交易：可见性、筛选、取消以只读/草稿完成；需要保存证明的分支才提交。接口并发、故障或保护禁止的配置不通过伪造状态来凑组合。<\/p>\n<h2>6. 每条用例怎么跑：字段六点与结果五点<\/h2>\n<p>先读对应正式条款与该分支前置，记录原配置/余额/状态；按真实菜单完成具体操作；按下表检查适用字段和结果；刷新跨端回查后持久化实际值、单号、身份设备和结果。父项只有所有本期必测分支通过才通过；一个有问题不能被其他通过抵消。<\/p>\n<div class=\"table-scroll\"><table><thead><tr><th>字段维度<\/th><th>实际检查内容<\/th><\/tr><\/thead><tbody>\n<tr><td>①存在性<\/td><td>本次定义的字段、列、按钮、关联链接齐全；不新增无关菜单/来源列。<\/td><\/tr>\n<tr><td>②容器和顺序<\/td><td>沿确认原型的列表/弹窗/原详情容器；标签、查询优先顺序、整行备注资料、金额单行表头和底部操作位置正确。<\/td><\/tr>\n<tr><td>③显示条件<\/td><td>待认领特殊字段隐藏；普通/来源、现金/资源、固定/多资源分别切换；只读、必填、可搜索、取消和切换清旧值正确。<\/td><\/tr>\n<tr><td>④默认和格式<\/td><td>默认日期/账户/候选方式/指定默认资源；金额两位、支付日00:00:00、前导零、空值—、快照负责人及时间来源正确。<\/td><\/tr>\n<tr><td>⑤保存和回显<\/td><td>提交前值与成功后、刷新后、窗口及后台同一单逐字段核对；备注长度和资源快照保持。<\/td><\/tr>\n<tr><td>⑥正常错误/取消<\/td><td>输入非法或业务状态已变化明确提示且拦截；取消无写入、草稿按需求保持；不出现前方式残留、半笔成功或不可达按钮。<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<div class=\"table-scroll\"><table><thead><tr><th>结果锚点<\/th><th>何时检查 / 必须记录<\/th><\/tr><\/thead><tbody>\n<tr><td>①当前业务及反馈<\/td><td>交易记录实际金额、支付方式、资源名称编号、操作人设备、状态和业务号；提示成功本身不足以判通过。查询/跳转只核对相应反馈。<\/td><\/tr>\n<tr><td>②原列表和详情持久化<\/td><td>刷新后按真实单号再查，定位正确详情和使用状态；正常拒绝/取消核对无新增对应记录。<\/td><\/tr>\n<tr><td>③跨端同一笔<\/td><td>窗口与后台逐字段一致，记录单号、金额、负责人、支付日/完成时刻和关联；不能复制一条前端提示当跨端证据。<\/td><\/tr>\n<tr><td>④适用账户与流水<\/td><td>入款、来源分配、结清按对应协议查前后余额及正负记录；只读页面不强制产生资金流水，迁移按消费/退款/调账往来核对。<\/td><\/tr>\n<tr><td>⑤关联与账表<\/td><td>逐单订单结果、来源/转出/目标/收入链接；窗口与后台日/月报表按单号集合核算；主数据变动后原快照不回写。<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>每类业务适用协议如下；不能访问的必查点记录影响及继续条件，不用其他点替代。仅页面证据明确写“UI持久化/跨端回查”，不宣称直查数据库或已证明故障事务原子性。<\/p>\n<div class=\"table-scroll\"><table><thead><tr><th>协议<\/th><th>必查位置<\/th><th>具体等式/一致性<\/th><\/tr><\/thead><tbody>\n<tr><td>P-READ<\/td><td>页面字段和操作可见性<\/td><td>查询或取消前后无档案/账户变更；正常新增后刷新列表和账户结构一致<\/td><\/tr>\n<tr><td>P-IN<\/td><td>W03反馈→W12/W13→B05/B08→B04余额→B11正流水→W16/B12<\/td><td>入款S：源余额差+S、充值+S、正流水+S、未使用；只原支付日实收一次<\/td><\/tr>\n<tr><td>P-PAY<\/td><td>当前弹窗→配置来源/本次主体→完成后W13/B08及适用收入详情<\/td><td>候选资格、排序、方式、资源名称编号、前导零；只读检查不要求造单，成功交易按所属业务协议回查<\/td><\/tr>\n<tr><td>P-ALLOC<\/td><td>W02/W04→W12/W13及W14/W15→B05/B08及B09/B10→源/目标账户→B11→W16/B12<\/td><td>来源S=C+I；源余额差−S、仅一笔负转出−S；目标差+C、收入I，C=0无零充值；原来源已用<\/td><\/tr>\n<tr><td>P-SETTLE<\/td><td>W05/W06→R01逐单→W12/W13及W14/W15→后台同一单→B11→W16/B12<\/td><td>D=Σ(总额−成功退款)；全部结清；S=D+I；来源支付另查−S及原单已用，普通支付无源转出；消费不重复<\/td><\/tr>\n<tr><td>P-MOVE<\/td><td>W08—W11→R01→后台档案双账户→B11→W05候选→W16<\/td><td>消费/退款归属和原售票员追溯；不按新消费额度阻断；不标回款，无新充值实收，迁移调账归调账<\/td><\/tr>\n<tr><td>P-RECORD<\/td><td>记录列表筛选→同号详情→前后台互查→导出内容→适用账户/流水<\/td><td>单号一一对应不复制入账；方式日期身份快照一致；导出行数金额符号与筛选一致<\/td><\/tr>\n<tr><td>P-REPORT<\/td><td>W16分组明细/小计/总计→B12日月及导出→本轮原单集合<\/td><td>小计按组、总计只加原明细一次；使用日C或D+I−S=0，原日+S；目标不含公司收入，转出原列负数<\/td><\/tr>\n<tr><td>P-RECHECK<\/td><td>原表单→正常状态变更→提交/重开→原单状态及适用关联记录<\/td><td>旧来源/已结清或退款变化不得重复处理；拒绝无半笔业务；支付配置按刷新重开口径，不宣称故障原子性验证<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>每分支记录：ID、版本、时间、景区、实际角色设备、前置原值、操作、预期、实际、业务号、验证位置、问题及恢复。分支前置/步骤和预期在执行前即可查看，不等执行后补一段“已通过”。<\/p>\n<h2>7. 页面、状态与响应式专项<\/h2>\n<div class=\"table-scroll\"><table><thead><tr><th>编号 / 页面<\/th><th>需核对状态<\/th><th>计划视口<\/th><\/tr><\/thead><tbody>\n<tr><td>W00 临时／长期合作伙伴售票页<\/td><td>正常选择伙伴、待认领排除、购物车有商品、充值返回、账户不可替换<\/td><td>1440×900<\/td><\/tr>\n<tr><td>W01 合作伙伴充值列表<\/td><td>待认领唯一行/普通行、空联系人负责人、查看与充值权限<\/td><td>1440×900<\/td><\/tr>\n<tr><td>W02 长期合作伙伴充值弹窗<\/td><td>普通/待认领来源、固定/多资源、现金/资源动态区、C=0/分配错误/取消<\/td><td>1440×900、1280×800、1024×768<\/td><\/tr>\n<tr><td>W03 待认领客户充值弹窗<\/td><td>初始/负责人搜索/可选留空、金额精度/备注边界、现金/资源、取消<\/td><td>1440×900、1280×800、1024×768<\/td><\/tr>\n<tr><td>W04 选择待认领充值记录弹窗<\/td><td>无匹配/有数据、各查询、单选重选取消、订单跨页、来源不足/足额/超额<\/td><td>1440×900、1280×800、1024×768<\/td><\/tr>\n<tr><td>W05 公共临时客户回款页面<\/td><td>待/已回款、无匹配/有数据、选择前后、切条件清选择、排序分页及链接<\/td><td>1440×900、1280×800、1024×768<\/td><\/tr>\n<tr><td>W06 公共临时客户回款弹窗<\/td><td>单/多订单、退款净额、普通/来源、不足/等额/超额主动确认、取消<\/td><td>1440×900、1280×800、1024×768<\/td><\/tr>\n<tr><td>W07 多订单客户／负责人不一致确认<\/td><td>一致不弹；客户/负责人差异、继续/返回、改选失效<\/td><td>1440×900、1280×800、1024×768<\/td><\/tr>\n<tr><td>W08 临客转长期：确认待迁移订单<\/td><td>订单净迁移、详情、差异确认、返回取消<\/td><td>1440×900、1280×800、1024×768<\/td><\/tr>\n<tr><td>W09 临客转长期：目标合作伙伴步骤<\/td><td>新建/已有两种目标切换、取消<\/td><td>1440×900、1280×800、1024×768<\/td><\/tr>\n<tr><td>W10 创建新目标伙伴表单<\/td><td>企业/个人、必填/去空/重复/长度、默认账户、返回取消<\/td><td>1440×900、1280×800、1024×768<\/td><\/tr>\n<tr><td>W11 选择已有目标伙伴<\/td><td>启用目标/排除目标、账户实时信息、额度不足、返回取消<\/td><td>1440×900、1280×800、1024×768<\/td><\/tr>\n<tr><td>W12 账户充值记录列表<\/td><td>入款/充值/转出、未用/已用、筛选排序及详情<\/td><td>1440×900<\/td><\/tr>\n<tr><td>W13 账户充值记录详情<\/td><td>来源/目标/收入关联、备注有无、只读资源快照及原详情容器<\/td><td>1440×900<\/td><\/tr>\n<tr><td>W14 其他收入记录列表<\/td><td>临客超额/来源分配收入、排序及无效展开移除<\/td><td>1440×900<\/td><\/tr>\n<tr><td>W15 其他收入详情<\/td><td>有备注/仅关联、收入目标来源链接和布局<\/td><td>1440×900<\/td><\/tr>\n<tr><td>W16 充值报表<\/td><td>单/多明细组、单/多负责人组合、动态列、负数、小计总计<\/td><td>1440×900、1280×800、1024×768<\/td><\/tr>\n<tr><td>B01 合作伙伴管理列表<\/td><td>唯一类型筛选与只读操作<\/td><td>1440×900<\/td><\/tr>\n<tr><td>B02 新增合作伙伴弹窗<\/td><td>待认领/普通切换、唯一保护、隐藏字段清草稿<\/td><td>1440×900<\/td><\/tr>\n<tr><td>B03 合作伙伴查看／编辑表单<\/td><td>待认领特殊只读、档案负责人不回写<\/td><td>1440×900<\/td><\/tr>\n<tr><td>B04 预付款管理列表与行内操作<\/td><td>预付款唯一、非负不可关闭、余额前后<\/td><td>1440×900<\/td><\/tr>\n<tr><td>B05 账户充值记录列表<\/td><td>窗口同笔记录、类型操作筛选导出、申请人排序<\/td><td>1440×900<\/td><\/tr>\n<tr><td>B06 新增充值弹窗／伙伴选择<\/td><td>排除待认领、长期/临客原流程正常<\/td><td>1440×900<\/td><\/tr>\n<tr><td>B07 批量导入弹窗及校验<\/td><td>十一列模板、1/50/51非空、待认领拒绝、重复流水号<\/td><td>1440×900<\/td><\/tr>\n<tr><td>B08 账户充值详情<\/td><td>同号充值详情及身份/来源/转出/目标关联<\/td><td>1440×900<\/td><\/tr>\n<tr><td>B09 其他收入列表<\/td><td>新增收入同号同金额、排序筛选导出<\/td><td>1440×900<\/td><\/tr>\n<tr><td>B10 其他收入详情<\/td><td>同号收入关联与备注整行<\/td><td>1440×900<\/td><\/tr>\n<tr><td>B11 资金流水<\/td><td>六标签、调账归类、操作名、正负、完成时间倒序<\/td><td>1440×900<\/td><\/tr>\n<tr><td>B12 合作伙伴对帐单<\/td><td>日/月、待认领消费列替换、目标不含收入、导出<\/td><td>1440×900<\/td><\/tr>\n<tr><td>R01 现有订单详情，由订单号打开<\/td><td>结清/迁移前后、原售票员及关联追溯；读取原销售/退票结果<\/td><td>1440×900<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>上述是计划尺寸，不是已测尺寸。实际记录innerWidth/innerHeight、弹窗内容滚动与按钮可达；受工具限制达不到的尺寸明确待补，不把请求尺寸当实际尺寸。1920×1080仅在动态宽表需要时追加。每页业务和样式状态独立，不由一条交易通过自动判30页通过。<\/p>\n<h2>8. 问题池、最少证据、复测和恢复<\/h2>\n<p>当前缺陷只收真实复现；功能逻辑与样式同池，问题数量与失败分支分开。同根因跨入口关联一次问题，修一入口只回归其实际关联分支，不能批量判其余组合通过。环境不可用单列阻塞；正常校验拒绝是通过。<\/p>\n<p>默认P0为核心阻断/重大错账数据风险，P1功能偏差，P2样式；按实际影响调整，不照抄支付旧缺陷等级。问题必须有入口、前置、步骤、预期、实际、影响、相关分支、单号和必要证据；首次通过只留具体结果和单号，不强制图片。临时成功图回填后清理，缺陷保必要去重现场；不为补图重复触发付款或退款。<\/p>\n<p>DEV-001保留为开发协同问题：产品支付口径已确认、实现待核验，不冒记功能缺陷或修复通过。后续复现不一致另建缺陷关联DEV-001。规则调整写来源/旧新口径/影响，按方案关闭不同于修复通过，不覆盖旧轮次。<\/p>\n<p>每次临时配置保存前记录原值、适用主体及变更内容；结束恢复后按支付刷新/重开检查候选和绑定。业务单据保留审计，不删单/人工调账伪造恢复。中断保存实际单号、未知提交及恢复义务，续跑先查当前状态。<\/p>\n<h2>9. 执行完成、验收通过与交付条件<\/h2>\n<div class=\"table-scroll\"><table><thead><tr><th>判定层次<\/th><th>条件<\/th><\/tr><\/thead><tbody>\n<tr><td>单分支通过<\/td><td>具体预期满足，字段六点及结果五点的适用项有实际记录，刷新后结果一致；配置已恢复或明确记录未恢复影响；不是仅成功提示。<\/td><\/tr>\n<tr><td>父项通过<\/td><td>全部本期必测分支通过；有问题优先，其后阻塞/未跑；不适用或后续不算通过。<\/td><\/tr>\n<tr><td>执行完成<\/td><td>当前台账342个必测分支均有明确结果，无未跑；实际不能准备的前置逐项说明影响及继续条件，不能把阻塞当通过。<\/td><\/tr>\n<tr><td>建议接收<\/td><td>本期必测通过，无未关闭重大资金/数据问题或关键功能缺陷；带问题接收由用户明确决定并留影响，AI不代替产品批准。<\/td><\/tr>\n<tr><td>页面与恢复<\/td><td>逐页/实际视口独立交付；未测尺寸不外推。临时配置清单和恢复回查闭合，未恢复项单列。<\/td><\/tr>\n<tr><td>交付<\/td><td>本轮实测与累计分别列，当前问题、待复测、未跑/阻塞、范围调整及DEV-001实现状态清楚；HTML/台账/原始记录同源。只本地更新，不自动上传发布。<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>2026-11-11最初只完成方法设计；后续R01—R11已实际执行。当前回归按用户已确认范围继续，保留各轮记录，不以本方案文字替代真实结果，也不把执行完成当全部验收通过。<\/p>\n<h2>10. 支付报告23个伙伴待验分支逐项映射<\/h2>\n<p>原支付报告保留其历史后续验证状态。本表只在增补项目承接必要联动，新数据新执行，不复制支付通过结论。A02/A19/A20/A64仅回归候选/账户锁定，与本次共用支付和W00关联；不扩展完整售票流程。<\/p>\n<div class=\"table-scroll\"><table><thead><tr><th>支付原分支<\/th><th>原检查<\/th><th>本次对应独立分支<\/th><th>范围与去重<\/th><\/tr><\/thead><tbody>\n<tr><td>A02-04<\/td><td>伙伴账户候选<\/td><td>PM-028-01、PM-028-02、PM-028-03<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<tr><td>A19-01<\/td><td>长期挂帐<\/td><td>PM-028-01<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<tr><td>A19-02<\/td><td>长期预付款<\/td><td>PM-028-02<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<tr><td>A19-03<\/td><td>临时客户<\/td><td>PM-028-03<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<tr><td>A20-01<\/td><td>默认方式停用<\/td><td>PM-028-04<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<tr><td>A20-02<\/td><td>取消长期场景<\/td><td>PM-028-05<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<tr><td>A21-01<\/td><td>售票页充值入口<\/td><td>PM-002-03<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<tr><td>A21-02<\/td><td>列表行充值入口<\/td><td>PM-002-03-S02<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<tr><td>A22-01<\/td><td>售票页×现金<\/td><td>PM-006-03<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<tr><td>A22-02<\/td><td>售票页×扫码付<\/td><td>PM-006-03-S02<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<tr><td>A22-03<\/td><td>售票页×银行卡<\/td><td>PM-006-03-S03<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<tr><td>A22-04<\/td><td>售票页×微信<\/td><td>PM-006-03-S04<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<tr><td>A22-05<\/td><td>售票页×支付宝<\/td><td>PM-006-03-S05<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<tr><td>A22-06<\/td><td>列表行×现金<\/td><td>PM-006-03-S06<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<tr><td>A22-07<\/td><td>列表行×扫码付<\/td><td>PM-006-03-S07<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<tr><td>A22-08<\/td><td>列表行×银行卡<\/td><td>PM-006-03-S08<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<tr><td>A22-09<\/td><td>列表行×微信<\/td><td>PM-006-03-S09<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<tr><td>A22-10<\/td><td>列表行×支付宝<\/td><td>PM-006-03-S10<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<tr><td>A23-01<\/td><td>两入口×扫码付逐笔回查<\/td><td>PM-005-05、PM-005-05-S03<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<tr><td>A23-02<\/td><td>两入口×银行卡逐笔回查<\/td><td>PM-005-05-S02、PM-005-05-S04<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<tr><td>A29-04<\/td><td>充值两入口扫码/POS<\/td><td>PM-005-05、PM-005-05-S02、PM-005-05-S03、PM-005-05-S04<\/td><td>纳入本次必要联动；与A23复用同批实际新单回查，不重复造数或计通过。<\/td><\/tr>\n<tr><td>A62-05<\/td><td>充值两入口<\/td><td>PM-026-01、PM-026-02、PM-026-03、PM-026-04、PM-026-05、PM-026-06、PM-026-07、PM-026-08、PM-026-09、PM-026-10、PM-026-11、PM-026-12<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<tr><td>A64-03<\/td><td>伙伴账户锁定<\/td><td>PM-028-01、PM-028-02、PM-028-03、PM-028-04、PM-028-05<\/td><td>纳入本次必要联动；本次共用支付的必要联动；仅映射不继承旧结果。<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>映射中的多对多关系表示一个原分支对应多个真实组合，或多个原分支共用同一已完成新单；统计以本项目唯一分支ID为准，不把23再加到总数。各映射结果见对应分支最近实际轮次；R10支付搜索、默认及失效保护已验证；R11售票钱包关闭重开已正常读取新设备默认资源（PM-BUG-005），顶部刷新两分支未重跑，不能概括为全部统一通过。<\/p>"}</script><script>'use strict';
const S=JSON.parse(document.getElementById('report-data').textContent);
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const text=x=>Array.isArray(x)?x.map(text).join('\n'):x&&typeof x==='object'?Object.entries(x).map(([k,v])=>`${k}：${text(v)}`).join('\n'):String(x??'');
const safe=p=>/^(?:javascript|data|vbscript|file):/i.test(String(p??''))?'':String(p??'');
const link=(p,label)=>safe(p)?`<a href="${esc(safe(p))}">${esc(label||p)}</a>`:esc(label||'未关联');
const empty=message=>`<div class="card muted">${esc(message)}</div>`;
const sc=v=>v.scope||'本期必测';
const activeIssues=S.issues.filter(i=>i.status!=='误判撤销');
const currentIssues=activeIssues.filter(i=>['当前缺陷','待复测'].includes(i.status));
function parent(c){const vs=c.variants.filter(v=>sc(v)==='本期必测');if(!vs.length)return c.variants.some(v=>sc(v)==='后续验证')?'后续验证':c.variants.some(v=>sc(v)==='本轮不执行')?'本轮不执行':'不适用';for(const st of ['有问题','阻塞','未跑'])if(vs.some(v=>v.status===st))return st;return '通过';}
const field=(name,value)=>value!==undefined&&value!==null&&text(value)!==''?`<div class="field"><b>${esc(name)}</b><div>${esc(text(value))}</div></div>`:'';
const fields=rows=>`<div class="detail-grid">${rows.map(([k,v])=>field(k,v)).join('')}</div>`;
function evidence(items=[]){return `<div class="evidence-links">${items.map(e=>{const p=typeof e==='string'?e:e.path;const label=typeof e==='string'?p.split('/').pop():e.label||p.split('/').pop();return /\.(?:png|jpe?g|webp|gif)(?:[?#].*)?$/i.test(p)?`<a class="evidence-link" href="${esc(safe(p))}" data-image="${esc(safe(p))}">${esc(label)}</a>`:link(p,label);}).join(' · ')}</div>`;}
function options(id,label,values){$(id).innerHTML=`<option value="">${esc(label)}</option>`+[...new Set(values.filter(Boolean))].map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');}
function table(headers,rows){return `<div class="card table-scroll"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function caseLink(id){return `<a href="#case-${esc(id)}" data-case="${esc(id)}">${esc(id)}</a>`;}
function runDetail(r){return `<details class="run"><summary>${esc(r.runId)} · ${esc(r.executedAt||'')} ${badge(r.originalResult||r.result)}</summary>${fields([['前置',r.preconditions],['步骤',r.steps],['预期',r.expected],['实际',r.actual],['业务编号',r.businessIds||r.businessId],['验证位置',r.verification],['版本',r.build],['身份 / 设备',[r.actor,r.device].filter(Boolean)],['关联问题',r.issueIds],['原记录',r.documents]])}${evidence(r.evidence)}</details>`;}

const badge=st=>`<span class="chip ${st==='通过'||st==='已验证修复'?'status-pass':['有问题','当前缺陷','待复测'].includes(st)?'status-fail':''}">${esc(st)}</span>`;
$('side-title').textContent=`${S.project.name} · ${S.project.version||''}`;
$('side-subtitle').textContent='验收方案'+(S.project.planDate?' · '+S.project.planDate:'');
$('eyebrow').textContent=`${S.project.version||'PC WEB'} · QA ACCEPTANCE PLAN`;
$('title').textContent=`${S.project.name}｜验收方案与执行总览`;
$('summary').textContent=S.project.summary||'先确认执行方案，再用测试环境新数据验证完整业务链路。';
$('scheme-back').innerHTML=S.project.schemeEntry?link(S.project.schemeEntry,'← 返回需求方案'):'<span class="sub">正式方案入口待关联</span>';
$('case-nav').textContent=S.cases.length+'条基线与执行分支';
const st=S._stats,n=st.results;
const statuses=['通过','有问题','未跑','阻塞','后续验证','本轮不执行',...(S.cases.some(c=>parent(c)==='不适用')?['不适用']:[])];
$('metrics').innerHTML=statuses.map(s=>`<div class="metric"><strong>${S.cases.filter(c=>parent(c)===s).length}</strong><span>${esc(s)} · 基线项</span></div>`).join('');
$('phase').textContent=S.phase||S.project.phase||(S.runs.length?'本页按执行台账汇总':'方案待确认，未执行QA');
$('notice').textContent=S.runs.length?'本页按执行台账汇总；测试结论以对应版本、单据和证据为准。':'尚未执行测试环境验证。通过0、有问题0不代表系统无缺陷；此前原型验证不计入本轮。';
$('business-body').innerHTML=`<p>${esc(S.phase||S.project.decision||'以当前确认基线与各轮实际记录为准')}。</p><p>执行分支：通过 ${n['通过']||0}，有问题 ${n['有问题']||0}，未跑 ${n['未跑']||0}，阻塞 ${n['阻塞']||0}；后续验证 ${st.scope['后续验证']||0}，本轮不执行 ${st.scope['本轮不执行']||0}，不适用 ${st.scope['不适用']||0}，均不计通过。</p><p>当前问题 ${currentIssues.length} 项 · 已验证修复 ${st.issues['已验证修复']||0} 项 · 方案调整后关闭 ${st.issues['方案调整后关闭']||0} 项。</p>${S.project.reportNote?`<p class="muted">${esc(S.project.reportNote)}</p>`:''}`;
$('total').textContent='执行分支：'+statuses.map(s=>s+' '+S.cases.flatMap(c=>c.variants).filter(v=>(sc(v)==='本期必测'?v.status:sc(v))===s).length).join(' / ')+`。${S.cases.length}条基线 / ${st.variants}个执行分支；每个分支保留独立记录。`;
const modules=[...new Set(S.cases.map(c=>c.module))];
$('module-grid').innerHTML=modules.map(m=>{const cs=S.cases.filter(c=>c.module===m);return `<button class="module-card" type="button" data-module="${esc(m)}"><span>${esc(m)}</span><strong>${cs.length} 条基线</strong><small>基线全部通过 ${cs.filter(c=>parent(c)==='通过').length}/${cs.length} · ${cs.reduce((s,c)=>s+c.variants.length,0)} 个执行分支<br>分支通过 ${cs.flatMap(c=>c.variants).filter(v=>v.status==='通过').length} · 有问题 ${cs.flatMap(c=>c.variants).filter(v=>v.status==='有问题').length} · 阻塞 ${cs.flatMap(c=>c.variants).filter(v=>v.status==='阻塞').length} · 未跑 ${cs.flatMap(c=>c.variants).filter(v=>v.status==='未跑').length}</small></button>`;}).join('')||empty('尚未建立模块覆盖');
options('module','全部模块',modules);
options('case-status','全部状态',['通过','有问题','未跑','阻塞','后续验证','本轮不执行','不适用']);
function variantPlan(v){const rows=[['前置',v.preconditions],['数据组',v.dataIds],['计划样本标记（非真实单号）',v.sampleKey],['依赖',v.dependencies],['步骤',v.steps],['具体预期',v.expected],['回查位置',v.verification],['协议',v.protocolId],['必查点位',v.checkpoints],['恢复',v.restoration],['退出条件',v.exitCriteria]];if(!rows.some(([,value])=>text(value))&&!v.ruleRefs?.length)return '';return `<details class="run planned-design"><summary>查看本分支执行设计（非执行结果）</summary>${fields(rows)}${v.ruleRefs?.length?`<p>需求依据：${v.ruleRefs.map(r=>link(r.path,r.label)).join(' · ')}</p>`:''}</details>`;}
function renderCases(){const q=$('search').value.trim().toLowerCase(),m=$('module').value,status=$('case-status').value;const cs=S.cases.filter(c=>(!q||JSON.stringify(c).toLowerCase().includes(q))&&(!m||c.module===m)&&(!status||parent(c)===status));$('filter-count').textContent=`显示 ${cs.length} / ${S.cases.length} 条`;$('case-list').innerHTML=cs.map(c=>`<details class="case" id="case-${esc(c.id)}"><summary><span class="case-id">${esc(c.id)}</span><span class="label">${esc(c.action)}</span>${badge(parent(c))}</summary><div class="case-body"><p class="muted">${esc([c.module,text(c.pages),text(c.flow)].filter(Boolean).join(' · '))}</p><p><strong>预期：</strong>${esc(c.expected)}</p><p><strong>执行：</strong>${esc(c.execution||'记录前置配置 → 按下列分支逐项操作 → 在适用位置回查 → 保存实际值、业务编号和必要问题证据。')}</p><ul>${c.variants.map(v=>`<li id="variant-${esc(v.id)}"><strong>${esc(v.id)}</strong> ${esc(v.label)} ${badge(sc(v)==='本期必测'?v.status:sc(v))}${v.reason?`<p>${esc(v.reason)}</p>`:''}${variantPlan(v)}${v.runs?.length?`<div class="run">${v.runs.map(r=>`<p><strong>${esc(r.runId)} · ${esc(r.executedAt||'')}</strong></p><p><strong>实际结果：</strong>${esc(r.actual)}</p><p><strong>测试单据：</strong>${esc(text(r.businessIds||r.businessId||r.documents)||'见执行记录')}</p>${(r.preconditions||r.steps||r.verification)?`<details><summary>查看前置、操作与验证记录</summary>${fields([['前置',r.preconditions],['操作',r.steps],['验证位置',r.verification],['预期',r.expected],['结果',r.originalResult||r.result],['关联问题',r.issueIds]])}</details>`:''}<p>${evidence(r.evidence)}</p>`).join('')}</div>`:''}</li>`).join('')}</ul></div></details>`).join('');$('case-empty').hidden=cs.length!==0;document.querySelectorAll('[data-module]').forEach(b=>b.classList.toggle('active',b.dataset.module===m));}
options('issue-severity','全部等级',activeIssues.map(i=>i.severity).sort());
options('issue-module','全部模块',activeIssues.map(i=>i.module||i.category));
options('issue-type','全部类型',activeIssues.map(i=>i.type));
options('issue-status','全部问题状态',activeIssues.map(i=>i.status));
function issueField(label,value){return `<li><strong>${esc(label)}：</strong>${esc(text(value)||'—')}</li>`;}
function renderIssues(){const q=$('issue-search').value.toLowerCase(),sev=$('issue-severity').value,m=$('issue-module').value,t=$('issue-type').value,status=$('issue-status').value;const rows=activeIssues.filter(i=>(!q||JSON.stringify(i).toLowerCase().includes(q))&&(!sev||i.severity===sev)&&(!m||(i.module||i.category)===m)&&(!t||i.type===t)&&(!status||i.status===status));$('issue-count').textContent=`显示 ${rows.length} / ${activeIssues.length} 项`;$('issue-list').innerHTML=rows.map(i=>`<details class="issue-card" id="issue-${esc(i.id)}" data-severity="${esc(i.severity)}"><summary><span class="issue-id">${esc(i.id)}</span><span class="issue-title">${esc(i.title)}</span><span class="issue-tags">${badge(i.module||i.category)} ${badge(i.type)} <span class="chip severity ${esc(i.severity.toLowerCase())}">${esc(i.severity)}</span> ${badge(i.status)}</span><span class="chevron" aria-hidden="true">⌄</span></summary><div class="issue-body markdown-body"><ul>${issueField('所属流程',i.flow)}${issueField('QA入口',i.entry)}${issueField(i.status==='已验证修复'?'原缺陷表现（历史）':'QA实际',i.actual)}${issueField(i.status==='方案调整后关闭'?'原测试预期（历史）':'方案/原型预期',i.expected)}${issueField('确认后的处理',i.resolution||i.scopeResolution)}${issueField('影响',i.impact)}${issueField('状态',i.retest)}</ul>${i.preconditions?`<p><strong>前置：</strong>${esc(text(i.preconditions))}</p>`:''}<div class="repro"><strong>复现步骤</strong><ol>${(Array.isArray(i.steps)?i.steps:[i.steps]).filter(Boolean).map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div><p class="evidence-links"><strong>证据：</strong>${evidence(i.evidence)}</p><p class="muted"><strong>测试恢复：</strong>${esc(i.restoration||'—')}</p>${i.cases?.length?`<p>关联：${i.cases.map(id=>{const c=S.cases.find(c=>c.id===id||c.variants.some(v=>v.id===id));return c?caseLink(c.id)+' '+esc(id):esc(id);}).join(' · ')}</p>`:''}</div></details>`).join('')||empty(activeIssues.length?'当前筛选无匹配问题。':S.runs.length?'尚无已复现问题；不等于系统无缺陷。':'尚未执行，暂未登记问题');}
// Supplemental structured data stays inside the execution plan, never a replacement main navigation.
$('plan-supplements').innerHTML=[['coverage','覆盖映射','coverage-body',S.coverage?.length],['scenarios','场景与测试数据','scenario-body',S.scenarios?.length||S.data?.length],['pages','页面与视口专项记录','page-list',S.pages?.length],['runs','轮次记录','run-list',S.runs?.length],['changes','规则变更记录','change-list',S.changes?.length],['blockers','环境与阻塞记录','blocker-list',S.blockers?.length],['sources','资料与环境登记','document-list',true]].filter(x=>x[3]).map(([id,title,body])=>`<details class="supplement" id="${id}"><summary>${esc(title)}</summary><div id="${body}"></div></details>`).join('');
for(const id of ['coverage-body','scenario-body','page-list','run-list','change-list','blocker-list'])if(!$(id)){const el=document.createElement('div');el.id=id;el.hidden=true;$('plan-supplements').append(el);}
$('coverage-body').innerHTML=S.coverage?.length?table(['编号 / 规则与流程','页面 / 场景','关联用例'],S.coverage.map(c=>[esc(`${c.id} ${c.name}\n${text(c.flow)}`),esc(`${text(c.pages)}\n${text(c.scenario)}`),(c.caseIds||[]).map(caseLink).join(' · ')])):empty('尚未建立覆盖地图');
const scenarios=S.scenarios||[],data=S.data||[];
$('scenario-body').innerHTML=scenarios.map(c=>`<details class="case"><summary>${esc(c.id)} ${esc(c.name)}</summary><div class="case-body">${fields([['前置',c.preconditions],['完整操作顺序',c.steps],['预期',c.expected]])}<p>${(c.caseIds||[]).map(caseLink).join(' · ')}</p></div></details>`).join('')+(data.length?table(['数据','业务编号 / 用途','状态 / 恢复'],data.map(d=>[esc(`${d.id} ${d.name||''}`),esc(`${text(d.businessId)}\n${text(d.usage)}`),esc(`${text(d.status)}\n${text(d.restoration)}`)])):'');

$('page-list').innerHTML=S.pages?.length?S.pages.map(p=>`<details class="case"><summary>${esc(p.id)} ${esc(p.name)} ${badge(p.scope==='后续验证'?'后续验证':p.status||'未核对')}</summary><div class="case-body">${fields([['入口',p.entry],['当前页面状态',p.status]])}${p.prototype?link(p.prototype,'打开确认原型'):''}${(p.checks||[]).map(c=>`<div class="run">${fields([['轮次',c.runId],['实际视口',c.viewport],['结果',c.result],['实际观察',c.actual]])}${evidence(c.evidence)}</div>`).join('')||'<p class="muted">未登记逐页/视口核对记录，不由业务通过自动推导。</p>'}</div></details>`).join(''):empty('尚未登记适用页面专项');
$('plan-text').innerHTML=S._planHtml||'<p>尚未建立验收方案</p>';
$('run-list').innerHTML=S.runs.map(r=>`<details class="case"><summary>${esc(r.runId)} · ${esc(r.executedAt||'')} ${esc(r.summary||'')}</summary><div class="case-body">${fields([['版本',r.build],['身份',r.actor],['设备',r.device],['本轮摘要',r.summary],['恢复与保留',r.restoration]])}${r.record?link(r.record,'原始执行记录'):''}${evidence(r.evidence)}</div></details>`).join('')||empty('尚未执行，无历史轮次');
$('change-list').innerHTML=(S.changes||[]).map(c=>`<details class="case"><summary>规则变化 · ${esc(c.date||'')}</summary><div class="case-body">${fields(Object.entries(c))}</div></details>`).join('');
$('blocker-list').innerHTML=(S.blockers||[]).map(b=>`<details class="case"><summary>${esc(b.id)} ${esc(b.title)} ${badge(b.status||'历史记录，见当前分支')}</summary><div class="case-body">${fields([['实际',b.actual],['影响',b.impact],['继续条件 / 恢复',b.recovery],['关联',b.caseIds||b.case]])}${evidence(b.evidence)}</div></details>`).join('')||empty('当前未登记环境阻塞；不代表所有用例均已执行');
const docs=[{label:'用例与缺陷台账',path:'QA测试用例与缺陷台账.md'},{label:'结果与问题清单',path:'QA测试结果与问题清单.md'},{label:'任务索引',path:'任务索引.md'},{label:'统一执行数据',path:'qa-state.json'},...(S.documents||[])];
$('document-list').innerHTML=docs.map(d=>`<p>${link(d.path,d.label)}</p>`).join('');
$('document-list').insertAdjacentHTML('beforeend',fields([['环境',S.environment],['方案状态',S.plan?.status],['菜单验证',S.menuIntegration?.verified?'已登记双向实测':'尚未登记双向实测'],['资料提醒',S._warnings]]));
const headings=[...$('plan-text').querySelectorAll('h2')];headings.forEach((h,i)=>h.id='plan-'+(i+1));
$('plan-nav').innerHTML=headings.length?headings.map(h=>link('#'+h.id,h.textContent)).join(''):link('#plan','验收执行方案');
$('plan-button').href=headings.length?'#'+headings[0].id:'#plan';
const executionDocs=S.reportNavigation?.execution||[...S.runs].reverse().filter(r=>r.record).map(r=>({label:r.runId+(r.navLabel?' '+r.navLabel:''),path:r.record}));
$('execution-nav').innerHTML=executionDocs.length?executionDocs.map(d=>link(d.path,d.label+' ↗')).join(''):'<div class="sub">尚无执行记录</div>';
const sourceDocs=S.reportNavigation?.sources||[{label:'验收方案 Markdown',path:S.plan?.file},...docs.filter(d=>!S.documents?.some(x=>x.path===d.path)||d.path===S.plan?.file)].filter(d=>d.path);
$('source-nav').innerHTML=sourceDocs.map(d=>link(d.path,d.label+' ↗')).join('');
$('footer').textContent=S.project.footer||'正式源目录 · 测试与验收 · 未自动上传';

for(const id of ['search','module','case-status'])$(id).addEventListener(id==='search'?'input':'change',renderCases);
for(const id of ['issue-search','issue-severity','issue-module','issue-type','issue-status'])$(id).addEventListener(id==='issue-search'?'input':'change',renderIssues);
$('reset').onclick=()=>{for(const id of ['search','module','case-status'])$(id).value='';renderCases();};
$('issue-reset').onclick=()=>{for(const id of ['issue-search','issue-severity','issue-module','issue-type','issue-status'])$(id).value='';renderIssues();};
document.addEventListener('click',e=>{const module=e.target.closest('[data-module]');if(module){$('module').value=module.dataset.module;renderCases();$('cases').scrollIntoView();}const a=e.target.closest('[data-case]');if(a){e.preventDefault();$('reset').click();const el=$('case-'+a.dataset.case);if(el){el.open=true;el.scrollIntoView();history.replaceState(null,'','#'+el.id);}}const img=e.target.closest('[data-image]');if(img){e.preventDefault();$('evidence-image').src=img.dataset.image;$('evidence-title').textContent=img.textContent;$('evidence-image').style.maxWidth='100%';$('evidence-dialog').showModal();}});
$('close-evidence').onclick=()=>$('evidence-dialog').close();
$('image-size').onclick=()=>{$('evidence-image').style.maxWidth=$('evidence-image').style.maxWidth==='none'?'100%':'none';};
$('print').onclick=()=>{const details=[...document.querySelectorAll('details')],old=details.map(d=>d.open);details.forEach(d=>d.open=true);window.addEventListener('afterprint',()=>details.forEach((d,i)=>d.open=old[i]),{once:true});window.print();};
renderCases();renderIssues();
if(location.hash.startsWith('#case-')){const el=$(decodeURIComponent(location.hash.slice(1)));if(el){el.open=true;el.scrollIntoView();}}
</script></body></html>
