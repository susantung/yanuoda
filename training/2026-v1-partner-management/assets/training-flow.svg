<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
  <title id="title">V3.2 合作伙伴业务操作路径</title>
  <desc id="desc">选择企业个人或公共临时客户，按默认账户类型出票；固定伙伴直接充值，公共临时客户充值须选择未回款订单，多余款项计入其他收入。</desc>
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#211a49}
    .title{font-size:27px;font-weight:700}.head{font-size:20px;font-weight:700}.body{font-size:16px;fill:#574e64}
    .box{fill:#fff;stroke:#d8c8f6;stroke-width:2}.lane{fill:#f5f3ff;stroke:#ded4f3}.fixed{fill:#eaf7ff;stroke:#a3d4f5}.temp{fill:#fff7e9;stroke:#f3cd87}
    .line{fill:none;stroke:#8756d9;stroke-width:3;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11" fill="none" stroke="#8756d9" stroke-width="2"/></marker></defs>
  <rect width="1400" height="470" rx="20" fill="#fcfbff"/>
  <text class="title" x="700" y="48" text-anchor="middle">从售票到充值、回款的两条路径</text>
  <rect class="box" x="68" y="90" width="238" height="115" rx="14"/><text class="head" x="187" y="132" text-anchor="middle">选择合作伙伴</text><text class="body" x="187" y="168" text-anchor="middle">企业 / 个人 / 公共临客</text>
  <path class="line" d="M306 147 H357"/>
  <rect class="box" x="365" y="90" width="275" height="115" rx="14"/><text class="head" x="502" y="132" text-anchor="middle">售票确认</text><text class="body" x="502" y="166" text-anchor="middle">账户类型取当前默认值</text><text class="body" x="502" y="190" text-anchor="middle">支付方式锁定，出票再校验</text>
  <path class="line" d="M640 147 H697"/>
  <rect class="box" x="705" y="90" width="270" height="115" rx="14"/><text class="head" x="840" y="132" text-anchor="middle">生成订单与消费流水</text><text class="body" x="840" y="169" text-anchor="middle">保存实际账户类型快照</text>
  <path class="line" d="M975 147 H1032"/>
  <rect class="box" x="1040" y="90" width="290" height="115" rx="14"/><text class="head" x="1185" y="132" text-anchor="middle">查询与售后</text><text class="body" x="1185" y="168" text-anchor="middle">按订单原账户类型退款</text>
  <path class="line" d="M500 205 V260 H382 V278"/>
  <path class="line" d="M840 205 V260 H1032 V278"/>
  <rect class="fixed" x="90" y="285" width="580" height="130" rx="15"/><text class="head" x="380" y="326" text-anchor="middle">企业 / 个人：直接充值当前默认账户</text><text class="body" x="380" y="359" text-anchor="middle">处理操作为充值或调账；账户类型只读带出挂帐 / 预付款</text><text class="body" x="380" y="388" text-anchor="middle">不选择待回款订单，不维护订单级回款状态</text>
  <rect class="temp" x="725" y="285" width="605" height="130" rx="15"/><text class="head" x="1027" y="326" text-anchor="middle">公共临客：挂帐回款逐笔选单</text><text class="body" x="1027" y="359" text-anchor="middle">只选未回款挂帐订单；本次应回款＝订单额－成功退款</text><text class="body" x="1027" y="388" text-anchor="middle">超过应回款的金额只能另记其他收入</text>
  <text class="body" x="700" y="450" text-anchor="middle">临时客户转合作伙伴仅迁移未回款订单；目标伙伴可使用挂帐或预付款默认账户类型</text>
</svg>
